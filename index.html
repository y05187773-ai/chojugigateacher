<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="授業コックピット">
<title>授業コックピット</title>
<style>
/* 案B「授業中モード型」（設計メモ/教師用コックピット_レイアウト案/）。色は児童用サイトとそろえる */
:root {
  --bg: #f3f1ec; --card: #fff; --ink: #222; --sub: #5d5d5d; --line: #ddd8cc;
  --c1: #2f6fb5; --c1s: #e6effa;   /* ①〜④ 読んで見つける */
  --c2: #2e8b57; --c2s: #e3f3ea;   /* ⑤〜⑧ 材料を集める */
  --c3: #d9822b; --c3s: #fdf0e1;   /* ⑨⑩ 書いて伝える */
  --accent: var(--c1); --accent-soft: var(--c1s); --warn: #b3261e; --warn-soft: #fde8e6;
  --ok: var(--c2); --ok-soft: var(--c2s); --mark: #fff4b8;
  --pc: var(--c1); --ps: var(--c1s);   /* いま選んでいる時間の色 */
  --top: 80px; --nav: 66px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 17px; line-height: 1.65; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; min-height: 48px; user-select: none; -webkit-user-select: none; }
button:active { transform: scale(.98); }
button.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
button.sm { min-height: 40px; padding: 4px 12px; font-size: 15px; }
input[type=text], input[type=date], input[type=number], input[type=url], input[type=search], textarea, select { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; min-height: 48px; }
textarea { width: 100%; min-height: 140px; }

/* 上の帯：すごろく（押すと時間を切りかえる） */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.hd { height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 14px; max-width: 1280px; margin: 0 auto; }
.hd > b { font-size: 14px; line-height: 1.3; color: var(--sub); white-space: nowrap; }
.board { flex: 1; min-width: 0; display: flex; justify-content: center; overflow-x: auto; padding-top: 6px; scrollbar-width: none; }
.board::-webkit-scrollbar { display: none; }
.sq { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; position: relative; border: 0; background: none; padding: 0; min-height: 0; border-radius: 0; }
.sq::before { content: ""; position: absolute; top: 17px; left: -37px; width: 74px; height: 4px; background: #d6d2c8; }
.sq:first-child::before { display: none; }
.sq .n { width: 38px; height: 38px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; background: var(--q); }
.sq .w { font-size: 11px; color: var(--sub); line-height: 1.3; margin-top: 2px; white-space: nowrap; }
.sq.today .w { color: var(--ink); font-weight: 700; }
.sq.today .w::before { content: "● "; color: var(--warn); }
.sq.on .n { width: 44px; height: 44px; margin-top: -3px; font-size: 19px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--q); }
.sq.on .w { color: var(--ink); font-weight: 700; margin-top: 5px; }
.q1 { --q: var(--c1); } .q2 { --q: var(--c2); } .q3 { --q: var(--c3); }
.modesw { display: flex; background: #ebe8e1; border-radius: 999px; padding: 3px; flex: 0 0 auto; }
.modesw button { border: 0; background: none; min-height: 40px; border-radius: 999px; padding: 2px 16px; font-weight: 700; color: var(--sub); }
.modesw button.on { background: var(--pc); color: #fff; }
.hd .mini { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; padding: 2px 10px; border-radius: 8px; background: #eee; display: none; }
.hd .mini.run { display: block; background: var(--pc); color: #fff; }
.hd .mini.hit { background: var(--warn); color: #fff; }

/* 下のタブ：親指で押す */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { display: grid; grid-template-columns: repeat(6, 1fr); max-width: 1280px; margin: 0 auto; height: var(--nav); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--sub); min-height: var(--nav); padding: 4px 2px; }
nav.tabs button .ic { font-size: 22px; line-height: 1; }
nav.tabs button.on { color: var(--pc); font-weight: 700; box-shadow: inset 0 4px 0 var(--pc); }

main { max-width: 1280px; margin: 0 auto; padding: calc(var(--top) + env(safe-area-inset-top) + 12px) 14px calc(var(--nav) + env(safe-area-inset-bottom) + 24px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 12px 0 4px; color: var(--accent); }
.sub { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* 今日の授業（授業中）：上＝時計と45分の帯／めあて／左＝いまの場面・右＝止まった子へ */
.tl { display: grid; grid-template-columns: 210px minmax(0, 1fr) 170px; gap: 16px; align-items: center; background: #fff; border-radius: 16px; padding: 10px 14px; }
.clock { font-size: 60px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.nx { font-size: 14px; color: var(--sub); min-height: 1.5em; margin-top: 4px; }
.nx b { color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
.line { position: relative; height: 66px; }
.line .sc { position: absolute; top: 4px; height: 30px; border: 0; border-radius: 0; min-height: 0; padding: 0 0 0 5px; font-size: 11px; font-weight: 700; color: #fff; text-align: left; white-space: nowrap; overflow: hidden; line-height: 30px; background: var(--pc); opacity: .55; border-right: 2px solid #fff; }
.line .sc.mk { opacity: 1; }
.line .sc.cur { opacity: 1; outline: 3px solid var(--ink); outline-offset: -3px; z-index: 1; }
.line .sc.sel { outline: 3px dashed var(--ink); outline-offset: -3px; z-index: 1; }
.line .sc:first-child { border-radius: 8px 0 0 8px; }
.line .sc.last { border-radius: 0 8px 8px 0; }
.line .pt { position: absolute; top: 0; width: 3px; height: 38px; background: var(--warn); z-index: 2; }
.line .lb { position: absolute; top: 40px; font-size: 11px; color: var(--sub); white-space: nowrap; transform: translateX(-2px); }
.line .lb.pt2 { color: var(--warn); font-weight: 700; }
.line .now { position: absolute; top: -2px; width: 4px; height: 42px; background: var(--ink); border-radius: 2px; z-index: 3; }
.go { width: 100%; min-height: 64px; font-size: 22px; font-weight: 700; border-radius: 14px; background: var(--pc); border-color: var(--pc); color: #fff; }
.go.run { background: #fff; color: var(--pc); border: 3px solid var(--pc); }
.tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.tbtns button { min-height: 40px; padding: 2px 4px; font-size: 13px; font-weight: 700; }
.tbtns button.arm { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.alert { background: var(--warn-soft); border: 3px solid var(--warn); border-radius: 12px; padding: 8px 14px; font-size: 19px; font-weight: 700; margin-top: 10px; display: none; }
.alert.show { display: block; animation: blink 1s ease-in-out 3; }
@keyframes blink { 50% { background: #fff; } }
.meate { font-size: 19px; font-weight: 700; background: var(--ps); border-left: 8px solid var(--pc); border-radius: 12px; padding: 6px 14px; margin: 10px 0; line-height: 1.5; }
.meate small { font-size: 12px; font-weight: 700; color: var(--pc); margin-right: 8px; }
.jg { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.nowc { background: #fff; border: 3px solid var(--pc); border-radius: 18px; padding: 12px 16px; }
.nowc.pre { border-style: dashed; }
.nowc .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nowc .h b { font-size: 22px; color: var(--pc); line-height: 1.4; }
.nowc .h span { font-size: 14px; color: var(--sub); white-space: nowrap; }
.nowc .do { font-size: 18px; margin-top: 6px; }
.say { background: var(--mark); border-radius: 12px; padding: 8px 12px; font-size: 19px; margin-top: 8px; }
.say small { display: block; font-size: 12px; font-weight: 700; color: #9a6b00; }
.nowc .nxt { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 6px; color: var(--sub); font-size: 15px; }
.nowc .nxt b { color: var(--ink); }
.nowc .back { margin-top: 8px; min-height: 40px; font-size: 14px; font-weight: 700; }
.help { background: #fff; border-radius: 18px; padding: 10px 12px; }
.help h2 { color: var(--warn); font-size: 17px; }
.help h3 { color: var(--sub); font-size: 13px; margin: 10px 0 4px; }
.help details { border: 2px solid var(--line); border-radius: 12px; margin-bottom: 6px; }
.help details > summary { list-style: none; padding: 6px 12px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; }
.help details > summary::-webkit-details-marker { display: none; }
.help details > summary::after { content: "›"; font-size: 20px; color: var(--sub); }
.help details[open] { border-color: var(--warn); }
.help details[open] > summary { background: var(--warn-soft); border-radius: 10px 10px 0 0; }
.help details[open] > summary::after { content: "⌄"; }
.help details .a { padding: 6px 12px 10px; background: var(--warn-soft); border-radius: 0 0 10px 10px; font-size: 16px; }
.help .yo { font-size: 15px; }

.seg-ctl { position: sticky; top: calc(var(--top) + env(safe-area-inset-top) + 12px); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; background: var(--bg); padding: 2px 0; }
.seg-ctl button { background: #fff; border: 2px solid var(--line); min-height: 52px; font-weight: 700; color: var(--sub); border-radius: 12px; padding: 4px; line-height: 1.25; }
.seg-ctl button small { display: block; font-weight: 400; font-size: 12px; }
.seg-ctl button.on { border-color: var(--pc); background: var(--ps); color: var(--pc); }
table.flow td.t { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; width: 4.5em; }
table.flow tr.mk td { background: #fffbe6; }
table.flow .say { font-size: 15px; padding: 4px 10px; margin-top: 4px; }
.kv { display: grid; grid-template-columns: 7.5em 1fr; border-top: 1px solid var(--line); }
.kv > div { padding: 10px 6px; border-bottom: 1px solid var(--line); }
.kv > div:nth-child(odd) { font-weight: 700; color: var(--accent); }
.tsel { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tsel button { text-align: left; min-height: 64px; font-weight: 700; line-height: 1.4; }
.tsel button.on { border: 3px solid var(--warn); background: var(--warn-soft); }
.tans { background: #fff; border: 3px solid var(--warn); border-radius: 14px; padding: 14px 16px; font-size: 19px; margin-bottom: 12px; }
.tans .q { font-size: 14px; color: var(--warn); font-weight: 700; }
table.tb { width: 100%; border-collapse: collapse; font-size: 15px; }
table.tb th, table.tb td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
table.tb th { background: #f1efea; }
ul.chk { list-style: none; margin: 0; padding: 0; }
ul.chk li { border-bottom: 1px dashed var(--line); }
ul.chk label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 4px; min-height: 52px; cursor: pointer; }
ul.chk input { width: 26px; height: 26px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--ok); }
ul.chk li.done .t { color: var(--sub); text-decoration: line-through; }
.tag { display: inline-block; font-size: 12px; border-radius: 4px; padding: 0 6px; margin-right: 6px; border: 1px solid var(--line); background: #f6f6f6; }
code { font-size: 13px; background: #f1efea; border-radius: 4px; padding: 0 4px; word-break: break-all; }
details > summary { cursor: pointer; font-weight: 700; padding: 10px 0; min-height: 44px; }

/* 根拠 */
.sticky-tools { position: sticky; top: calc(var(--top) + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 8px 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
.chips button { flex: 0 0 auto; border-radius: 999px; }
.chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.kcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.kc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.kc .pl { font-size: 22px; font-weight: 700; }
.kc .pl span { font-size: 16px; }
.kc .kw { font-size: 18px; }
.kc .meta { font-size: 13px; color: var(--sub); }

/* 見取り */
.tools { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
.tools button { flex: 0 0 auto; min-width: 72px; font-weight: 700; }
.tools button.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.tools button.detail.on { background: var(--accent); border-color: var(--accent); }
.seats { display: grid; gap: 6px; }
.seat { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 8px; min-height: 84px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.seat .n { font-weight: 700; font-size: 20px; display: flex; justify-content: space-between; }
.seat .g { display: flex; gap: 3px; flex-wrap: wrap; }
.seat .g span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #aaa; }
.seat .g span.y { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.seat .g span.r { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.seat .m { font-size: 12px; color: var(--sub); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.seat.sel { border: 3px solid var(--accent); }
.seat.star { background: #fffbe0; }
.seat.flash { animation: fl .5s; }
@keyframes fl { 0% { background: var(--ok-soft); } }
.editor { position: fixed; left: 0; right: 0; bottom: calc(var(--nav) + env(safe-area-inset-bottom)); background: #fff; border-top: 3px solid var(--accent); padding: 12px 16px; box-shadow: 0 -6px 20px rgba(0,0,0,.12); z-index: 25; display: none; }
.editor.show { display: block; }
.editor .in { max-width: 1280px; margin: 0 auto; }
.editor button { min-height: 56px; min-width: 64px; }
.tg { border: 2px solid var(--line); font-weight: 700; }
.tg.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.tg.star.on { background: #e0a800; border-color: #e0a800; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 12px; margin: 2px; border: 1px solid var(--line); background: #fff; }
.pill.w { border-color: var(--warn); color: var(--warn); }
mark { background: var(--mark); outline: 2px solid #e0a800; }
.hl { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 300px; overflow: auto; }
.big { font-size: 34px; font-weight: 700; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); background: #1d1d1d; color: #fff; padding: 8px 8px 8px 18px; border-radius: 999px; z-index: 99; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.toast button { min-height: 40px; background: #444; color: #fff; border: 0; border-radius: 999px; }

@media (max-width: 1000px) {
  .hd > b { display: none; }
  .sq { width: 60px; }
  .sq::before { left: -30px; width: 60px; }
}
@media (max-width: 900px) {
  .tl { grid-template-columns: 1fr 160px; }
  .tl .line { grid-column: 1 / -1; grid-row: 2; }
  .jg { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .sq .w { display: none; }
  .sq { width: 40px; }
  .sq::before { left: -20px; width: 40px; }
  nav.tabs button { font-size: 11px; }
  .seg-ctl button small { display: none; }
}
</style>
</head>
<body>
<header><div class="hd"><b>授業<br>コックピット</b><nav class="board" id="board" aria-label="時間の切りかえ"></nav><div class="modesw" id="modesw"></div><span class="mini" id="hdClock"></span></div></header>
<main id="main"></main>
<div class="editor" id="editor"><div class="in" id="editorIn"></div></div>
<nav class="tabs" id="tabs"><div class="in" id="tabsIn"></div></nav>
<script>
const D = {"lessons": {"1": {"title": "一次（第1時）　学習の見通しをもつ", "ids": ["1"], "rows": [["めあて", "学習のゴールをたしかめ、ゴールまでの見通しをもとう。"], ["主な学習活動", "①p.155の扉と『鳥獣戯画』の絵を見て、知っていること・気づいたことを出し合う。<br>②「『鳥獣戯画』を読む」を通読する。<br>③p.155の「筆者は、『鳥獣戯画』をどう読み、それをどのように伝えているでしょう」という問いと、単元の目標「筆者の工夫をとらえて読み、それをいかして書こう」を確かめる。<br>④「発見、日本文化のみりょく」（p.166〜169）にも目を通し、<b>単元のゴール＝自分が選んだ日本文化のよさを、保護者・地域の人に伝える文章を書き、授業参観で廊下に掲示すること<\/b>をつかむ。<br>⑤<b>ロードマップ（WS00）を読み、ゴールまでの見通しをもつ。<\/b> 「⑨で書く前に⑤〜⑦で何をそろえるか」「④でえらんだ工夫をどこで使うか」「自分で進め方を決めるのはどこか」をロードマップから読み取り、いちばんがんばりたい時間とそのわけを書く（WS01）。<br>⑥ふりかえりをロードマップの①に書く。"], ["交流", "①ペアで、絵を見て気づいたことを出し合う。<br><b>交流後に変わること<\/b>：一人では「動物が相撲している」で止まっていた見方が、「兎が笑っている」「絵なのに動いて見える」など<b>細部への気づき<\/b>に広がる。<br>②ペアで、いちばんがんばりたい時間とそのわけを伝え合う。<br><b>交流後に変わること<\/b>：友達のわけを聞いて、自分が見落としていた時間（⑧で説明する、⑤〜⑦で2冊を照らし合わせる など）に気づき、書き足す。"], ["手だて", "○絵を大きく提示し、指さしながら話せるようにする。<br>○通読の前に範読を聞かせ、<b>読むことに困難のある児童も内容の見通しをもてる<\/b>ようにする。以降の時間も範読音声を手元で聞けるようにしておく。<br>○学習計画は白紙から立てさせない。10時間の流れは<b>ロードマップとして教師が示し<\/b>、児童はそれを<b>読み取る問い<\/b>に答えることで見通しをもつ。問いの答えはロードマップに書いてあるので、読むことに困難のある児童も手が止まらない。<br>○<b>読んでもらう相手（保護者・地域の人）と場（授業参観の廊下掲示）を第1時に示す。<\/b> 10時間の目的意識をここで持たせる。"], ["ICT・AI", "―"], ["評価", "⑥学習のゴールを確かめ、見通しをもとうとしている。〈発言・行動観察〉"]], "notes": []}, "2": {"title": "二次（第2時）　絵と文章を照らし合わせて読む", "ids": ["2"], "rows": [["めあて", "絵と文章を照らし合わせて、筆者が絵のどこを取り上げているかをたしかめよう。"], ["主な学習活動", "①p.156〜162を音読する。<br>②本文の一文一文が、<b>絵のどの部分<\/b>について書かれたものかを、絵に番号や線で書き込みながら確かめる。<br>　・p.156「蛙が外掛け、…」→ 相撲の場面のどこか<br>　・p.158 11〜14行目「蛙の口から線…」→ その線を絵で指す<br>　・p.159 4〜6行目「もんどりうっ…」→ 該当箇所を指す<br>③<b>絵巻物は右から左へ時間が流れる<\/b>ことを、p.158 6〜10行目とp.160 1〜11行目から読み取り、絵で確かめる。<br>④p.158 7〜8行目「本当はつなが…」に着目し、<b>筆者が絵の見せ方を工夫している<\/b>ことに気づく。"], ["交流", "ペアで「この文は、絵のどこのこと？」と指さしで確かめ合う。<br><b>交流後に変わること<\/b>：文章を読むだけでは像を結ばなかった児童も、<b>相手の指さしによって本文と絵が結びつく<\/b>。以降の学習の土台になる。"], ["手だて", "○教科書 p.156〜158 の絵を撮影して<b>ロイロで配り<\/b>、iPadのペンで<b>直接書き込める<\/b>ようにする（提出箱に出させ、単元を通して見返す）。<br>○読むことに困難のある児童には、<b>扱う一文を教師が指定<\/b>する（全文でなく3か所）。<br>○p.157 13行目「ためしに、ぱ…」は、実際に全員でめくらせ、動いて見える体験をさせる。"], ["ICT・AI", "○絵を大型テレビに拡大提示し、教師が指さす。<br>○範読音声を手元で聞けるようにする。"], ["評価", "③絵と文章を照らし合わせ、筆者が何を取り上げ、何に着目しているかを叙述を基に捉えている。〈ワークシート〉"]], "notes": []}, "3": {"title": "二次（第3時）　筆者の評価と工夫を書き出す", "ids": ["3"], "rows": [["めあて", "筆者が『鳥獣戯画』をどう評価しているかを見つけ、それを伝えるための工夫を書き出そう。"], ["主な学習活動", "①筆者が「<b>絵<\/b>」と「<b>絵巻物<\/b>」の二つについて評価を述べていることを確かめる（p.164下段）。<br>②<b>筆者の評価が分かる表現<\/b>を本文から探し、線を引く。<br>　・絵について：p.156「のびのびと見…」／p.159 9〜10行目「見事にそれを…」<br>　・絵巻物について：p.161 11〜14行目「日本文化の大…」／p.162「国宝であるだ…」<br>③p.164〜165の観点例を基に、<b>3つの観点<\/b>で筆者の工夫を書き出す。<br>　<b>論の展開<\/b>（例：絵巻物の説明に漫画やアニメを出した理由／同じ絵を2度示した理由）<br>　<b>表現の工夫<\/b>（例：文末を「―だ。」とせず「返し技。」「かわづ掛け。」とする／「ためしに、ぱ…」と読者に呼びかける）<br>　<b>絵の示し方<\/b>（例：つながっている絵をわざと切りはなしてページを分けて示した）"], ["交流", "グループで、見つけた表現を出し合い、<b>3つの観点のどれに当たるかを分けていく<\/b>。<br><b>交流後に変わること<\/b>：一人では1〜2個しか見つけられなかった児童も、<b>学級全体としてどんな工夫があるかの見取り図<\/b>をもてる。次時に「選ぶ」ための材料がそろう。"], ["手だて", "○3観点を<b>掲示物<\/b>にして教室前方に貼り、以後の時間も常に見えるようにする。<br>○観点ごとに<b>教師が一例ずつ実演<\/b>してから作業に入る。「見つけ方」を見せる。<br>○書き出しは<b>ふせん1枚に1つ<\/b>とし、量を求めない。1つでも書けたら次に進んでよいと伝える。<br>○本文のどこを探せばよいか分からない児童には、<b>探す範囲を1ページに限定<\/b>して渡す。"], ["ICT・AI", "○〈<b>授業後・教員<\/b>〉児童が書き出した工夫を<b>氏名を外して<\/b>AIに入力し、3観点に分類・整理させる。教員が本文と突き合わせて確認・修正し、<b>第4時の導入で配る「学級の工夫マップ」<\/b>をつくる。"], ["評価", "①比喩や反復などの表現の工夫に気づいている。〈ワークシート〉"]], "notes": []}, "4": {"title": "二次（第4時）　使いたい工夫を選ぶ　※本時の思考の型をつくる時間", "ids": ["4"], "rows": [["めあて", "自分が書くときに使いたい筆者の工夫をえらび、なぜ効果的なのかを本文の言葉で説明しよう。"], ["主な学習活動", "①「学級の工夫マップ」を手元（ロイロ）で見て、前時の自分の書き出しを見返す。<br>②工夫を一つ選び、カードに書く。①どんな工夫か　②<b>教科書 p.○ ○行目の「　　」という言葉<\/b>　③読む人にどんな効果があるか。<br>③カードを写真に撮って提出箱へ出し、<b>全員の考えを一覧で見比べる<\/b>。<br>④グループ（5人）で報告し合い、聞き手は「<b>それは本文のどこから言えるの？<\/b>」と問い返す。<br>⑤交流後、自分のカードに<b>赤ペン<\/b>で書き足す・書き換える。<br>⑥ふりかえり：この工夫を、自分の文章の<b>どこで<\/b>使いたいか。"], ["交流", "グループでの報告と問い返し。<br><b>交流後に変わること<\/b>：「なんとなく面白い」で選んでいた児童が、<b>本文の言葉に支えられた理由<\/b>をもつようになる。友達が挙げた別の観点の工夫を知り、自分の選択を<b>変える／付け足す<\/b>。その跡が赤ペンで残る。"], ["手だて", "○読み返す範囲を<b>全文にしない<\/b>。前時に自分が貼ったふせんの1〜2か所だけでよい。<br>○3つに絞った<b>「おすすめカード」<\/b>を机上に置き、選べるようにする。<br>○「読む人が〜」で始まる<b>書き出しの型<\/b>を配る。<br>○カードは<b>枠のみ・短文でよい<\/b>ことを明示する。"], ["ICT・AI", "○ロイロ：工夫マップの手元配布、カードの提出と一覧比較。<br>○AI：前時終了後に教員が使用済み（授業中は使わない）。"], ["評価", "④目的に応じて必要な情報を見つけ、論の進め方について考えている。〈ワークシート・発言〉<br>⑥友達の考えを聞いて自分の考えを見直そうとしている。〈行動観察・ワークシートの更新〉"]], "notes": ["<b>この時間の位置づけ<\/b>　本時（第8時）と<b>同じ思考の型<\/b>（選ぶ → 根拠を言う → 交流して更新する）を、ここで一度経験させておく。本時で児童が迷わず動けるかどうかは、この時間にかかっている。"]}, "5": {"title": "二次〜三次（第5〜7時）　自由進度ブロック「材料をそろえる」3時間", "ids": ["5", "6", "7"], "rows": [["ブロックのめあて（3時間を通して掲示）", "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。"], ["毎時のめあて", "児童が自分で立てる。板書には「今日のゴール（どの関門まで進むか）」を書く欄をつくる。"], ["主な学習活動", "<b>〈第5時のはじめ10分・全員〉<\/b>①学習の手引き（3時間分）を読み合わせ、<b>3つの関門<\/b>とやることA〜Cを確かめる。②進め方のきまりを確認する（後述）。<br><b>〈以降・自由進度〉<\/b>児童はA〜Cを自分の順序と時間で進める。<br>　<b>A 本を読む<\/b>……日本文化について書かれた本を読み、<b>初めて知ったこと<\/b>と<b>説明のしかた・資料の使い方の工夫<\/b>を書き留める（p.165下段の例）。何冊読むか、どの本か、教室か図書館かを選ぶ。<br>　<b>B 題材を決める<\/b>……p.166を読み、書く日本文化と「<b>いちばん伝えたいみりょく<\/b>」を決める。p.168〜169の高橋さんの作例を通して読み、完成のイメージをもつ。<br>　<b>C 情報を集めて整理する<\/b>……p.311「図を使って考えよう」を参考に、集めた情報を図や表に整理する（p.167の和食の例＝話題の提示／具体例①〜④／まとめ）。<b>同じことがらを2冊以上で照らし合わせ、食い違う場合はいつ・誰が書いたかを見て判断し、確かめられないことは書かない。<\/b><br><b>〈第7時の終わり15分・全員〉<\/b>p.167の5つの型を短冊で確かめ、<b>高橋さんの文章（p.168〜169）がどの型か<\/b>を全員で一つだけ確かめる（4分）→ WS07の５を見て、６で<b>自分の型を仮に選び、理由を書く<\/b>（5分）→ グループ（5人）で５と６を言い合い、聞き手は「<b>その型で、いちばん伝えたいことが伝わる？<\/b>」と問い返す（5分）→ 変えたら赤ペン（1分）。<br><b>〈各時のはじめ5分〉<\/b>今日どこまで進めるかを決め、<b>ロードマップ（WS00）<\/b>で確かめる。<br><b>〈各時の終わり5分〉<\/b>ロードマップに今日進んだところの印をつけ、次の時間の見通しを書く。"], ["3つの関門（全員が必ず通る／印は教師が押す）", "<b>関門①<\/b>　読んだ本から「<b>自分が書くときに使えそうな説明の工夫<\/b>」を1つ書けた。〈WS05を使う〉<br><b>関門②<\/b>　<b>題材<\/b>と「<b>いちばん伝えたいみりょく<\/b>」が、一言で言える。〈WS06を使う〉<br><b>関門③<\/b>　同じことがらを<b>2つの出典で確かめ、出典（書名・ページ）を書いた<\/b>。〈WS07を使う〉<br>※印は教師が押す。これは進度管理のためではなく、<b>3時間のうちに全員と必ず1回は個別に話すための仕組み<\/b>である。"], ["交流", "①<b>常設の「相談テーブル」<\/b>……題材を決めかねている児童、同じ・近い題材の児童が、いつでも集まって話せる場を教室の一角に置く。<br>②<b>必修（第6時の終わり10分）<\/b>……<b>関門②を通った児童から順にペアをつくり<\/b>、「自分の題材と、いちばん伝えたいみりょく」を言い合う。通っていない児童は、この時間に教師と一緒に決める。<br>③<b>第7時の終わり15分（全員）<\/b>……グループで「いちばん伝えたいみりょく」と「仮に選んだ型」を言い合い、問い返し合う（本時の関所の予行）。<br><b>交流後に変わること<\/b>：②では、漠然と題材だけ決めていた児童が「<b>そのどこがよいのか<\/b>」を言葉にし始める。③では、「なんとなくこの型」で選んだ児童が、問い返しを受けて理由を言い直す／型を選び直す。その跡がWS07に赤ペンで残る（第8時への橋渡し）。"], ["手だて", "○<b>「困ったときのメニュー」を学習の手引きに最初から印刷しておく。<\/b> 途中で教師が渡すのではなく、初めから選べる形にする。——「先生のおすすめ」の本5冊／<b>教師が用意した情報カード<\/b>（題材ごとに事実を3〜4枚に整理したもの）／図の型の見本／範読音声／同じ題材の友達の一覧。<br>○<b>教師は座席表を持って、3時間を通して個別支援に回る。<\/b> とくに<b>第6時の終わりまでに関門②を通っていない児童<\/b>に集中する。<br>○読むことに困難のある児童には、<b>写真とキャプションが中心の本<\/b>を勧める。関門①は「資料の使い方」の観点で十分通れる。<br>○2冊目が見つからない児童のために、<b>対になる本<\/b>を教師が用意しておく。<br>○情報が集まりすぎて選べない児童には、「<b>読む人がいちばんおどろくのはどれか<\/b>」と問い、絞る観点を与える。<br>○早く進んだ児童には、3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる、のいずれかを勧める。<br>○<b>進度は自由だが、関門は飛ばさない。<\/b> 順序を選べること＝やらなくてよいことではない、と初めに確認する。<br>○事前に司書と連携し、<b>日本文化の本を学級分そろえて教室に置く<\/b>（第1時から読める状態にしておく）。図書館の時間が動いてもこのブロックが吸収できる。"], ["ICT・AI", "○ロイロ：見つけた工夫を共有し、第4時の「学級の工夫マップ」に追加していく。<br>○本の該当ページを撮影して手元に保存する（<b>出典も一緒に写す<\/b>）。<br>○児童は生成AIを使わない。<b>本と本を照らし合わせる<\/b>ことで、情報を鵜呑みにしない態度を育てる（研究主題③）。<br>○〈<b>教員・第7時終了後<\/b>〉児童の「題材」「いちばん伝えたいみりょく」「仮に選んだ型」を<b>氏名を外して<\/b>入力し一覧に整理させる。教員が確認したうえで、<b>どの児童が型を選び直しそうか<\/b>を見立て、<b>本時の個別支援の順路と意図的指名<\/b>を決める。"], ["評価", "②読書が自分の考えを広げることに役立つことに気づいている。〈発言・行動観察〉<br>④目的に応じて必要な情報を見つけている。〈ワークシート〉<br>⑥<b>自分で学習の計画を立て、進み方を調整しながら<\/b>、見通しをもって書こうとしている。〈ロードマップ・行動観察〉"]], "notes": ["<b>このブロックの扱い<\/b>　第5時は二次、第6・7時は三次だが、児童の活動（本を読む → 題材を決める → 情報を集める）は連続しているため、<b>3時間を一つのまとまりとして児童に渡し、順序と時間配分を児童が決める<\/b>。ここを自由進度にする理由は二つ。①この3時間はもともと読む本も題材も集める情報も児童ごとに違い、一斉で進める必然性が薄い。②<b>教師が3時間まるごと個別支援に回れる<\/b>ため、第8時公開の最大の前提（全員が材料をもって本時に臨む）を確実にできる。", "<b>このブロックが第8時公開の前提になる<\/b>　第8時の最大のリスクは、<b>材料が乏しい児童が本時で何もできないこと<\/b>。関門③まで通った児童＝材料をもっている児童であり、<b>残りは教師の座席表で分かる<\/b>。第7時の終わりに関門③まで届いていない児童には、その場で教師が一緒に情報を見て絞るか、<b>情報カードを渡す。本時に空手で臨む児童をゼロにする。<\/b>"]}, "6": {"title": "二次〜三次（第5〜7時）　自由進度ブロック「材料をそろえる」3時間", "ids": ["5", "6", "7"], "rows": [["ブロックのめあて（3時間を通して掲示）", "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。"], ["毎時のめあて", "児童が自分で立てる。板書には「今日のゴール（どの関門まで進むか）」を書く欄をつくる。"], ["主な学習活動", "<b>〈第5時のはじめ10分・全員〉<\/b>①学習の手引き（3時間分）を読み合わせ、<b>3つの関門<\/b>とやることA〜Cを確かめる。②進め方のきまりを確認する（後述）。<br><b>〈以降・自由進度〉<\/b>児童はA〜Cを自分の順序と時間で進める。<br>　<b>A 本を読む<\/b>……日本文化について書かれた本を読み、<b>初めて知ったこと<\/b>と<b>説明のしかた・資料の使い方の工夫<\/b>を書き留める（p.16 \/b>」を1つ書けた。〈WS05を使う〉<br><b>関門②<\/b>　<b>題材<\/b>と「<b>いちばん伝えたいみりょく<\/b>」が、一言で言える。〈WS06を使う〉<br><b>関門③<\/b>　同じことがらを<b>2つの出典で確かめ、出典（書名・ページ）を書いた<\/b>。〈WS07を使う〉<br>※印は教師が押す。これは進度管理のためではなく、<b>3時間のうちに全員と必ず1回は個別に話すための仕組み<\/b>である。"], ["交流", "①<b>常設の「相談テーブル」<\/b>……題材を決めかねている児童、同じ・近い題材の児童が、いつでも集まって話せる場を教室の一角に置く。<br>②<b>必修（第6時の終わり10分）<\/b>……<b>関門②を通った児童から順にペアをつくり<\/b>、「自分の題材と、いちばん伝えたいみりょく」を言い合う。通っていない児童は、この時間に教師と一緒に決める。<br>③<b>第7時の終わり15分（全員）<\/b>……グループで「いちばん伝えたいみりょく」と「仮に選んだ型」を言い合い、問い返し合う（本時の関所の予行）。<br><b>交流後に変わること<\/b>：②では、漠然と題材だけ決めていた児童が「<b>そのどこがよいのか<\/b>」を言葉にし始める。③では、「なんとなくこの型」で選んだ児童が、問い返しを受けて理由を言い直す／型を選び直す。その跡がWS07に赤ペンで残る（第8時への橋渡し）。"], ["手だて", "○<b>「困ったときのメニュー」を学習の手引きに最初から印刷しておく。<\/b> 途中で教師が渡すのではなく、初めから選べる形にする。——「先生のおすすめ」の本5冊／<b>教師が用意した情報カード<\/b>（題材ごとに事実を3〜4枚に整理したもの）／図の型の見本／範読音声／同じ題材の友達の一覧。<br>○<b>教師は座席表を持って、3時間を通して個別支援に回る。<\/b> とくに<b>第6時の終わりまでに関門②を通っていない児童<\/b>に集中する。<br>○読むことに困難のある児童には、<b>写真とキャプションが中心の本<\/b>を勧める。関門①は「資料の使い方」の観点で十分通れる。<br>○2冊目が見つからない児童のために、<b>対になる本<\/b>を教師が用意しておく。<br>○情報が集まりすぎて選べない児童には、「<b>読む人がいちばんおどろくのはどれか<\/b>」と問い、絞る観点を与える。<br>○早く進んだ児童には、3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる、のいずれかを勧める。<br>○<b>進度は自由だが、関門は飛ばさない。<\/b> 順序を選べること＝やらなくてよいことではない、と初めに確認する。<br>○事前に司書と連携し、<b>日本文化の本を学級分そろえて教室に置く<\/b>（第1時から読める状態にしておく）。図書館の時間が動いてもこのブロックが吸収できる。"], ["ICT・AI", "○ロイロ：見つけた工夫を共有し、第4時の「学級の工夫マップ」に追加していく。<br>○本の該当ページを撮影して手元に保存する（<b>出典も一緒に写す<\/b>）。<br>○児童は生成AIを使わない。<b>本と本を照らし合わせる<\/b>ことで、情報を鵜呑みにしない態度を育てる（研究主題③）。<br>○〈<b>教員・第7時終了後<\/b>〉児童の「題材」「いちばん伝えたいみりょく」「仮に選んだ型」を<b>氏名を外して<\/b>入力し一覧に整理させる。教員が確認したうえで、<b>どの児童が型を選び直しそうか<\/b>を見立て、<b>本時の個別支援の順路と意図的指名<\/b>を決める。"], ["評価", "②読書が自分の考えを広げることに役立つことに気づいている。〈発言・行動観察〉<br>④目的に応じて必要な情報を見つけている。〈ワークシート〉<br>⑥<b>自分で学習の計画を立て、進み方を調整しながら<\/b>、見通しをもって書こうとしている。〈ロードマップ・行動観察〉"]], "notes": ["<b>このブロックの扱い<\/b>　第5時は二次、第6・7時は三次だが、児童の活動（本を読む → 題材を決める → 情報を集める）は連続しているため、<b>3時間を一つのまとまりとして児童に渡し、順序と時間配分を児童が決める<\/b>。ここを自由進度にする理由は二つ。①この3時間はもともと読む本も題材も集める情報も児童ごとに違い、一斉で進める必然性が薄い。②<b>教師が3時間まるごと個別支援に回れる<\/b>ため、第8時公開の最大の前提（全員が材料をもって本時に臨む）を確実にできる。", "<b>このブロックが第8時公開の前提になる<\/b>　第8時の最大のリスクは、<b>材料が乏しい児童が本時で何もできないこと<\/b>。関門③まで通った児童＝材料をもっている児童であり、<b>残りは教師の座席表で分かる<\/b>。第7時の終わりに関門③まで届いていない児童には、その場で教師が一緒に情報を見て絞るか、<b>情報カードを渡す。本時に空手で臨む児童をゼロにする。<\/b>"]}, "8": {"title": "三次（第8時）　本時・公開授業　構成を選ぶ", "ids": ["8"], "rows": [["めあて", "いちばん伝えたいことが伝わる構成をえらび、なぜその構成にしたのかを説明しよう。"], ["本時の形", "<b>自由進度。<\/b> 型は第7時の終わりに仮に選んである。本時の「えらぶ」は、<b>仮の型で構成メモを組み、説明し、問い返されて、確かめる／選び直す<\/b>こと。5つの学習コーナー㋐〜㋔から、自分で順序と時間を決めて進む。ただし<b>㋒「説明の関所」は全員が必ず1回通る<\/b>。交流はここで保証する。第5〜7時のブロックで学習の進め方に慣れているため、本時でも同じ動き方ができる。"], ["主な学習活動", "<b>〈全員・5分〉<\/b>①WS07の2枚目（みりょく・仮の型・理由）を見て、WS08の「えらんだ型」に写す。②めあてを確かめる（5つの型の短冊は第7時から貼ったまま）。③本時のメニュー㋐〜㋔と、<b>関所は必ず1回通る<\/b>ことを確かめ、自分の進み方を決める。<br><b>〈自由進度・33分〉<\/b><br>　<b>㋐ たしかめコーナー<\/b>……高橋さんの文章を読み直し、「<b>もし『初めに問いを書き、それに答えていく』型で書いたら、どこが変わるか<\/b>」を考える。段落を色分けした拡大版を置く。※型をもう一度考えたい児童はここから始めるよう勧める。<br>　<b>㋑ 組み立てる<\/b>……第7時に<b>仮に選んだ型<\/b>にそって構成メモをつくる。<b>簡単に書く部分とくわしく書く部分に印<\/b>をつけ、いちばん伝えたいことに★。<br>　<b>㋒ 説明の関所〈全員必修〉<\/b>……構成メモを持って<b>説明テーブル<\/b>へ行き、居合わせた2〜3人に「<b>なぜその構成にしたか<\/b>」を説明する（WS07に書いた理由を読み上げてよい）。聞き手は「<b>その構成で、いちばん伝えたいことが伝わる？<\/b>」と問い返す。<b>通った人は、次に来た1人の聞き役を務めてから自席に戻る<\/b>（聞き手を絶やさないためのきまり）。1人1分半、テーブルに砂時計を置く。<br>　<b>㋓ くらべる<\/b>……構成メモを写真に撮って提出箱へ出し、<b>型ごとに並べて<\/b>見比べる。<b>同じ型の人は中身の入れ方がどう違うか<\/b>／<b>違う型を選んだ人はなぜか<\/b>の二つの軸で見る。<br>　<b>㋔ 書きかえる<\/b>……<b>赤ペン<\/b>で構成メモを組み替える／型を選び直す（WS08の「えらんだ型」に赤ペンで印）。<br>　※<b>ミニ講座「型の選び直し方」<\/b>を、開始15分後と27分後に<b>3分ずつ定時開催<\/b>する。来たい児童だけが来る。<br><b>〈全員・7分〉<\/b>⑤共有：<b>型を選び直した児童（「えらんだ型」に赤ペンの印がある児童）を2〜3名指名<\/b>し、ロイロで<b>更新前と更新後を並べて<\/b>提示する。⑥ふりかえり：今日の<b>進め方<\/b>でよかったこと（WS08の４）。"], ["交流", "<b>㋒説明の関所（全員必修・1人1分半）。<\/b> 2回目以降は任意。㋓の「くらべる」も、学級全員の構成メモを相手にした交流として位置づける。<br><b>交流後に変わること<\/b>：「なんとなくこの型」で選んでいた児童が、<b>自分の目的に照らした理由<\/b>をもつ。説明できなかった児童は、その場で型を選び直す。その跡が<b>赤ペン<\/b>で残る。㋐を通った児童は、<b>構成が変われば読み手の受け取り方が変わる<\/b>ことを実感したうえで自分の型を選ぶ。"], ["手だて", "詳細は「9 支援の手だて」。要点は<b>第7時までに全員が材料をもって臨む／5つの型を短冊で掲示／構成メモは短い語句でよいと明示／説明の型を紙で配る／関所の通過名簿で未通過の児童を把握し、開始20分で声をかける／ミニ講座は定時開催<\/b>。"], ["ICT・AI", "○ロイロ：構成メモの提出と<b>型ごとの並べ替え比較<\/b>、更新前後の提示。<br>○AI：前時終了後に教員が使用済み（授業中は使わない）。"], ["評価", "⑤目的や意図に応じて簡単に書く部分とくわしく書く部分を考え、自分の考えが伝わるように構成を工夫している。〈ワークシート・発言〉<br>⑥友達の説明を聞いて自分の構成を見直そうとしている。<b>また、自分で学習の進め方を選び、調整しようとしている。<\/b>〈行動観察・構成メモの更新・振り返りの記述〉"]], "notes": []}, "9": {"title": "三次（第9時）　文章を書く　※実態により2時間扱いも可", "ids": ["9"], "rows": [["めあて", "筆者の工夫を使って、えらんだ日本文化のよさが伝わる文章を書こう。"], ["主な学習活動", "①p.168の高橋さんの作例をもう一度読み、<b>どんな工夫をしているか<\/b>を見つける（p.169「よさを伝えるときの言葉」＝「いちばん伝えたいみりょくは、―だ。」「―は欠かせない。」「―ならではだ。」「―こそ、―だ。」）。<br>②<b>第4時で自分が選んだ工夫<\/b>を確かめ、それを使う場所を決める。<br>③構成メモをもとに文章を書く。<br>④写真や図の使い方、文末表現を工夫する。"], ["交流", "途中で一度手を止め、<b>書き出しだけ<\/b>をグループで読み合う。<br><b>交流後に変わること<\/b>：書き出しが平板だった児童が、友達の書き出しから<b>読み手を引き込む言い方<\/b>を取り入れる。第4時で「読者への呼びかけ」を選んだ児童の文章が生きる。"], ["手だて", "○<b>第4時のカードと、本時（第8時）の構成メモ（どちらも赤ペン入り）を机上に出させる。<\/b> 「読んで選んだ工夫」と「自分で選んだ構成」を手元に置いて書く。単元を貫く筋が、児童の手元で見える。<br>○「よさを伝えるときの言葉」を<b>掲示<\/b>し、いつでも使えるようにする。<br>○作文のルールが不安な児童のために、<b>書き出しの一文を入れた用紙<\/b>を用意する。<br>○手が止まる児童には、<b>構成メモの一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。"], ["ICT・AI", "○清書をロイロで提出（第10時の相互閲覧の準備）。<br>○字を書くことに苦手意識のある児童は、ロイロでの入力を選べるようにする。"], ["評価", "⑤自分の考えが伝わるように書き表し方を工夫している。〈ワークシート〉"]], "notes": []}, "10": {"title": "三次（第10時）　読み合い、振り返る", "ids": ["10"], "rows": [["めあて", "友達の文章のよいところを見つけて伝え、単元の学びをふりかえろう。"], ["主な学習活動", "①グループで文章を読み合い、よいと思ったところを伝える。<br>②p.169「ふりかえろう」「たいせつ」「いかそう」で単元の学びを押さえる。<br>③単元を通したポートフォリオ（第2時にロイロで書き込んだ絵〜第4時のカード〜構成メモ〜作品）を見返し、<b>自分の学びの変化<\/b>を振り返る。"], ["交流", "グループで読み合い、<b>使われている「筆者の工夫」を指摘し合う<\/b>（「ここ、高畑さんの『呼びかけ』を使ってるね」）。<br><b>交流後に変わること<\/b>：自分では意識せず使っていた工夫を、<b>友達に指摘されて自覚する<\/b>。「読んで見つけたことを、書くときに使えた」という手応えが残る。"], ["手だて", "○感想は「よかった」で終わらせず、<b>「どこが」「なぜ」<\/b>まで書く型を渡す。<br>○全員に感想が行き渡るよう、読む順番を教師が指定する。<br>○振り返りは、<b>第4時のカードと完成した文章を並べて<\/b>見せ、つながりを言葉にさせる。"], ["ICT・AI", "○ロイロで全員の文章を相互閲覧できるようにする（グループ外の文章も読める）。<br>○〈教員・授業後〉ポートフォリオと振り返りの記述をAIで整理し、<b>単元を通した学びの変化<\/b>を研究のまとめ（後日の報告）にまとめる。"], ["評価", "⑤〈ワークシート〉⑥単元を通して学びを振り返ろうとしている。〈発言・振り返りの記述〉"]], "notes": ["<b>時数についての補足<\/b>", "<b>第1時から第8時（本時）までの8時間は、日程を詰めて確実に消化する。<\/b> 公開日が動かせないため、ここが計画の要になる。", "第9時は学級の実態から<b>2時間必要になる見込み<\/b>。公開後なので、余裕をもたせて配当してよい。", "第5〜7時の「2冊以上を照らし合わせる」（関門③）は、児童がAIを使えない条件下で<b>研究主題③（情報を鵜呑みにせず根拠を基に判断する）<\/b>に応える場面。", "<b>第5〜7時のブロックと第8時（本時）は、どちらも自由進度で組んである。<\/b> 本時でいきなり新しい進め方を求めないために、<b>3時間かけて学習の進め方そのものを身につけさせる<\/b>という順序になっている。ブロックの3時間は、内容の学習であると同時に、<b>本時の助走<\/b>でもある。", "<b>第4時と第8時（本時）は、どちらも「選ぶ → 根拠を言う → 交流して更新する」という同じ思考の型<\/b>で組んである。第4時は「読む」場面、本時は「書く」場面で、同じ考え方を使う。この反復によって、<b>読んで身につけた力を活用する<\/b>という単元の筋が見えてくる。"]}}, "scenes": {"1": {"rows": [{"a": 0, "b": 2, "name": "あいさつ、単元に入ることを告げる", "do": "教科書 p.155 を開かせる。<b>まだ本文は読ませない。<\/b>絵から入る。", "say": [], "mark": false}, {"a": 2, "b": 8, "name": "<b>絵で気づいたことを書き、ペアで出し合う<\/b>（WS01 １）", "do": "絵を大きく映し、<b>指さしながら話せる<\/b>ようにする。細部を見ている子を見つけておく（次の全体で指名）。", "say": ["何の絵に見える？　気づいたことを、絵のどこを見たかといっしょに書いて、となりの人と言い合おう。"], "mark": false}, {"a": 8, "b": 13, "name": "全体で出し合う", "do": "細部の気づきを拾って板書する。「兎が笑っている」「動いて見える」は、<b>第2時につながるので必ず取り上げる。<\/b>", "say": [], "mark": false}, {"a": 13, "b": 25, "name": "<b>「『鳥獣戯画』を読む」を通読する<\/b>", "do": "<b>範読を先に聞かせてから読ませる。<\/b>読むことに困難のある児童も内容の見通しをもてる。<b>以降の時間も、範読音声を手元で聞ける状態にしておく<\/b>と告げる。", "say": [], "mark": false}, {"a": 25, "b": 29, "name": "p.155 の問いと単元の目標を確かめる", "do": "「筆者は、『鳥獣戯画』をどう読み、それをどのように伝えているでしょう」と、<b>「筆者の工夫をとらえて読み、それをいかして書こう」<\/b>を板書して押さえる。", "say": [], "mark": false}, {"a": 29, "b": 33, "name": "p.166〜169 に目を通し、<b>ゴールをつかむ<\/b>（WS01 ２）", "do": "高橋さんの作例「和食の心」を<b>ざっと見せるだけ<\/b>でよい。<b>この単元の終わりに、自分も同じものを書く<\/b>と分かればよい。WS01 ２はp.155の引用から「日本文化」を見つけて書く。<b>「読んでもらう相手」は、ここで教師が伝えて書かせる<\/b>——<b>おうちの人や地域の人<\/b>。完成した文章は<b>授業参観で廊下に掲示<\/b>する。", "say": ["この単元の終わりに、みんなも「自分がえらんだ日本文化のよさ」を伝える文章を書きます。書くために、まず高畑さんの書き方を読みます。"], "mark": false}, {"a": 33, "b": 42, "name": "<b>ロードマップを読み、ゴールまでの見通しをもつ<\/b>（WS01 ３）", "do": "<b>ロードマップを配る。<\/b>上の段（読む）から下の段（書く）へ、指でたどりながら読む。⑧の太枠は「<b>いちばん大事な時間<\/b>」とだけ伝える。<br>３(1)〜(3)を一人で（3分）→ 全体で答えを確かめる。<b>答えはロードマップに書いてある<\/b>ので、手が止まる子にはマスを指さす。<br>３(4)「いちばんがんばりたい時間」を書き、<b>ペアで伝え合って書き足す<\/b>。<br><b>第5〜7時と第8時は自分で進める時間になる<\/b>ことを、(3)の答え合わせで予告しておく。", "say": ["ゴールまでの地図です。文章を書く⑨の前に、何をそろえておかないといけないかな。ロードマップの中から探してごらん。"], "mark": true}, {"a": 42, "b": 45, "name": "ふりかえり<b>（ロードマップの①に書く）<\/b>", "do": "ロードマップの①の〈ふりかえり〉に書き、□にしるしをつけさせる。<b>毎時間の終わりにここへ戻る<\/b>ことを伝える。日本文化の本が教室にあることを知らせ、<b>いつ読んでもよい<\/b>と伝える。第5〜7時の助走になる。", "say": [], "mark": false}], "groups": [], "tips": []}, "2": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "ロイロで絵を配る。<b>「どんどん書き込んでいい絵です」<\/b>と、遠慮なく書かせる。", "say": [], "mark": false}, {"a": 3, "b": 10, "name": "p.156〜162 を音読する", "do": "読むことに困難のある児童には<b>範読音声<\/b>を。全文を追えなくてよい。", "say": [], "mark": false}, {"a": 10, "b": 20, "name": "<b>三つの文は、絵のどこのことか<\/b>（WS02 １）", "do": "次の3か所に、ロイロの絵で<b>ア・イ・ウを書きこむ<\/b>。そのうえで、その場所を<b>「（だれ）の（どこ）」<\/b>で書き、「前から気づいていた／文を読んではじめて気づいた」の<b>どちらかに○<\/b>をつける。<br>・ア　p.156「蛙が外掛け、…」<br>・イ　p.158 11〜12行目「兎を投げ飛ば…」<br>・ウ　p.159 4行目「もんどりうっ…」<br><b>「〇〇の〇〇」で書ければ十分。<\/b>書けない児童には「どの動物の、体のどこ？」と聞く。", "say": [], "mark": false}, {"a": 20, "b": 24, "name": "<b>ペアで指さし確認<\/b>", "do": "「この文は、絵のどこのこと？」と言い合い、□にしるし。<b>指がさせていない児童を探して回る。<\/b><br><b>「はじめて気づいた」に○をした数を挙手で数え、板書する<\/b>（イ・ウが多い見こみ）。３への橋わたし。", "say": [], "mark": false}, {"a": 24, "b": 29, "name": "時間の流れ（WS02 ２）", "do": "p.160 1〜2行目「絵巻の絵は、…」を読み、ロイロの絵に<b>時間の向きの矢印<\/b>を書き、何がどの順におこるかと<b>行番号<\/b>（160ページ3〜9行目）を書かせる。", "say": [], "mark": false}, {"a": 29, "b": 32, "name": "<b>ページをめくる体験<\/b>（WS02 ３(1)）", "do": "p.157 13行目「ためしに、ぱ…」を<b>実際に全員でやる。<\/b>見え方を一言書かせる。<b>体験させることに意味がある。<\/b>書けない児童には、もう一度めくって見せ「今、蛙はどうなった？」と聞く。", "say": [], "mark": false}, {"a": 32, "b": 39, "name": "<b>筆者は、なぜわざと切りはなして見せたのか<\/b>（WS02 ３(2)）<br>本時の中心", "do": "p.158 7〜8行目「この二枚の絵…」を読み、<b>読む人にどんなことがおこるか<\/b>を書かせる。書き出しの例「切りはなしてあると、読む人は……」は使わなくてよい。<br><b>「もとになる言葉（ページ・行目）」を必ず書かせる。<\/b>見つからない児童には「p.158の1〜3行目だけ読んでごらん」と範囲をしぼる。", "say": [], "mark": true}, {"a": 39, "b": 43, "name": "<b>友達と読み合う<\/b>（WS02 ３(3)）", "do": "聞き手は<b>「どの言葉からそう考えたの？」と一回だけ聞く。<\/b>なるほどと思ったことを点線の下に書き足す。書き足すことがない児童には「友達は、何ページの言葉を使っていた？」と聞く。", "say": [], "mark": true}, {"a": 43, "b": 45, "name": "まとめ・ふりかえり<b>（ロードマップの②に書く）<\/b>", "do": "1〜2人に読ませる。ふりかえりは<b>ロードマップの②<\/b>に書き、□にしるし（WS02に欄はない）。", "say": ["高畑さんは、絵をそのまま見せていない。わざと切りはなしている。これも「工夫」です。次の時間、こういう工夫をさがします。"], "mark": false}], "groups": [], "tips": []}, "3": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "3観点の掲示物を指さして「今日はこの3つでさがす」と予告する。", "say": [], "mark": false}, {"a": 3, "b": 12, "name": "<b>筆者の評価が分かる言葉を書きうつす<\/b>（WS03 １）", "do": "p.164 上段で<b>評価の対象が「絵」と「絵巻物」の二つ<\/b>あることを確かめてから書かせる。<b>それぞれ二つで十分。<\/b>行目も書く。<br>・絵…p.156「のびのびと見…」／p.159 9〜10行目「見事にそれを…」<br>・絵巻物…p.161 11〜14行目「日本文化の大…」／p.162「国宝であるだ…」<br><b>探す範囲が分からない児童には、1ページに限定して渡す。<\/b>", "say": [], "mark": false}, {"a": 12, "b": 16, "name": "<b>グループで出し合う<\/b>（WS03 ２）", "do": "<b>一つ書き足せれば十分。<\/b>空欄の児童には「今、だれが何て言った？」と聞き、そのまま書かせる。", "say": [], "mark": false}, {"a": 16, "b": 20, "name": "<b>三つの見方を示し、教師が一例ずつ実演する<\/b>", "do": "<b>ここを省かない。<\/b>「見つけ方」を見せる時間である。WS03の<b>着眼点を読み上げてから<\/b>、例を一つずつ示す（p.164 下段）。<br>・<b>論の展開<\/b>…絵巻物の説明に、まんがやアニメのことを出している<br>・<b>表現の工夫<\/b>（▶文の終わり方／話しかけ・問いかけ／短く言い切る文／様子を表す言葉）…「返し技。」「かわづ掛け。」と言い切る<br>・<b>絵の示し方<\/b>…つながっている絵を、わざと切りはなした（第2時）", "say": [], "mark": true}, {"a": 20, "b": 30, "name": "<b>三つの見方で工夫を書き出す<\/b>（WS03 ３）", "do": "<b>見つけた分だけでよい。<\/b>ページ・行目も書かせる。<b>表現の工夫が見つからない児童<\/b>には、p.158 1行目「どうだい。」と p.159 9〜10行目「たいしたものだ。」を指し、<b>「ふつうの説明文に直すとどうなる？」<\/b>と聞き、ちがいを一言で言わせる。<br>机間は、第2時で根拠が書けていなかった児童から回る。", "say": ["1つ書けたら、それでいいです。たくさん書く人がえらいのではありません。"], "mark": true}, {"a": 30, "b": 35, "name": "<b>ロイロのアンケートに送る<\/b>", "do": "紙の３は<b>下書き<\/b>。<b>一つずつ<\/b>送らせる（1つの工夫＝1回答）。苦手な児童は<b>一つで十分<\/b>。むずかしければ紙を撮影して提出箱へ（教師が入力）。<br>回答一覧を大型テレビに映し、<b>学級全体の見取り図<\/b>を見せる。", "say": [], "mark": false}, {"a": 35, "b": 42, "name": "<b>いちばん「なるほど」と思った工夫<\/b>（WS03 ４）", "do": "３から<b>一つに◎<\/b>。(1)◎の工夫→(2)本文の言葉（ページ・行）→(3)<b>読んだとき、自分にどんなことがおこったか<\/b>。十分満足は(3)が書けている。<br>決められない児童には「<b>読んでいて声が出そうになった所<\/b>はどこ？」と聞く。", "say": [], "mark": true}, {"a": 42, "b": 45, "name": "◎を見せ合う・ふりかえり<b>（ロードマップの③に書く）<\/b>", "do": "となりと◎を見せ合う（1分）。ロードマップの③に書き、□にしるし。", "say": [], "mark": false}], "groups": [], "tips": []}, "4": {"rows": [{"a": 0, "b": 5, "name": "<b>学級の工夫マップを手元で見る<\/b>", "do": "ロイロで配信。<b>前時のWS03（特に４の◎）<\/b>を机上に出させる。", "say": ["きのう、みんなが見つけた工夫を全部まとめました。自分のがどこに入ったか、さがしてごらん。"], "mark": false}, {"a": 5, "b": 8, "name": "めあての確認", "do": "<b>「えらぶ」と「理由を言う」の二つ<\/b>が今日することだと押さえる。第8時と同じ言い方をしておく。", "say": [], "mark": false}, {"a": 8, "b": 20, "name": "<b>工夫を一つえらび、カードに書く<\/b>", "do": "書く内容は3つ。①どんな工夫か　②<b>教科書 p.○ ○行目の「　　」という言葉<\/b>　③読む人にどんな効果があるか。<br><b>読み返す範囲を全文にしない。<\/b><b>WS03の４に書いた工夫から写して始めてよい。<\/b>読み返すのは、そこに書いた行の前後だけでよい。<br>手が止まる児童には<b>おすすめカード（3つに絞ったもの）<\/b>を示して選ばせ、<b>書き出しの型「読む人が〜」<\/b>を渡す。<b>カードは枠のみ・短文でよい<\/b>と明示する。", "say": [], "mark": true}, {"a": 20, "b": 24, "name": "<b>提出箱へ出し、一覧で見比べる<\/b>", "do": "写真で提出し、一覧表示する。<b>ここでの見比べが第8時㋓「くらべる」の予行。<\/b>", "say": [], "mark": false}, {"a": 24, "b": 35, "name": "<b>グループ5人で報告し合う<\/b>", "do": "1人1分半。聞き手は必ず<b>「それは本文のどこから言えるの？」<\/b>と問い返す。<b>問い返しの型を紙で配る。<\/b><br><b>説明者の左隣を「必ず問い返す人」<\/b>と決めておく（聞き役に回りっぱなしの児童を出さない）。", "say": [], "mark": true}, {"a": 35, "b": 40, "name": "<b>赤ペンで書き足す・書き換える<\/b>", "do": "<b>変えなかった児童には「変えなかった理由」を赤で書かせる。<\/b>変えないことも判断である。<br><b>この赤ペンの跡が、第8時で同じことをするときの手本になる。<\/b>", "say": [], "mark": true}, {"a": 40, "b": 45, "name": "ふりかえり", "do": "この工夫を、自分の文章の<b>どこで<\/b>使いたいかを書かせる。<b>カードはポートフォリオへ。第8時・第9時で机上に出す。<\/b>", "say": [], "mark": false}], "groups": [], "tips": [{"head": "つまずき", "items": [["工夫がえらべない", "<b>おすすめカード<\/b>（3つに絞ったもの）を机上に置き、指さして選ばせる"], ["本文のどこから言えるか示せない", "WS03の４（またはアンケートの自分の回答）を見せ、<b>「この1か所だけ見よう」<\/b>と範囲を絞る"], ["効果が書けない", "<b>書き出しの型「読む人が〜」<\/b>を渡し、口で言わせてから書かせる"], ["交流で発言できない", "<b>説明者の左隣を「必ず問い返す人」<\/b>と決める。1人1分半、グループにタイマー"], ["赤ペンで何を書けばよいか分からない", "<b>「だれの、どの言葉を聞いて」<\/b>まで書かせる。変えなかった児童は<b>変えなかった理由<\/b>"]]}]}, "5": {"rows": [{"a": 0, "b": 10, "name": "<b>学習の手引きを読み合わせる（全員）<\/b>", "do": "A・B・C と<b>3つの関門<\/b>を確かめる。<b>進め方のきまり<\/b>を確認する。<b>「困ったときのメニュー」が手引きに刷ってあることを、ここで必ず知らせる。<\/b>「困ったらこれを使っていい」と、初めに言っておく。", "say": ["じゅんばんは自分で決めていい。でも、①②③の関門は、ぜんぶ通ります。とばせません。"], "mark": true}, {"a": 10, "b": 40, "name": "<b>自由進度<\/b>", "do": "教師は個別支援に回る。<b>まず、第4時で手が止まっていた児童から。<\/b>", "say": [], "mark": false}, {"a": 40, "b": 45, "name": "ロードマップに印をつけ、次時の見通しを書く", "do": "「次の時間、どこから始める？」だけ書かせる。", "say": [], "mark": false}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "6": {"rows": [{"a": 0, "b": 5, "name": "今日の計画を立て、ロードマップで確かめる", "do": "座席表を見て、<b>今日まず回る児童を決めておく。<\/b>", "say": [], "mark": false}, {"a": 5, "b": 30, "name": "<b>自由進度<\/b>", "do": "<b>関門②を通っていない児童に集中する。<\/b>この時間が最後のチャンス。", "say": [], "mark": false}, {"a": 30, "b": 40, "name": "<b>【必修の交流】ペアで「いちばん伝えたいみりょく」を言い合う<\/b>", "do": "<b>関門②を通った児童から順にペアをつくる。<\/b>相手は誰でもよい。<b>通っていない児童は、この時間に教師と一緒に決める。<\/b>情報を一緒に見て、その場で一つに絞る。", "say": ["自分の題材と、いちばん伝えたいみりょくを、一言で言ってごらん。聞く人は「それのどこがいいの？」と一回だけ聞き返して。"], "mark": true}, {"a": 40, "b": 45, "name": "ロードマップに印をつける", "do": "関門②の通過状況を<b>座席表で確かめておく<\/b>（第7時の支援順路に使う）。", "say": [], "mark": false}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "7": {"rows": [{"a": 0, "b": 5, "name": "今日の計画を立てる", "do": "<b>「今日で材料をそろえ終わる」<\/b>と明確に告げる。", "say": [], "mark": false}, {"a": 5, "b": 30, "name": "<b>自由進度<\/b>（主にC）", "do": "<b>関門③に集中する。<\/b>2冊目が見つからない児童には<b>対になる本<\/b>を渡す。情報が多すぎて選べない児童には<b>「読む人がいちばんおどろくのはどれか」<\/b>と問う。", "say": [], "mark": false}, {"a": 30, "b": 34, "name": "<b>【全員】5つの型と、高橋さんの文章の型を確かめる<\/b>", "do": "自由進度を切り上げる。p.167の<b>5つの型の短冊<\/b>を黒板に貼り（第8時もそのまま）、<b>色分け拡大版<\/b>で高橋さんの文章の形を一つだけ確かめる。よく知られた特長を<b>簡単に<\/b>→「しかし、私が…」（p.168 11行目）で転じて→<b>くわしく<\/b>。想定は「初めで話題を示し、終わりでくわしく書く」型。<b>事実の確認だけ。深入りしない。<\/b>", "say": [], "mark": true}, {"a": 34, "b": 39, "name": "<b>【全員】型を仮に選び、理由を書く（WS07の６）<\/b>", "do": "選べない児童には<b>「初めに問いを書き、それに答えていく」型<\/b>を勧める。５が書けていない児童は、先に教師と一緒に５を一つに絞る。", "say": ["５に書いた「いちばん伝えたいみりょく」が、いちばんよく伝わる型を一つえらびましょう。次の時間に、かえてもかまいません。"], "mark": true}, {"a": 39, "b": 44, "name": "<b>【全員】グループ（5人）で５と６を言い合う<\/b>", "do": "言えない児童は、６の型の文を<b>そのまま読めばよい<\/b>。第8時の関所と同じ問い返し。", "say": ["聞く人は「その型で、いちばん伝えたいことが伝わる？」と一回だけ聞き返して。"], "mark": true}, {"a": 44, "b": 45, "name": "<b>赤ペン・教師による最終確認<\/b>", "do": "変えた児童は５・６を赤ペンで直し、７に書く。<b>全員分を確かめる。<\/b>①「いちばん伝えたいみりょく」が一文で書けているか　②６に型の印があるか　③関門③が通っているか。<br><b>届いていない児童には、その場で情報カードを渡す。本時に空手で臨む児童をゼロにする。<\/b>授業後、2枚目を提出箱へ（AIで「題材・みりょく・仮の型」を一覧化）。", "say": [], "mark": true}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "8": {"rows": [{"a": 0, "b": 2, "name": "<b>前時に仮に選んだ型を確かめる<\/b>", "do": "第4時のカード（赤ペン入り）と<b>WS07の2枚目<\/b>（みりょく・仮の型・理由）を机上に出させ、６の型をWS08の「えらんだ型」に写させる。5つの型の短冊は<b>第7時から貼ったまま<\/b>。色分け拡大版は<b>㋐のコーナー<\/b>に置いておく（導入では使わない）。", "say": ["「読んで見つけた工夫」と「自分が集めた材料」が、今日つながります。今日の「えらぶ」は、前の時間に仮にえらんだ型で組み立ててみて、たしかめることです。合わなければ、えらび直してかまいません。"], "mark": false}, {"a": 2, "b": 4, "name": "<b>めあてと、学習の進め方を確かめる<\/b>", "do": "めあてを板書。メニュー㋐〜㋔を指さして確認する。<b>始め方は二つだけ示す。<\/b>", "say": ["じゅんばんは自分で決めます。ただし、㋒の「説明の関所」は、全員かならず一回通ります。", "型をもう一度考えたい人は㋐から。このまま組み立てる人は㋑から。"], "mark": false}, {"a": 4, "b": 5, "name": "今日の進み方を決める", "do": "迷っている児童には<b>教師が指さして指定する。<\/b>決めさせることに時間を使わない。", "say": [], "mark": false}, {"a": 5, "b": 20, "name": "支援順路①", "do": "<b>前時に「いちばん伝えたいみりょく」が言えなかった児童、型を選べなかった児童から順に回る<\/b>（第7時後にAIで一覧化した「題材・みりょく・仮の型」から決めた順）。手が止まる児童には、WS07の図の<b>一つのまとまりだけ<\/b>を指して「ここから」と範囲を絞る。", "say": [], "mark": false}, {"a": 20, "b": 23, "name": "<b>ミニ講座「型の選び直し方」第1回（3分）<\/b>", "do": "<b>定時開催。来たい児童だけが来る。<\/b>仮の型で組んでみて合わなかった児童向け。黒板の前で、5つの型を一つずつ「こういうときに向く」と紹介し、<b>選び直したら「えらんだ型」に赤ペンで印<\/b>をつけ直すよう伝える。型を選べていない児童には<b>「初めに問いを書き、それに答えていく」型<\/b>を勧める。", "say": [], "mark": true}, {"a": 26, "b": 26, "name": "<b>関所の通過チェック<\/b>", "do": "<b>黒板横の通過名簿を見る。<\/b>○の無い児童のWS08「２ 説明の関所」の欄を確かめ、□が二つとも空いている児童に声をかけ、<b>一緒にテーブルまで行く。<\/b>教師が最初の聞き役になってよい。", "say": ["まだ書けていなくていい。書けたところまでで話しておいで。"], "mark": true}, {"a": 28, "b": 28, "name": "<b>全体に一声<\/b>", "do": "<b>細かい時間配分は児童に任せる。これ以上、時間の指示はしない。<\/b>", "say": ["あと10分です。そろそろ㋔（書きかえる）に入りましょう。"], "mark": true}, {"a": 32, "b": 35, "name": "<b>ミニ講座「型の選び直し方」第2回（3分）<\/b>", "do": "第1回に来なかった児童で、仮の型が合わずに迷っている児童に声をかけて誘う。", "say": [], "mark": true}, {"a": 35, "b": 38, "name": "指名する児童を決める", "do": "<b>型を選び直した児童を2〜3名<\/b>見つけておく（WS08の「えらんだ型」に<b>赤ペンの印<\/b>がある児童）。<b>更新前と更新後の写真が両方あるか<\/b>を確かめる。", "say": [], "mark": false}, {"a": 38, "b": 43, "name": "<b>型を選び直した児童を指名し、更新前後を並べて提示<\/b>", "do": "ロイロで並べる。<b>「変えなかった人」も1名指名する。<\/b>変えないことも判断であると学級に返す。", "say": ["どうして、この型に変えたの？　だれの、どの言葉を聞いて変えた？"], "mark": false}, {"a": 43, "b": 45, "name": "ふりかえり", "do": "WS08の<b>４<\/b>に今日の進め方でよかったことを書かせる（次時は「く」と★のところをいちばんくわしく書く、と一言伝える）。<b>構成メモをポートフォリオに綴じさせる。<\/b>", "say": ["どのコーナーから始めて、どう進みましたか。やってみてよかったことを書きましょう。"], "mark": false}], "groups": [{"a": 5, "b": 38, "name": "自由進度"}, {"a": 38, "b": 45, "name": "共有・ふりかえり"}], "tips": [{"head": "起きたこと", "items": [["<b>ネットワーク・ロイロが使えない<\/b>", "㋓「くらべる」は、<b>構成メモの現物を黒板前の机に型ごとに並べる<\/b>形にする。<b>本時の中心（えらぶ・説明する・書きかえる）は紙だけで成立する。<\/b>"], ["<b>関所に行列ができた<\/b>", "テーブルは3か所ある。教師が「こちらが空いています」と分ける。それでも詰まったら、<b>教師自身が4か所目の聞き役<\/b>になる。"], ["<b>全体に進みが遅い<\/b>", "<b>㋓「くらべる」を省いてよい。<\/b>㋒（関所）と㋔（書きかえる）は省かない。この二つが本時の中心。"], ["<b>早く終わる児童が多い<\/b>", "①別の型で組み直して二つを比べる　②㋓で<b>自分と違う型の人を3人見つけ、理由を読み取る<\/b>　③関所に二回目として行き、<b>今度は聞き役を多めに務める。<\/b>"], ["<b>材料が乏しい児童<\/b>", "<b>情報カードをすぐ渡す。<\/b>本時で題材から考え直させない。㋐から始めさせれば、前半は確実に参加できる。"]]}]}, "9": {"rows": [{"a": 0, "b": 5, "name": "<b>第4時のカードと第8時の構成メモを机上に出す<\/b>", "do": "<b>どちらも赤ペンが入っている。<\/b>「読んで選んだ工夫」と「自分で選んだ構成」を手元に置いて書く。<b>単元を貫く筋が、児童の手元で見える。ここを省かない。<\/b>", "say": [], "mark": true}, {"a": 5, "b": 10, "name": "高橋さんの作例の工夫を見つける", "do": "p.168 欄外「よさを伝えるときの言葉」を確かめて<b>掲示する<\/b>（掲示物は 03_掲示・教具/横書き/掲示物_短冊.html の最終ページ）。<br>「いちばん伝えたいみりょくは、―だ。」「―は欠かせない。」「―ならではだ。」「―こそ、―だ。」", "say": [], "mark": false}, {"a": 10, "b": 13, "name": "<b>第4時で選んだ工夫を使う場所を決める<\/b>", "do": "構成メモのどこで使うか、印をつけさせる。", "say": ["第4時でえらんだ工夫を、どこで使いますか。構成メモに印をつけましょう。"], "mark": false}, {"a": 13, "b": 28, "name": "<b>構成メモをもとに書く<\/b>", "do": "手が止まる児童には、構成メモの<b>一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。<br>作文のきまりが不安な児童には<b>書き出しの一文を入れた用紙<\/b>を渡す。", "say": [], "mark": false}, {"a": 28, "b": 35, "name": "<b>手を止めて、書き出しだけをグループで読み合う<\/b>", "do": "<b>途中で止めることに意味がある。<\/b>最後まで書いてからでは直せない。", "say": ["最初の2〜3行だけ読み合ってください。「読みたくなった」と思ったら、そう言ってあげて。"], "mark": true}, {"a": 35, "b": 43, "name": "続きを書く／写真や図の使い方、文末表現を工夫する", "do": "字を書くことに苦手意識のある児童は、<b>ロイロでの入力を選べる<\/b>ようにする。", "say": [], "mark": false}, {"a": 43, "b": 45, "name": "ふりかえり", "do": "2時間目に入る場合は、<b>次にどこから書くか<\/b>を書かせて終わる。", "say": [], "mark": false}], "groups": [], "tips": []}, "10": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "感想の型を配る。<b>「よかった」で終わらせない<\/b>と告げる。", "say": [], "mark": false}, {"a": 3, "b": 20, "name": "<b>グループで読み合い、よいところを伝える<\/b>", "do": "<b>「使われている筆者の工夫」を指摘させる。<\/b>これが単元の筋を児童に自覚させる場面。<b>全員に感想が行き渡るよう、読む順番を教師が指定する。<\/b>", "say": ["ここ、高畑さんの「呼びかけ」を使ってるね　――　こんなふうに言えたら最高です。"], "mark": true}, {"a": 20, "b": 28, "name": "ロイロで、グループ外の文章も読む", "do": "同じ題材を選んだ人、違う型を選んだ人、という<b>見る観点<\/b>を示す。", "say": [], "mark": false}, {"a": 28, "b": 36, "name": "p.169「ふりかえろう」「たいせつ」「いかそう」", "do": "身につけた力を言葉にして押さえる。", "say": [], "mark": false}, {"a": 36, "b": 43, "name": "<b>ポートフォリオを見返し、自分の学びの変化を振り返る<\/b>", "do": "<b>第4時のカードと完成した文章を並べて見せ、つながりを言葉にさせる。<\/b><b>自由進度についても振り返らせる。<\/b>", "say": ["第4時に「使いたい」とえらんだ工夫は、ほんとうに使えましたか。自分の文章のどこに出ていますか。", "自分で進め方を決めて学習した時間がありました。やってみて、どうでしたか。"], "mark": true}, {"a": 43, "b": 45, "name": "まとめ", "do": "次の単元でも使える力として言い直して終える。", "say": [], "mark": false}], "groups": [], "tips": []}}, "flow8": [{"min": 5, "name": "導入（全員）", "body": "第7時に仮に選んだ型をWS08に写す／めあて（5つの型の短冊は第7時から貼ったまま）／メニュー㋐〜㋔と「関所は必ず1回」の確認／<b>自分の進み方を決める<\/b>"}, {"min": 33, "name": "自由進度", "body": "㋐たしかめ（型を変えたらどう変わるか）／㋑組み立てる（仮の型で構成メモ）／<b>㋒説明の関所〈必修〉<\/b>／㋓くらべる（型ごとに並べて見る）／㋔書きかえる（赤ペン）<br>※ミニ講座「型の選び直し方」を15分後・27分後に3分ずつ定時開催"}, {"min": 7, "name": "共有・ふりかえり", "body": "型を選び直した児童を2〜3名指名し、更新前後を並べて提示／今日の<b>進め方<\/b>の振り返り（WS08の４）"}], "tedate8": [["<b>どのコーナーから始めればよいか分からない<\/b>", "導入で「<b>型をもう一度考えたい人は㋐から／このまま組み立てる人は㋑から<\/b>」と、始め方を2つだけ示す。迷う児童には教師が指さして指定する。"], ["<b>型が選べない／仮の型が合わない<\/b>", "型は第7時の終わりに仮に選んである。選べていない児童には「<b>初めに問いを書き、それに答えていく<\/b>」型を勧める（いちばん書き進めやすい）。組んでみて合わない児童は㋐か<b>ミニ講座「型の選び直し方」（15分後・27分後に定時開催）<\/b>に誘い、選び直してよいことを伝える。"], ["<b>高橋さんの文章が読めない<\/b>（㋐）", "範読音声を手元で聞けるようにする。あわせて、<b>段落ごとに色分けした拡大版<\/b>を㋐のコーナーに置き、「簡単に書いている部分」「くわしく書いている部分」が色で分かるようにする。"], ["<b>構成メモが書けない・作文のルールが不安<\/b>", "構成メモは<b>文でなく短い語句でよい<\/b>ことを明示する。評価するのは文の量や体裁ではなく、<b>「いちばん伝えたいこと」がどこに置かれているか<\/b>であると事前に伝える。"], ["構成メモの形式に迷う", "<b>枠が決まっているもの<\/b>と<b>自由に書けるもの<\/b>の2種類を用意し、選べるようにする。"], ["<b>「なぜその構成か」が説明できない<\/b>", "説明の型を紙で配る ——「<b>わたしがいちばん伝えたいのは○○です。だから、○○の型にしました。<\/b>」関所のテーブルにも置いておく。"], ["<b>関所に行けない・行きそびれる<\/b>", "<b>黒板横の通過名簿の空欄で未通過が分かる。開始20分の時点で未通過の児童に教師が声をかけ、一緒にテーブルまで行く。<\/b> 教師が最初の聞き役になってもよい。"], ["関所に聞き手がいない", "<b>通った人は、次に来た1人の聞き役を務めてから戻る<\/b>というきまりで、聞き手を絶やさない。ただし<b>各テーブルの最初の説明者には聞き手がいない<\/b>ので、<b>構成メモを早く書き終えそうな児童を、開始時に各テーブルの最初の聞き手として1人ずつ指名しておく<\/b>（候補は <code>設計メモ/単元シミュレーション.md<\/code>）。テーブルは教室に<b>3か所<\/b>置き、一方に人が偏らないようにする（2か所では33分で30人を通しきれない見込みのため。→ <code>設計メモ/単元シミュレーション.md<\/code>）。"], ["関所で話が長くなる／短く終わる", "テーブルに<b>砂時計<\/b>を置き、1人1分半。聞き手には問い返しの型を紙で渡し、<b>必ず1回は問い返す<\/b>ことをきまりにする。"], ["<b>早く終わる児童<\/b>", "<b>別の型で組み直したらどうなるか<\/b>を試させ、二つを比べて選ぶ。または㋓で全員の構成メモを見て、<b>自分と違う型を選んだ人を3人見つけ、理由を読み取る<\/b>。関所に2回目として行ってもよい。"], ["手が止まって動けない", "構成メモの<b>一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。第7時に確認した「いちばん伝えたいみりょく」を教師が読み上げ、そこから始めさせる。"], ["<b>時間の見通しがもてない<\/b>", "黒板に<b>残り時間<\/b>を大きく示し、「<b>あと10分になったら、書きかえ（㋔）に入る<\/b>」とだけ全体に声をかける。細かい時間配分は児童に任せる。"]], "yusen": ["<b>関門③（2つの出典で確かめ、出典を書く）まで通っているか<\/b>が、そのまま「材料をもっているか」を示す。残りは教師の座席表で分かる。", "第6時の終わりまでに<b>関門②（題材と「いちばん伝えたいみりょく」が一言で言える）<\/b>を通っていない児童には、その時間に教師が一緒に情報を見て<b>一つに絞る。<\/b>", "それでも足りない児童には、<b>教師が用意した情報カード<\/b>（題材ごとに事実を3〜4枚に整理したもの）を渡す。<b>本時に空手で臨む児童をゼロにする。<\/b>"], "prep": {"pre": {"title": "単元に入る前", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>司書との日程調整<\/b>（第5〜7時の図書館）。第1時の週のうちに済ませる", "id": "pre-1"}, {"tag": "物", "text": "<b>日本文化の本を教室に配架<\/b>。第1時から手に取れる状態にしておく（図書館の割り当てが動いても吸収できる）", "id": "pre-2"}, {"tag": "物", "text": "<b>「先生のおすすめ」5冊<\/b>を選んで別置き。写真が多く、説明の工夫が見つけやすいもの。選書の観点は <code>02_教師用/WS05_選書の観点.html<\/code> を司書に渡す", "id": "pre-3"}, {"tag": "物", "text": "<b>対になる本<\/b>（同じ題材を別の角度から書いた本）を何組か確保。関門③で2冊目が見つからない児童に渡す", "id": "pre-4"}, {"tag": "事", "text": "<b>NotebookLM<\/b> に教科書本文（p.155〜169）・指導書・年間指導計画を読み込ませ、筆者の工夫を3観点で洗い出す。<b>出力は本文の該当行と突き合わせて採否を決める<\/b>", "id": "pre-5"}, {"tag": "事", "text": "<b>Gemini<\/b> で、おすすめカード・書き出しの型・教師版モデル文のたたき台を複数案出させ、学級の実態に合わせて選び直す。<b>準備にかかった時間を記録<\/b>（協議会で使う）", "id": "pre-6"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS00_ロードマップ_児童用.html<\/code>（人数分）。第1時に配り、第10時まで同じ1枚を使う", "id": "pre-7"}, {"tag": "物", "text": "<b>ポートフォリオ<\/b>（綴じるファイル）を人数分", "id": "pre-8"}, {"tag": "事", "text": "<b>ロイロカード<\/b>（<code>01_児童に配る/ロイロカード/<\/code>）の画像の上にテキストを重ねられるか、学級の端末で一度ためす", "id": "pre-9"}]}]}, "1": {"title": "第1時まで", "groups": [{"sub": "", "items": [{"tag": "物", "text": "『鳥獣戯画』の絵の<b>拡大提示<\/b>（大型テレビ）。画像は <code>03_掲示・教具/絵の切り抜き/<\/code>、黒板に貼る版は <code>03_掲示・教具/絵の切り抜き_印刷用.html<\/code>（A4横9枚）", "id": "1-1"}, {"tag": "物", "text": "<b>範読音声<\/b>を手元で聞ける状態に。<b>以降ずっと使えるようにしておく<\/b>", "id": "1-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS01_児童用.html<\/code>／<code>01_児童に配る/横書き/WS00_ロードマップ_児童用.html<\/code>", "id": "1-3"}]}]}, "2": {"title": "第2時まで", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>教科書 p.156〜157・p.158 の絵を撮影し、ロイロで配れるように<\/b>しておく（<b>済<\/b>：教科書PDFから切り抜いた画像が <code>03_掲示・教具/絵の切り抜き/<\/code> にある。撮影は不要。01・02をロイロに送る）。iPadのペンで書き込ませ、提出箱に出させる（紙には刷らない）", "id": "2-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS02_児童用.html<\/code>", "id": "2-2"}, {"tag": "物", "text": "赤・青のペン", "id": "2-3"}]}]}, "3": {"title": "第3時まで", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b>3観点の掲示物<\/b>を教室前方に貼る（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.1〜2。以後外さない）", "id": "3-1"}, {"tag": "物", "text": "<b>ふせん（1人10枚程度）<\/b>", "id": "3-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS03_児童用.html<\/code>", "id": "3-3"}, {"tag": "事", "text": "授業後、ふせんを回収（または写真）→ <b>氏名を外して<\/b>AIで3観点に分類 → 教員が本文と突き合わせて修正 → <b>第4時の「学級の工夫マップ」<\/b>", "id": "3-4"}, {"tag": "事", "text": "協議会用に「<b>AIが挙げたが本文の根拠が薄く、採用しなかった例<\/b>」を1つ以上メモ", "id": "3-5"}]}]}, "4": {"title": "第4時まで　※第8時の型をつくる時間", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>学級の工夫マップ<\/b>をロイロで配信できる状態に", "id": "4-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS04_児童用.html<\/code>（工夫カード）", "id": "4-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS04_おすすめカード.html<\/code>（3つに絞った工夫）。<b>困る前から机上に置く<\/b>", "id": "4-3"}, {"tag": "刷", "text": "<b>書き出しの型「読む人が〜」<\/b>（<code>01_児童に配る/横書き/教具D_書き出しの型_読む人が.html<\/code>）を切って机上に置く", "id": "4-4"}, {"tag": "物", "text": "<b>赤ペン（全員）<\/b>／グループ用タイマー", "id": "4-5"}]}]}, "5": {"title": "第5時まで　※自由進度ブロックの入口", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b><code>01_児童に配る/横書き/学習の手引き_児童用.html<\/code>（両面）<\/b>を人数分。裏が「困ったときのメニュー」", "id": "5-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS05_児童用.html<\/code>／<code>01_児童に配る/横書き/WS06_児童用.html<\/code>／<code>01_児童に配る/横書き/WS07_児童用.html<\/code>（関門①②③のシート）", "id": "5-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS07_情報カード.html<\/code>（児童の追加用）／<code>02_教師用/WS07_教師用情報カード.html<\/code>（<b>9題材<\/b>。支援用に手元へ）", "id": "5-3"}, {"tag": "刷", "text": "<b>見取り用の座席表<\/b>（<code>02_教師用/見取り用_座席表.html<\/code>。1枚目＝第5〜7時用、2枚目＝第8時用）。関門の印を押したら日付を書き込む", "id": "5-4"}, {"tag": "物", "text": "<b>相談テーブル<\/b>を教室の一角に常設", "id": "5-5"}, {"tag": "物", "text": "<b>関門の印を押すもの<\/b>（スタンプ等）。押した日付をメモできるようにしておく", "id": "5-6"}, {"tag": "事", "text": "日本文化の本がそろっているか、<b>司書と最終確認<\/b>", "id": "5-7"}]}, {"sub": "第7時の終わり15分（全員）のために", "items": [{"tag": "刷", "text": "<b>5つの型の短冊<\/b>（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.5〜7）を、30分の時点で黒板に貼る。<b>第8時までそのまま<\/b>", "id": "5-8"}, {"tag": "刷", "text": "<b>高橋さんの文章の色分け拡大版<\/b>（<code>03_掲示・教具/横書き/教具A_和食の心_色分け拡大版.html<\/code>。A3縦）を黒板に。第8時は㋐のコーナーへ移す", "id": "5-9"}, {"tag": "事", "text": "グループ（5人×6）の並び方を決めておく（自由進度から15分で切りかえるため）", "id": "5-10"}]}]}, "8": {"title": "第7時が終わったら（＝公開の直前）", "groups": [{"sub": "第7時が終わったら（前日まで）", "items": [{"tag": "事", "text": "児童の「題材」「いちばん伝えたいみりょく」「<b>仮に選んだ型<\/b>」（WS07の2枚目）を<b>氏名を外して<\/b>AIで一覧化 → 教員が確認 → <b>どの児童が型を選び直しそうか<\/b>を見立てる", "id": "8-1"}, {"tag": "事", "text": "<b>本時の支援順路のメモ<\/b>と<b>意図的指名の候補<\/b>を決めて紙に書き出す（当日手元に持つ）", "id": "8-2"}, {"tag": "事", "text": "協議会用に「<b>AIの見立てと教員の見取りが食い違った例<\/b>」を1つ以上メモ", "id": "8-3"}, {"tag": "事", "text": "全員が関門③を通っているか、WS07の６に型の印があるか最終確認。<b>届いていない児童にはその場で情報カードを渡す<\/b>（本時に空手で臨む児童をゼロにする）", "id": "8-4"}]}, {"sub": "当日朝までに", "items": [{"tag": "刷", "text": "<b>5つの型の短冊<\/b>は第7時から貼ったまま（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.5〜7）。はがれていないか確かめる", "id": "8-5"}, {"tag": "刷", "text": "<b>メニュー㋐〜㋔の短冊<\/b>を貼る（同 p.7〜9。<b>㋑は「組み立てる」に刷り直したもの<\/b>）", "id": "8-6"}, {"tag": "刷", "text": "<b>各コーナーの立て表示<\/b>を置く（同 p.7〜9 をもう1部刷って折る）", "id": "8-7"}, {"tag": "物", "text": "<b>説明テーブルを3か所<\/b>設置", "id": "8-8"}, {"tag": "刷", "text": "<b>関所の通過名簿<\/b>（<code>03_掲示・教具/横書き/関所の通過名簿.html<\/code>。<b>A3に拡大<\/b>）を黒板横に貼る／<b>見取り用の座席表<\/b>の2枚目を手元に", "id": "8-9"}, {"tag": "物", "text": "第4時の<b>学級の工夫マップ<\/b>を教室後方に掲示", "id": "8-10"}, {"tag": "刷", "text": "<b>高橋さんの文章の色分け拡大版<\/b>（<code>03_掲示・教具/横書き/教具A_和食の心_色分け拡大版.html<\/code>。<b>A3縦<\/b>）を㋐コーナーに置く", "id": "8-11"}, {"tag": "刷", "text": "<b>5つの型の見本<\/b>（<code>03_掲示・教具/横書き/教具G_和食の心_5つの型の見本.html<\/code>。<b>A3縦5枚<\/b>）を手元に。出すかどうか・どの型を出すかは、児童の様子を見て決める", "id": "8-12"}, {"tag": "刷", "text": "<b>㋐の「書き出しの一文」<\/b>（<code>01_児童に配る/横書き/教具B_書き出しの一文_㋐.html<\/code>）を切って㋐に積む", "id": "8-13"}, {"tag": "物", "text": "<b>iPadを充電<\/b>しておく", "id": "8-14"}, {"tag": "刷", "text": "<b>板書イメージ<\/b>（<code>02_教師用/横書き/板書イメージ_第08時.html<\/code>）を手元に。短冊・めあて・関所の通過名簿をどこに貼るかの見本", "id": "8-15"}]}, {"sub": "直前10分で", "items": [{"tag": "刷", "text": "<b>構成メモ2種<\/b>を㋑に多めに積む（<code>01_児童に配る/横書き/WS08_児童用_型あり.html<\/code>／<code>01_児童に配る/横書き/WS08_児童用_自由.html<\/code>）", "id": "8-16"}, {"tag": "刷", "text": "<b>説明の型・問い返しの型<\/b>（<code>03_掲示・教具/横書き/教具C_説明の型_関所.html<\/code>）を二つ折りにして説明テーブルへ。<b>3部<\/b>", "id": "8-17"}, {"tag": "物", "text": "<b>砂時計3個<\/b>（1人1分半）を説明テーブルへ", "id": "8-18"}, {"tag": "刷", "text": "<b>情報カード（支援用）<\/b>を手元に", "id": "8-19"}, {"tag": "事", "text": "<b>支援順路のメモ<\/b>を手元に", "id": "8-20"}]}, {"sub": "児童の机上に出させるもの", "items": [{"tag": "", "text": "教科書／第4時の工夫カード（赤ペン入り）／<b>WS07の2枚目（みりょく・仮の型・理由）<\/b>／赤ペン／iPad", "id": "8-21"}]}, {"sub": "参観者に配るもの（3点）", "items": [{"tag": "刷", "text": "<b>本時案<\/b>（<code>04_参観者用/指導案08_参観者用様式.docx<\/code>）", "id": "8-22"}, {"tag": "刷", "text": "<b>メニュー㋐〜㋔の一覧<\/b>（<code>04_参観者用/参観者用_メニュー一覧.html<\/code>）", "id": "8-23"}, {"tag": "事", "text": "<b>児童の題材と伝えたいことの一覧（氏名なし）<\/b>。<code>04_参観者用/参観者用_題材一覧_様式.html<\/code> に入力して印刷（第7時終了後のAI整理＋教員の確認から）", "id": "8-24"}]}, {"sub": "想定外への備え（物として用意しておく）", "items": [{"tag": "", "text": "<b>ネットワークが落ちたとき<\/b>……㋓「くらべる」は構成メモの現物を黒板前の机に型ごとに並べる", "id": "8-25"}]}]}, "9": {"title": "第9時まで　※実態により2時間扱い", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b>「よさを伝えるときの言葉」の掲示<\/b>（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.10。教科書 p.168 欄外）", "id": "9-1"}, {"tag": "物", "text": "<b>原稿用紙<\/b>", "id": "9-2"}, {"tag": "刷", "text": "<b>書き出しの一文を決める用紙<\/b>（<code>01_児童に配る/横書き/教具E_書き出しの用紙_第9時.html<\/code>）。手が止まる児童に渡す", "id": "9-3"}, {"tag": "事", "text": "清書を<b>ロイロで提出<\/b>させる設定（第10時の相互閲覧の準備）", "id": "9-4"}]}]}, "10": {"title": "第10時まで", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>全員の清書がロイロで相互閲覧できる状態<\/b>に", "id": "10-1"}, {"tag": "刷", "text": "<b>感想の型<\/b>（<code>01_児童に配る/横書き/教具F_感想の型_第10時.html<\/code>）。人数分", "id": "10-2"}, {"tag": "物", "text": "<b>ポートフォリオが全員分そろっているか<\/b>確認。第2時の絵（ロイロの提出箱）→ 第3時のふせん → 第4時のカード → 学習の手引き → 第8時の構成メモ → 作品 の順に整える", "id": "10-3"}, {"tag": "事", "text": "授業後、ポートフォリオと振り返りを<b>氏名を外して<\/b>AIで整理し、協議会資料にまとめる", "id": "10-4"}]}]}}, "prompts": [{"title": "１ 教材研究：筆者の工夫を三観点で洗い出す", "when": "第3時の準備（単元に入る前）", "prompts": ["ソース「本文」の「『鳥獣戯画』を読む」（高畑勲）の部分（p.156〜162）だけを根拠にしてください。\nこの文章で筆者が使っている「読者に伝えるための工夫」を、教科書 p.165 にある\n三つの観点に分けて書き出してください。\n\n １ 論の展開の工夫（何をどの順で示しているか）\n ２ 表現の工夫（言葉の選び方、文末、比喩、くり返し、読者への呼びかけなど）\n ３ 絵の示し方の工夫（どの絵を、どう切り取って、どこに置いているか）\n\n条件：\n・観点ごとに5つまで。多く挙げるより、本文の言葉で確かめられるものだけを挙げる。\n・1つにつき「工夫の名前／ページと行番号／引用（本文どおり一文）／\n  その工夫が読者にどう働くか」の4点を、この順で書く。\n・ページと行番号が特定できないものは挙げない。\n・6年生の児童が読み取れる範囲のものに絞る。専門用語で説明しない。", "いま挙げた工夫のうち、ソース「年間指導計画」のこの単元の評価規準\n（「読むこと」C(1)ア・ウ、知識・技能(1)ク）に結びつくものはどれですか。\n評価規準の文言を引用して、工夫ごとに示してください。結びつかないものは「なし」とします。"]}, {"title": "２ 支援資料のたたき台をつくる", "when": "第8時（本時）の準備", "prompts": ["黒板に貼る短冊と、児童に配る話し方の型を作ります。たたき台を複数案ください。\n選ぶのはこちらです。\n\n【授業の中身】\n自分が選んだ日本文化のよさを伝える文章を書く単元です。本時は、ソース「本文」の\np.167「文章の構成を考えるときは」にある五つの型から自分の目的に合うものを選び、\nなぜその構成にしたのかを友達に説明します。\n\n【作ってほしいもの】\n(1) まず、p.167 の五つの型を、本文どおりに写して並べる。\n(2) 黒板用の短冊5枚の文言。1枚15字以内。児童が一目で型を思い出せる言い方に。\n(3) 自分の構成を説明するときの話し方の型。3案。\n    「わたしがいちばん伝えたいのは○○です。だから、○○の型にしました。」を\n    土台にして、理由まで言えるように少し伸ばした形にする。\n(4) 聞き手が問い返すときの言い方。3案。責める言い方にならないもの。\n(5) (2)〜(4)で使った漢字のうち、ソース「漢字配当表」に無いものの一覧。無ければ「なし」。\n\n条件：\n・1文を短くする。長い修飾語を重ねない。\n・「頑張ろう」のような励ましは入れない。何をするかだけを書く。"]}, {"title": "２-２ 教師用情報カードのたたき台をつくる", "when": "第5〜7時（自由進度ブロック）の準備", "prompts": ["チェックを入れたソースは、学校図書館の本のページです。\n本で材料が集まらない児童のために、教師が「情報カード」を作ります。その候補を出してください。\n\n【題材】（ここに一つだけ書く。例：和紙）\n\n【やってほしいこと】\n(1) ソースに書かれている事実を8つまで。1つにつき1〜2文。\n    6年生が読んで分かる言葉に直してよいが、意味を変えない。\n(2) それぞれに、根拠にしたソースの名前（書名）と、そのページに書かれている元の文を添える。\n\n条件：\n・ソースに書かれていないことは挙げない。\n・数字（年・数・長さ）は、ソースに書かれているとおりにする。\n・「すばらしい」「美しい」などの評価は書かない。事実だけにする。"]}, {"title": "３ 第3時のあと：児童が書き出した工夫を三観点に分類する", "when": "第3時終了後〜第4時の準備", "prompts": ["ソース「第3時ふせん」は、6年生が「『鳥獣戯画』を読む」を読んで書き出した\n「筆者の工夫」の記述です。学級で共有する一覧を作るので、次のとおり整理してください。\n\n【分類の観点】\n １ 論の展開の工夫\n ２ 表現の工夫\n ３ 絵の示し方の工夫\n\n【やってほしいこと】\n(1) それぞれの記述を、上の三つのどれかに分ける。どれにも入らないものは\n    「その他」に置き、なぜ分けられなかったかを一言添える。\n(2) 観点ごとに、似た内容の記述をまとめ、何人がそれに触れたかを数える。\n(3) それぞれの記述が、ソース「本文」のどこを指していそうかを、ページと行番号で示す。\n    特定できないものは「特定できない」と書く。これは教師が確かめるための候補です。\n(4) 観点ごとに、本文にはあるのに「この学級ではほとんど出ていない」工夫を、\n    ページと行番号を添えて挙げる。次の時間に教師が補うべき点として使います。\n\n条件：\n・一つの記述が二つの観点にまたがる場合は、両方に置き、その旨を書く。"]}, {"title": "３-２ 分類した結果を「学級の工夫マップ」の形に整える", "when": "３の出力を教員が直し終えたあと（第4時の前日まで）", "prompts": ["【１ 論の展開の工夫】\n・さいしょがおすもうの実況みたいで、絵の中に入った感じがした　p.○ ○〜○行\n・（以下同じ形式）\n【２ 表現の工夫】\n・「ためしに、ぱ…」と言われて、本当にめくった　p.○ ○行\n【３ 絵の示し方の工夫】\n・（同じ形式）\n【まだ出ていないこと】（３の(4)から、教員が選んだものだけ）\n・（例）絵のどの部分を切り取って見せているか", "児童に配る「学級の工夫マップ」を作ります。\nソース「第3時分類（修正済み）」は、学級の児童が「『鳥獣戯画』を読む」を読んで見つけた\n「筆者の工夫」を、教師が三つの観点に分けたものです。\nこれを、A4横1枚に収まる印刷用のHTMLにしてください。\n\n【紙の形】\n・表題「学級の工夫マップ　―『鳥獣戯画』を読む―」。その下に一行で\n  「みんなが見つけた筆者の工夫です。自分が見つけていなかった工夫をさがそう。」\n・三つの観点を横に三列で並べる（左から　論の展開／表現／絵の示し方）。\n・一つの工夫を一つの枠に入れる。枠の中は\n  「児童の言葉（そのまま）」と「p.○ ○行（書いてあるものだけ）」の二つだけ。\n  何人が書いたかは出さない。\n・枠の並びは、教科書に出てくる順（ページ・行の小さい順）。ページが無いものは列の最後。\n・【まだ出ていないこと】がある場合だけ、下に全幅の枠を一つ置き、見出しを\n  「まだマップにない工夫はないかな？」とする。中身は問いの形にして、答えは書かない。\n\n【言葉の決まり】\n・児童番号・名前は出さない。\n・「よい工夫」「すばらしい」などの評価の言葉、順位、おすすめの印を付けない。\n  書いた人の多い少ないで、枠の大きさや色を変えない。\n\n【HTMLの決まり】\n・1ファイルで完結させる（外部ファイル・画像・JavaScriptを使わない）。\n・@page { size: A4 landscape; margin: 11mm; } 。寸法は mm と pt で指定する。\n・フォントは \"BIZ UDPGothic\" を先頭に置く。本文10.5pt、観点の見出し12pt。\n・枠線はグレー（#6a6a6a、1pt）。背景のぬりつぶしは、観点の見出しにうすい色を使う程度にする。\n・工夫の数が多くて1枚に収まらないときは、文字を小さくする前に、枠の間のすき間を詰める。\n  それでも入らないときは、入らなかった工夫を HTML の外に一覧で書き出して知らせる。\n・HTMLの中に、ソースの番号（［1］など）を入れない。\n\n最後に、HTMLとは別に次の二つを書いてください。\n(1) ソースにある工夫の数と、マップに入れた工夫の数（観点ごと）。\n(2) 写すときに一字でも変えた箇所があれば、その一覧。無ければ「なし」。"]}, {"title": "４ 第7時のあと：題材と「いちばん伝えたいみりょく」を一覧化する", "when": "第7時終了後〜本時（第8時）の準備。本時の支援の順路を決めるために使う", "prompts": ["ソース「第7時題材」は、6年生が「日本文化のよさを伝える文章」を書くために選んだ題材と、\n「いちばん伝えたいみりょく」の記述です。次の時間、この子たちはソース「本文」の\np.167 にある五つの構成の型から一つを選んで構成メモを作ります。\n\n【やってほしいこと】\n(1) 児童番号・題材・いちばん伝えたいみりょく、の3列の表にする。\n(2) 「いちばん伝えたいみりょく」が、次のどれに当たるか印を付ける。\n    Ａ 具体的に一つに絞れている\n    Ｂ 書いてはあるが、題材の説明にとどまっていて「みりょく」になっていない\n    Ｃ 空欄、または一言だけで何を伝えたいか読み取れない\n(3) ＢとＣの児童について、次の時間に教師がかける一言を1つずつ考える。\n    「がんばろう」ではなく、その子の記述の中の言葉を使って、\n    どこから書き始めればよいかを示す一言にする。\n(4) 題材が近い児童どうしを挙げる。交流の組み方を考える材料にします。\n(5) Ａの児童について、記述の中身が p.167 の五つの型のどれと結びつきやすいかを、\n    記述の言葉を根拠にして一つ挙げる。型を選ぶのは児童なので、これは教師の見当です。\n\n条件：\n・ＡＢＣは支援の順番を決めるための印です。記述の優劣ではありません。\n・読み取れないものはＣにする。"]}, {"title": "５ 〔任意〕本時の共通課題の答えを想定しておく", "when": "本時の準備。活動４で児童から出る反応の見当をつける", "prompts": ["次の問いを、6年生全員に考えさせます。児童からどんな答えが出そうか、想定を挙げてください。\n\n【教材】ソース「本文」p.168〜169 の作例「和食の心」（高橋さんの文章）\n【問い】もし高橋さんが、p.167 の「『初め』に『問い』を書き、それに答えていく。」型で\n　　　　書いたら、どこが変わるか。\n\n【やってほしいこと】\n(1) まず、作例の今の構成を、本文の文を引用しながら3〜4段に分けて示す。\n(2) 6年生が実際に言いそうな答えを、児童の言葉づかいで10通り。\n(3) そのうち「順番が変わる」で止まっている答えと、「伝わり方が変わる」まで\n    届いている答えを分ける。\n(4) 「順番が変わる」で止まっている子に、教師がかける問い返しを3つ。"]}, {"title": "６ 第9時のあと：作品に使われた工夫を拾い、第10時の読み合いを準備する", "when": "第9時終了後〜第10時の準備", "prompts": ["ソース「第9時清書」は、6年生が書いた「日本文化のよさを伝える文章」です。\n次の時間、グループで読み合い、友達の文章に使われている「筆者の工夫」を指摘し合います。\nその準備として、次のとおり整理してください。\n\n【筆者の工夫の三つの観点】（「『鳥獣戯画』を読む」で学んだもの）\n １ 論の展開の工夫\n ２ 表現の工夫（読者への呼びかけ、文末、くり返し、たとえ など）\n ３ 絵の示し方の工夫（写真や図をどこに、どう置くか）\n\n【やってほしいこと】\n(1) 児童ごとに、文章の中で使われている工夫を、三つの観点に分けて挙げる。\n    1つにつき、文章から一文をそのまま引用する。\n(2) 児童ごとに、第4時に選んだ工夫が文章のどこで使われているかを示す。\n    見当たらない場合は「見当たらない」とだけ書く。\n(3) 本人が気づいていないかもしれない工夫（第4時に選んでいないのに使っているもの）を、\n    児童ごとに1つまで挙げる。\n(4) 使っている工夫の観点が重ならないように、4〜5人のグループの組み方を1案。\n\n条件：\n・直し方を書かない。\n・引用は、誤字があってもそのまま写す。"]}, {"title": "７ 第10時のあと：単元を通した学びの変化を整理する", "when": "単元終了後（研究のまとめ・報告の準備）", "prompts": ["ソース「第10時記録」は、6年生30人の、国語の単元を通した記録です。\n単元は「筆者の工夫をとらえて読み、それをいかして、日本文化のよさを伝える文章を書こう」。\n読む教材で見つけた「筆者の工夫」を選び（第4時）、構成の型を選び（第8時）、\n文章を書いて読み合い、振り返りました（第10時）。\n\n【やってほしいこと】\n(1) 児童ごとに、①で選んだ工夫を③で「使えた」と書いているかを、\n    「使えたと書いている／使えなかったと書いている／触れていない」の三つで分ける。\n(2) ④①で児童が「力がついた」と書いていることを、似たものどうし       ? ["g1", "g2", "g3"].map((x, j) => `<span class="${r[x] ? "y" : ""}">${"①②③"[j]}${r[x] ? md2(r[x]) : ""}</span>`).join("") + (r.pos ? `<span class="y">${esc(r.pos)}</span>` : "")
      : `<span class="${r.kan ? "y" : "r"}">関所${r.kan ? "○" : ""}</span>${r.kata ? `<span class="y">${KATA[r.kata - 1]}</span>` : ""}${r.re ? '<span class="y">選び直し</span>' : ""}`;
    return `<button class="seat ${r.star ? "star" : ""} ${sel === i ? "sel" : ""}" data-s="${i}"><span class="n">${i}<span>${r.star ? "★" : ""}</span></span><span class="g">${badges}</span><span class="m">${esc(r.memo || "")}</span></button>`;
  }).join("")}</div>
  <div class="card" style="margin-top:12px"><div class="row">
    <button id="expJ">記録を書き出す（バックアップ）</button><button id="expC">評価の記録をCSVで</button>
    <span class="sub">最後に書き出した日：${esc(S.lastSave || "まだ")}</span></div></div>`;
  $$("button[data-m]").forEach((b) => b.onclick = () => { mode = b.dataset.m; tool = "detail"; closeEditor(); vMitori(); });
  $$("button[data-tool]").forEach((b) => b.onclick = () => { tool = b.dataset.tool; closeEditor(); vMitori(); });
  $$("button[data-s]").forEach((b) => b.onclick = () => {
    const i = +b.dataset.s;
    if (tool === "detail") { sel = i; openEditor(); vMitori(); } else applyTool(i);
  });
  $("#expJ").onclick = backup; $("#expC").onclick = csv;
}
function openEditor() {
  const r = seat(sel);
  const tg = (k, label, cls = "") => `<button class="tg ${cls} ${r[k] ? "on" : ""}" data-tg="${k}">${label}${r[k] && /\d{4}-/.test(r[k]) ? " " + md2(r[k]) : ""}</button>`;
  $("#editorIn").innerHTML = `
    <div class="row" style="justify-content:space-between"><span class="big">${sel}</span>
      <div class="row"><button data-mv="-1">← 前の番号</button><button data-mv="1">次の番号 →</button><button class="pri" id="edClose">閉じる</button></div></div>
    <div class="row" style="margin:8px 0">${mode === "57"
      ? `${tg("g1", "関門①")}${tg("g2", "関門②")}${tg("g3", "関門③")}
         <span class="sub">今いるところ</span>${["A", "B", "C"].map((p) => `<button class="tg ${r.pos === p ? "on" : ""}" data-pos="${p}">${p}</button>`).join("")}`
      : `${tg("kan", "関所 通過")}
         <span class="sub">型</span>${KATA.map((k, j) => `<button class="tg ${r.kata === j + 1 ? "on" : ""}" data-kata="${j + 1}">${k}</button>`).join("")}
         ${tg("re", "選び直した")}`}
      ${tg("star", "★ 気になる", "star")}</div>
    <input type="text" id="edMemo" placeholder="ひとことメモ（名前は書かない）" value="${esc(r.memo || "")}" style="width:100%">`;
  $("#editor").classList.add("show");
  const E = $("#editorIn");
  const re = () => { save(); openEditor(); vMitori(); };
  $$("[data-tg]", E).forEach((b) => b.onclick = () => { const k = b.dataset.tg; r[k] = r[k] ? "" : (k.startsWith("g") ? today() : "1"); re(); });
  $$("[data-pos]", E).forEach((b) => b.onclick = () => { r.pos = r.pos === b.dataset.pos ? "" : b.dataset.pos; re(); });
  $$("[data-kata]", E).forEach((b) => b.onclick = () => { r.kata = r.kata === +b.dataset.kata ? 0 : +b.dataset.kata; re(); });
  $$("[data-mv]", E).forEach((b) => b.onclick = () => { sel = Math.min(S.set.n, Math.max(1, sel + +b.dataset.mv)); openEditor(); vMitori(); });
  $("#edMemo").onchange = (e) => { r.memo = e.target.value; save(); vMitori(); };
  $("#edClose").onclick = () => { closeEditor(); vMitori(); };
}
function closeEditor() { sel = null; $("#editor").classList.remove("show"); }
function backup() {
  S.lastSave = today(); save();
  download(`授業コックピット_記録_${today()}.json`, JSON.stringify(S, null, 1), "application/json");
  if (tab === "mitori") vMitori(); else if (tab === "set") vSet();
}
function csv() {
  const head = ["番号", "関門①", "関門②", "関門③", "今いるところ", "関所", "選んだ型", "選び直し", "★", "メモ"];
  const lines = [head.join(",")];
  for (let i = 1; i <= S.set.n; i++) {
    const r = S.seats[i] || {};
    lines.push([i, r.g1 || "", r.g2 || "", r.g3 || "", r.pos || "", r.kan ? "○" : "", r.kata ? KATA[r.kata - 1] : "", r.re ? "○" : "", r.star ? "★" : "", `"${(r.memo || "").replace(/"/g, '""')}"`].join(","));
  }
  download(`見取り_${today()}.csv`, "﻿" + lines.join("\n"), "text/csv");
}

/* ---------------- AIの下ごしらえ ---------------- */
let aiSel = 0, aiText = "", aiRes = "", aiT0 = null;
const NAMEPAT = /([一-龥ぁ-んァ-ヶ]{1,4}(?:さん|くん|君|ちゃん))|([0-9０-９]+\s*組)|(先生)/g;
function vAI() {
  const P = D.prompts[aiSel];
  $("#main").innerHTML = `
  <div class="sticky-tools"><select id="aiSel" style="width:100%">${D.prompts.map((p, i) => `<option value="${i}" ${i === aiSel ? "selected" : ""}>${esc(p.title)}</option>`).join("")}</select>
    ${P.when ? `<div class="sub" style="margin-top:4px">使う場面：${esc(P.when)}</div>` : ""}</div>
  <p class="sub">名前の対応表は入れません。児童の記述は、はじめから「児童12：〜」の形（出席番号）で書き起こしてください。ここに貼った記述は保存しません。</p>
  <div class="cols">
    <div class="card"><h2>1　記述を貼る</h2>
      <textarea id="aiIn" placeholder="児童1：〜&#10;児童2：〜">${esc(aiText)}</textarea>
      <div id="aiChk" style="margin-top:8px"></div>
      <button id="cpText" class="pri" style="width:100%;margin-top:8px">記述をコピー</button>
    </div>
    <div class="card"><h2>2　プロンプトをコピー</h2>
      ${P.prompts.map((t, j) => `<button class="pri" data-cp="${j}" style="width:100%;margin-bottom:6px">プロンプト ${j + 1} をコピー</button><details ${j === 0 ? "open" : ""}><summary>中身を見る</summary><div class="hl">${esc(t)}</div></details>`).join("")}
    </div>
  </div>
  <div class="card"><h2>3　AIの答えを貼る → 番号ごとに並べる</h2>
    <textarea id="aiRes" placeholder="AIの答えを貼りつけると、「児童12」などの番号ごとに拾い出します">${esc(aiRes)}</textarea>
    <div id="aiOut"></div>
  </div>
  <div class="card"><h2>準備にかかった時間（協議会用）</h2>
    <button id="aiGo" class="${aiT0 ? "" : "pri"}" style="min-width:240px">${aiT0 ? "おわり（記録する）" : "はかり始める"}</button> <span class="sub">${aiT0 ? "はかっています…" : ""}</span>
    <table class="tb" style="margin-top:8px"><tr><th>日付</th><th>場面</th><th>分</th><th></th></tr>${S.ailog.map((x, i) => `<tr><td>${esc(x.d)}</td><td>${esc(x.t)}</td><td>${x.m}</td><td><button class="sm" data-del="${i}">消す</button></td></tr>`).join("")}</table>
  </div>`;
  const check = () => {
    const t = $("#aiIn").value; aiText = t;
    const hits = [...t.matchAll(NAMEPAT)].map((m) => m[0]);
    $("#aiChk").innerHTML = !t.trim() ? "" : hits.length
      ? `<p style="color:var(--warn);font-weight:700">名前・学級名かもしれない語が ${hits.length} か所あります。直してからコピーしてください。</p><div class="hl">${esc(t).replace(NAMEPAT, (m) => `<mark>${m}</mark>`)}</div>`
      : `<p style="color:var(--ok);font-weight:700">「〜さん」「〜くん」「○組」などは見つかりませんでした。（名字だけの書きこみなどは、目でも確かめてください）</p>`;
  };
  $("#aiSel").onchange = (e) => { aiSel = +e.target.value; vAI(); };
  $("#aiIn").oninput = check; check();
  $("#cpText").onclick = () => copy($("#aiIn").value);
  $$("[data-cp]").forEach((b) => b.onclick = () => copy(P.prompts[+b.dataset.cp]));
  const group = () => {
    const t = $("#aiRes").value; aiRes = t;
    const map = {};
    t.split(/\n/).forEach((ln) => { [...ln.matchAll(/児童\s*([0-9０-９]+)/g)].forEach((m) => { const k = +m[1].replace(/[０-９]/g, (c) => "０１２３４５６７８９".indexOf(c)); (map[k] = map[k] || []).push(ln.trim()); }); });
    const ks = Object.keys(map).map(Number).sort((a, b) => a - b);
    $("#aiOut").innerHTML = ks.length ? `<table class="tb" style="margin-top:8px"><tr><th>番号</th><th>AIの答えのうち、その番号が出てくる行</th></tr>${ks.map((k) => `<tr><th>${k}</th><td>${map[k].map(esc).join("<br>")}</td></tr>`).join("")}</table>` : "";
  };
  $("#aiRes").oninput = group; group();
  $("#aiGo").onclick = () => {
    if (!aiT0) aiT0 = Date.now();
    else { S.ailog.push({ d: today(), t: P.title, m: Math.max(1, Math.round((Date.now() - aiT0) / 60000)) }); aiT0 = null; save(); }
    vAI();
  };
  $$("[data-del]").forEach((b) => b.onclick = () => { S.ailog.splice(+b.dataset.del, 1); save(); vAI(); });
}
function copy(t) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました")).catch(() => {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("コピーしました");
  });
}

/* ---------------- 進み具合 ---------------- */
const TOPICS = ["和食", "和楽器", "日本画", "伝統芸能", "和紙", "しめかざり", "和の技術", "茶道", "着物"];
function addSchoolDays(iso, k) {
  const d = new Date(iso + "T00:00:00"); let n = 0;
  while (n < k) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n++; }
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function vSusumi() {
  const days = S.kokai ? Math.ceil((new Date(S.kokai + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000) : null;
  const all = Object.values(D.prep).flatMap((e) => e.groups.flatMap((g) => g.items));
  const done = all.filter((it) => S.checks[it.id]).length;
  $("#main").innerHTML = `
  <div class="cols">
    <div class="card"><h2>公開日まで</h2>
      ${days === null ? '<p class="sub">公開日を入れてください（この iPad の中だけに保存されます）。</p>' : `<div class="big">${days >= 0 ? `あと ${days} 日` : "公開日は過ぎました"}</div>`}
      <div class="row" style="margin-top:8px"><label>公開日 <input type="date" id="kokai" value="${esc(S.kokai)}"></label></div>
      <p class="sub">準備物：${done} / ${all.length} 件 済み</p>
    </div>
    <div class="card"><h2>各時の予定日</h2>
      <div class="row"><label>第1時の日 <input type="date" id="d1" value="${esc(S.dates["1"] || "")}"></label><button id="fill">平日で第2時以降を埋める</button></div>
      <p class="sub">国語のない日や行事は、下で直してください。</p>
      <table class="tb">${LESSONS.map((n) => `<tr><th>${MARU[n]} ${esc(D.student_titles[studentId(n)] || "")}</th><td><input type="date" data-d="${n}" value="${esc(S.dates[n] || "")}" style="width:100%"></td></tr>`).join("")}</table>
    </div>
  </div>
  <div class="card"><h2>単元に入る前に</h2>${prepList("pre")}</div>
  <div class="card"><h2>情報カード 9題材：出典の書き入れ</h2>
    <p class="sub">本で現物をたしかめ、本の名前とページを書き入れたら印をつけます（<code>02_教師用/WS07_教師用情報カード.html</code>）。</p>
    <ul class="chk">${TOPICS.map((t) => `<li class="${S.cards[t] ? "done" : ""}"><label><input type="checkbox" data-card="${t}" ${S.cards[t] ? "checked" : ""}><span class="t">${t}</span></label></li>`).join("")}</ul>
  </div>`;
  $("#kokai").onchange = (e) => { S.kokai = e.target.value; save(); vSusumi(); };
  $("#d1").onchange = (e) => { S.dates["1"] = e.target.value; save(); vSusumi(); };
  $("#fill").onclick = () => { if (!S.dates["1"]) { toast("先に第1時の日を入れてください"); return; } LESSONS.slice(1).forEach((n, i) => (S.dates[n] = addSchoolDays(S.dates["1"], i + 1))); save(); vSusumi(); };
  $$("[data-d]").forEach((x) => x.onchange = () => { S.dates[x.dataset.d] = x.value; save(); });
  bindChecks(() => vSusumi());
  $$("[data-card]").forEach((c) => c.onchange = () => { S.cards[c.dataset.card] = c.checked; save(); vSusumi(); });
}

/* ---------------- 設定・保存 ---------------- */
function vSet() {
  $("#main").innerHTML = `
  <div class="card"><h2>児童用サイトのアドレス</h2>
    <p class="sub">「テレビに映す」で開くページです。</p>
    <input type="url" id="url" value="${esc(S.set.url)}" placeholder="https://○○.github.io/○○/" style="width:100%"></div>
  <div class="card"><h2>見取りの座席</h2>
    <div class="row"><label>人数 <input type="number" id="n" min="1" max="45" value="${S.set.n}" style="width:6em"></label>
    <label>1列のマス数 <input type="number" id="cols" min="3" max="10" value="${S.set.cols}" style="width:6em"></label></div>
    <p class="sub">マスは出席番号の順に並びます。</p></div>
  <div class="card"><h2>記録の保存</h2>
    <p>記録（見取り・チェック・予定日）は、<b>この iPad の Safari の中だけ</b>に保存されます。どこにも送られません。</p>
    <ul>
      <li>Safari の共有ボタン →「<b>ホーム画面に追加</b>」して、そこから開いてください。記録が消えにくくなります。</li>
      <li>毎時間の終わりに「書き出す」を押して、「ファイル」に保存しておいてください。</li>
    </ul>
    <div class="row"><button class="pri" id="bk">すべての記録を書き出す</button>
      <button id="rsBtn">書き出したファイルから戻す</button><input type="file" id="rs" accept="application/json,.json" style="display:none"></div>
    <p class="sub">最後に書き出した日：${esc(S.lastSave || "まだ")}</p>
    <details style="margin-top:12px"><summary>記録をすべて消す</summary><button id="wipe" style="border-color:var(--warn);color:var(--warn)">この iPad の記録をすべて消す</button></details>
  </div>`;
  $("#url").onchange = (e) => { S.set.url = e.target.value.trim(); save(); toast("保存しました"); };
  $("#n").onchange = (e) => { S.set.n = Math.max(1, Math.min(45, +e.target.value || 30)); save(); };
  $("#cols").onchange = (e) => { S.set.cols = Math.max(3, Math.min(10, +e.target.value || 6)); save(); };
  $("#bk").onclick = backup;
  $("#rsBtn").onclick = () => $("#rs").click();
  $("#rs").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then((t) => { const o = JSON.parse(t); if (!o || typeof o !== "object" || !("seats" in o)) throw 0; S = Object.assign(S, o); save(); toast("戻しました"); vSet(); })
      .catch(() => toast("このファイルは読みこめませんでした"));
  };
  $("#wipe").onclick = () => { if (confirm("この iPad の記録をすべて消します。よろしいですか。")) { S = { checks: {}, dates: {}, kokai: "", seats: {}, ailog: [], cards: {}, set: S.set, lastSave: "" }; save(); vSet(); } };
}

render();
</script>
</body>
</html>
