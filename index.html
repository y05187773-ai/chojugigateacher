<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="授業コックピット">
<title>授業コックピット</title>
<style>
/* 案B「授業中モード型」（設計メモ/教師用コックピット_レイアウト案/）。色は児童用サイトとそろえる */
:root {
  --bg: #eceff1; --card: #fff; --ink: #23272b; --sub: #59616a; --line: #d4dade;
  --c1: #2f6fb5; --c1s: #e6effa;   /* ①〜④ 読んで見つける */
  --c2: #2e8b57; --c2s: #e3f3ea;   /* ⑤〜⑧ 材料を集める */
  --c3: #d9822b; --c3s: #fdf0e1;   /* ⑨⑩ 書いて伝える */
  --c1d: #235a97; --c2d: #226b44; --c3d: #a45a14;   /* 淡い地の上の文字・濃い塗り */
  --accent: var(--c1); --accent-soft: var(--c1s); --warn: #b3261e; --warn-soft: #fde8e6;
  --ok: var(--c2); --ok-soft: var(--c2s); --mark: #fff4b8;
  --pc: var(--c1); --ps: var(--c1s); --pd: var(--c1d);   /* いま選んでいる時間の色 */
  --top: 80px; --nav: 66px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; font-size: 17px; line-height: 1.65; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; min-height: 48px; user-select: none; -webkit-user-select: none; }
button:active { transform: scale(.98); }
button.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
button.sm { min-height: 40px; padding: 4px 12px; font-size: 15px; }
input[type=text], input[type=date], input[type=number], input[type=url], input[type=search], textarea, select { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; background: #fff; min-height: 48px; }
textarea { width: 100%; min-height: 140px; }

/* 上の帯：すごろく（押すと時間を切りかえる） */
header { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: #fff; border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); }
.hd { height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 14px; max-width: 1280px; margin: 0 auto; }
.hd > b { font-size: 14px; line-height: 1.3; color: var(--sub); white-space: nowrap; }
.board { flex: 1; min-width: 0; display: flex; justify-content: center; overflow-x: auto; padding-top: 6px; scrollbar-width: none; }
.board::-webkit-scrollbar { display: none; }
.sq { flex: 0 0 auto; width: 74px; display: flex; flex-direction: column; align-items: center; position: relative; border: 0; background: none; padding: 0; min-height: 0; border-radius: 0; }
.sq::before { content: ""; position: absolute; top: 17px; left: -37px; width: 74px; height: 4px; background: #cfd5da; }
.sq:first-child::before { display: none; }
.sq .n { width: 38px; height: 38px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; background: var(--q); }
.sq .w { font-size: 11px; color: var(--sub); line-height: 1.3; margin-top: 2px; white-space: nowrap; }
.sq.today .w { color: var(--ink); font-weight: 700; }
.sq.today .w::before { content: "● "; color: var(--warn); }
.sq.on .n { width: 44px; height: 44px; margin-top: -3px; font-size: 19px; box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--q); }
.sq.on .w { color: var(--ink); font-weight: 700; margin-top: 5px; }
.q1 { --q: var(--c1); } .q2 { --q: var(--c2); } .q3 { --q: var(--c3); }
.modesw { display: flex; background: #e4e8eb; border-radius: 999px; padding: 3px; flex: 0 0 auto; }
.modesw button { border: 0; background: none; min-height: 40px; border-radius: 999px; padding: 2px 16px; font-weight: 700; color: var(--sub); }
.modesw button.on { background: var(--pc); color: #fff; }
.hd .mini { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; padding: 2px 10px; border-radius: 8px; background: #eee; display: none; }
.hd .mini.run { display: block; background: var(--pc); color: #fff; }
.hd .mini.hit { background: var(--warn); color: #fff; }

/* 下のタブ：親指で押す */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { display: grid; grid-template-columns: repeat(7, 1fr); max-width: 1280px; margin: 0 auto; height: var(--nav); }
nav.tabs button { border: 0; border-radius: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--sub); min-height: var(--nav); padding: 4px 2px; }
nav.tabs button .ic { line-height: 0; }
nav.tabs button .ic svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.on { color: var(--pc); font-weight: 700; box-shadow: inset 0 4px 0 var(--pc); }

main { max-width: 1280px; margin: 0 auto; padding: calc(var(--top) + env(safe-area-inset-top) + 12px) 14px calc(var(--nav) + env(safe-area-inset-bottom) + 24px); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 12px; }
h2 { font-size: 18px; margin: 0 0 8px; }
h3 { font-size: 16px; margin: 12px 0 4px; color: var(--accent); }
.sub { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* 今日の授業（授業中）：上＝時計と45分の帯／めあて／左＝いまの場面・右＝止まった子へ */
.tl { display: grid; grid-template-columns: 210px minmax(0, 1fr) 170px; gap: 16px; align-items: center; background: #fff; border-radius: 16px; padding: 10px 14px; }
.clock { font-family: "BIZ UDGothic", "BIZ UDPGothic", "Hiragino Sans", sans-serif; letter-spacing: -.02em; font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.nx { font-size: 14px; color: var(--sub); min-height: 1.5em; margin-top: 4px; }
.nx b { color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
.line { position: relative; height: 96px; }
.line .sc { position: absolute; top: 18px; height: 58px; border: 0; border-radius: 0; min-height: 0; padding: 0 4px; font-size: 12.5px; font-weight: 700; line-height: 1.2; text-align: left; color: var(--pd); background: var(--ps); border-right: 2px solid #fff; overflow: hidden; display: flex; align-items: center; }
.line .sc span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.line .sc.mk { background: var(--pd); color: #fff; }
.line .sc.gap { font-weight: 400; }
.line .sc.cur { outline: 3px solid var(--ink); outline-offset: -3px; z-index: 1; }
.line .sc.sel { outline: 3px dashed var(--ink); outline-offset: -3px; z-index: 1; }
.line .sc:first-of-type { border-radius: 8px 0 0 8px; }
.line .sc.last { border-radius: 0 8px 8px 0; border-right: 0; }
.line .past { position: absolute; top: 18px; left: 0; width: 0; height: 58px; background: rgba(35, 39, 43, .16); border-radius: 8px 0 0 8px; z-index: 2; pointer-events: none; }
.line .pt { position: absolute; top: 2px; width: 3px; height: 74px; background: var(--warn); z-index: 3; pointer-events: none; }
.line .pt b { position: absolute; top: -3px; left: 5px; font-size: 13px; line-height: 1.2; color: var(--warn); background: #fff; padding: 0 2px; font-variant-numeric: tabular-nums; }
.line .tk { position: absolute; top: 80px; font-size: 11px; line-height: 1.2; color: var(--sub); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.line .tk::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 4px; background: var(--sub); }
.line .tk.t0 { transform: none; } .line .tk.t0::before { left: 0; }
.line .tk.t45 { transform: translateX(-100%); } .line .tk.t45::before { left: auto; right: 0; }
.line .now { position: absolute; top: 12px; width: 4px; height: 70px; background: var(--ink); border-radius: 2px; z-index: 4; pointer-events: none; }
.go { width: 100%; min-height: 64px; font-size: 22px; font-weight: 700; border-radius: 14px; background: var(--pc); border-color: var(--pc); color: #fff; }
.go.run { background: #fff; color: var(--pc); border: 3px solid var(--pc); }
.tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.tbtns button { min-height: 40px; padding: 2px 4px; font-size: 13px; font-weight: 700; }
.tbtns button.arm { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.alert { background: var(--warn-soft); border: 3px solid var(--warn); border-radius: 12px; padding: 8px 14px; font-size: 19px; font-weight: 700; margin-top: 10px; display: none; }
.alert.show { display: block; animation: blink 1s ease-in-out 3; }
@keyframes blink { 50% { background: #fff; } }
.meate { font-size: 19px; font-weight: 700; background: var(--ps); border-left: 8px solid var(--pc); border-radius: 12px; padding: 6px 14px; margin: 10px 0; line-height: 1.5; }
.meate small { font-size: 12px; font-weight: 700; color: var(--pc); margin-right: 8px; }
.jg { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.nowc { background: #fff; border: 3px solid var(--pc); border-radius: 18px; padding: 12px 16px; }
.nowc.pre { border-style: dashed; }
.nowc .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nowc .h b { font-size: 22px; color: var(--pc); line-height: 1.4; }
.nowc .h span { font-size: 14px; color: var(--sub); white-space: nowrap; }
.nowc .do { font-size: 18px; margin-top: 6px; }
.say { background: var(--mark); border-radius: 12px; padding: 8px 12px; font-size: 19px; margin-top: 8px; }
.say small { display: block; font-size: 12px; font-weight: 700; color: #9a6b00; }
.nowc .nxt { border-top: 2px dashed var(--line); margin-top: 10px; padding-top: 6px; color: var(--sub); font-size: 15px; }
.nowc .nxt b { color: var(--ink); }
.nowc .back { margin-top: 8px; min-height: 40px; font-size: 14px; font-weight: 700; }
.help { background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--warn); border-radius: 14px; padding: 10px 14px 12px; }
.help h2 { color: var(--warn); font-size: 17px; }
.help h3 { color: var(--sub); font-size: 13px; margin: 12px 0 2px; }
.help details { border-bottom: 1px solid var(--line); }
.help details > summary { list-style: none; padding: 8px 4px; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; }
.help details > summary::-webkit-details-marker { display: none; }
.help details > summary::after { content: "›"; font-size: 20px; color: var(--sub); }
.help details[open] > summary { color: var(--warn); }
.help details[open] > summary::after { content: "⌄"; color: var(--warn); }
.help details .a { padding: 8px 12px 10px; margin-bottom: 8px; background: var(--warn-soft); border-radius: 10px; font-size: 16px; }
.help .yo { font-size: 15px; }

.seg-ctl { position: sticky; top: calc(var(--top) + env(safe-area-inset-top) + 12px); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; background: var(--bg); padding: 2px 0; }
.seg-ctl button { background: #fff; border: 2px solid var(--line); min-height: 52px; font-weight: 700; color: var(--sub); border-radius: 12px; padding: 4px; line-height: 1.25; }
.seg-ctl button small { display: block; font-weight: 400; font-size: 12px; }
.seg-ctl button.on { border-color: var(--pc); background: var(--ps); color: var(--pc); }
table.flow td.t { white-space: nowrap; font-weight: 700; font-variant-numeric: tabular-nums; width: 4.5em; }
table.flow tr.mk td { background: #fffbe6; }
table.flow .say { font-size: 15px; padding: 4px 10px; margin-top: 4px; }
.kv { display: grid; grid-template-columns: 7.5em 1fr; border-top: 1px solid var(--line); }
.kv > div { padding: 10px 6px; border-bottom: 1px solid var(--line); }
.kv > div:nth-child(odd) { font-weight: 700; color: var(--accent); }
.tsel { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.tsel button { text-align: left; min-height: 64px; font-weight: 700; line-height: 1.4; }
.tsel button.on { border: 3px solid var(--warn); background: var(--warn-soft); }
.tans { background: #fff; border: 3px solid var(--warn); border-radius: 14px; padding: 14px 16px; font-size: 19px; margin-bottom: 12px; }
.tans .q { font-size: 14px; color: var(--warn); font-weight: 700; }
table.tb { width: 100%; border-collapse: collapse; font-size: 15px; }
table.tb th, table.tb td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
table.tb th { background: #eef1f3; }
ul.chk { list-style: none; margin: 0; padding: 0; }
ul.chk li { border-bottom: 1px dashed var(--line); }
ul.chk label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 4px; min-height: 52px; cursor: pointer; }
ul.chk input { width: 26px; height: 26px; margin-top: 1px; flex: 0 0 auto; accent-color: var(--ok); }
ul.chk li.done .t { color: var(--sub); text-decoration: line-through; }
.tag { display: inline-block; font-size: 12px; border-radius: 4px; padding: 0 6px; margin-right: 6px; border: 1px solid var(--line); background: #f6f6f6; }
code { font-size: 13px; background: #eef1f3; border-radius: 4px; padding: 0 4px; word-break: break-all; }
details > summary { cursor: pointer; font-weight: 700; padding: 10px 0; min-height: 44px; }

/* 根拠 */
.sticky-tools { position: sticky; top: calc(var(--top) + env(safe-area-inset-top)); z-index: 5; background: var(--bg); padding: 8px 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
.chips button { flex: 0 0 auto; border-radius: 999px; }
.chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.kcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.kc { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.kc .pl { font-size: 22px; font-weight: 700; }
.kc .pl span { font-size: 16px; }
.kc .kw { font-size: 18px; }
.kc .meta { font-size: 13px; color: var(--sub); }

/* 見取り */
.tools { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
.tools button { flex: 0 0 auto; min-width: 72px; font-weight: 700; }
.tools button.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.tools button.detail.on { background: var(--accent); border-color: var(--accent); }
.seats { display: grid; gap: 6px; }
.seat { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 8px; min-height: 84px; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.seat .n { font-weight: 700; font-size: 20px; display: flex; justify-content: space-between; }
.seat .g { display: flex; gap: 3px; flex-wrap: wrap; }
.seat .g span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: #aaa; }
.seat .g span.y { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.seat .g span.r { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.seat .m { font-size: 12px; color: var(--sub); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.seat.sel { border: 3px solid var(--accent); }
.seat.star { background: #fffbe0; }
.seat.flash { animation: fl .5s; }
@keyframes fl { 0% { background: var(--ok-soft); } }
.editor { position: fixed; left: 0; right: 0; bottom: calc(var(--nav) + env(safe-area-inset-bottom)); background: #fff; border-top: 3px solid var(--accent); padding: 12px 16px; box-shadow: 0 -6px 20px rgba(0,0,0,.12); z-index: 25; display: none; }
.editor.show { display: block; }
.editor .in { max-width: 1280px; margin: 0 auto; }
.editor button { min-height: 56px; min-width: 64px; }
.tg { border: 2px solid var(--line); font-weight: 700; }
.tg.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.tg.star.on { background: #e0a800; border-color: #e0a800; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 12px; margin: 2px; border: 1px solid var(--line); background: #fff; }
.pill.w { border-color: var(--warn); color: var(--warn); }
mark { background: var(--mark); outline: 2px solid #e0a800; }
.hl { white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 300px; overflow: auto; }
.big { font-size: 34px; font-weight: 700; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + env(safe-area-inset-bottom) + 16px); transform: translateX(-50%); background: #1d1d1d; color: #fff; padding: 8px 8px 8px 18px; border-radius: 999px; z-index: 99; display: flex; gap: 10px; align-items: center; white-space: nowrap; }
.toast button { min-height: 40px; background: #444; color: #fff; border: 0; border-radius: 999px; }

/* ホーム：いまの時間（最後に開いた時間）を大きく。日付は使わない */
.home-now { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: center; background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--pc); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; }
.hn-l { display: flex; gap: 18px; align-items: flex-start; min-width: 0; }
.hn-n { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; background: var(--pc); color: #fff; font-size: 44px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.hn-k { font-size: 13px; font-weight: 700; color: var(--pd); }
.home-now h1 { font-size: 28px; line-height: 1.3; margin: 0 0 8px; }
.hn-m { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.5; background: var(--ps); border-left: 6px solid var(--pc); border-radius: 10px; padding: 6px 12px; }
.hn-b { display: grid; gap: 8px; }
.hn-b #hPrep { min-height: 64px; font-weight: 700; }
.hn-b small, .hrow small { display: block; font-size: 13px; font-weight: 400; color: var(--sub); }
.hrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.hrow:last-child { border-bottom: 0; }
.hrow button { flex: 1; font-weight: 700; text-align: left; }
.hkids { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.hkids .pill { margin: 0; font-size: 20px; font-weight: 700; min-width: 2.4em; text-align: center; }
.hgoal { color: var(--sub); font-size: 15px; margin: 4px 4px 0; }
.hgoal b { color: var(--ink); margin-right: 10px; }

@media (max-width: 1000px) {
  .hd > b { display: none; }
  .sq { width: 60px; }
  .sq::before { left: -30px; width: 60px; }
}
@media (max-width: 900px) {
  .home-now { grid-template-columns: 1fr; }
  .tl { grid-template-columns: 1fr 160px; }
  .tl .line { grid-column: 1 / -1; grid-row: 2; }
  .jg { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .hn-n { width: 56px; height: 56px; font-size: 28px; }
  .home-now h1 { font-size: 22px; }
  .sq .w { display: none; }
  .sq { width: 40px; }
  .sq::before { left: -20px; width: 40px; }
  nav.tabs button { font-size: 11px; }
  .seg-ctl button small { display: none; }
}
</style>
</head>
<body>
<header><div class="hd"><b>授業<br>コックピット</b><nav class="board" id="board" aria-label="時間の切りかえ"></nav><div class="modesw" id="modesw"></div><span class="mini" id="hdClock"></span></div></header>
<main id="main"></main>
<div class="editor" id="editor"><div class="in" id="editorIn"></div></div>
<nav class="tabs" id="tabs"><div class="in" id="tabsIn"></div></nav>
<script>
const D = {"lessons": {"1": {"title": "一次（第1時）　学習の見通しをもつ", "ids": ["1"], "rows": [["めあて", "学習のゴールをたしかめ、ゴールまでの見通しをもとう。"], ["主な学習活動", "①p.155の扉と『鳥獣戯画』の絵を見て、知っていること・気づいたことを出し合う。<br>②「『鳥獣戯画』を読む」を通読する。<br>③p.155の「筆者は、『鳥獣戯画』をどう読み、それをどのように伝えているでしょう」という問いと、単元の目標「筆者の工夫をとらえて読み、それをいかして書こう」を確かめる。<br>④「発見、日本文化のみりょく」（p.166〜169）にも目を通し、<b>単元のゴール＝自分が選んだ日本文化のよさを、保護者・地域の人に伝える文章を書き、授業参観で廊下に掲示すること<\/b>をつかむ。<br>⑤<b>ロードマップ（WS00）を読み、ゴールまでの見通しをもつ。<\/b> 「⑨で書く前に⑤〜⑦で何をそろえるか」「④でえらんだ工夫をどこで使うか」「自分で進め方を決めるのはどこか」をロードマップから読み取り、いちばんがんばりたい時間とそのわけを書く（WS01）。<br>⑥ふりかえりをロードマップの①に書く。"], ["交流", "①ペアで、絵を見て気づいたことを出し合う。<br><b>交流後に変わること<\/b>：一人では「動物が相撲している」で止まっていた見方が、「兎が笑っている」「絵なのに動いて見える」など<b>細部への気づき<\/b>に広がる。<br>②ペアで、いちばんがんばりたい時間とそのわけを伝え合う。<br><b>交流後に変わること<\/b>：友達のわけを聞いて、自分が見落としていた時間（⑧で説明する、⑤〜⑦で2冊を照らし合わせる など）に気づき、書き足す。"], ["手だて", "○絵を大きく提示し、指さしながら話せるようにする。<br>○通読の前に範読を聞かせ、<b>読むことに困難のある児童も内容の見通しをもてる<\/b>ようにする。以降の時間も範読音声を手元で聞けるようにしておく。<br>○学習計画は白紙から立てさせない。10時間の流れは<b>ロードマップとして教師が示し<\/b>、児童はそれを<b>読み取る問い<\/b>に答えることで見通しをもつ。問いの答えはロードマップに書いてあるので、読むことに困難のある児童も手が止まらない。<br>○<b>読んでもらう相手（保護者・地域の人）と場（授業参観の廊下掲示）を第1時に示す。<\/b> 10時間の目的意識をここで持たせる。"], ["ICT・AI", "―"], ["評価", "⑥学習のゴールを確かめ、見通しをもとうとしている。〈発言・行動観察〉"]], "notes": []}, "2": {"title": "二次（第2時）　絵と文章を照らし合わせて読む", "ids": ["2"], "rows": [["めあて", "絵と文章を照らし合わせて、筆者が絵のどこを取り上げているかをたしかめよう。"], ["主な学習活動", "①p.156〜162を音読する。<br>②本文の一文一文が、<b>絵のどの部分<\/b>について書かれたものかを、絵に番号や線で書き込みながら確かめる。<br>　・p.156「蛙が外掛け、…」→ 相撲の場面のどこか<br>　・p.158 11〜14行目「蛙の口から線…」→ その線を絵で指す<br>　・p.159 4〜6行目「もんどりうっ…」→ 該当箇所を指す<br>③<b>絵巻物は右から左へ時間が流れる<\/b>ことを、p.158 6〜10行目とp.160 1〜11行目から読み取り、絵で確かめる。<br>④p.158 7〜8行目「本当はつなが…」に着目し、<b>筆者が絵の見せ方を工夫している<\/b>ことに気づく。"], ["交流", "ペアで「この文は、絵のどこのこと？」と指さしで確かめ合う。<br><b>交流後に変わること<\/b>：文章を読むだけでは像を結ばなかった児童も、<b>相手の指さしによって本文と絵が結びつく<\/b>。以降の学習の土台になる。"], ["手だて", "○教科書 p.156〜158 の絵を撮影して<b>ロイロで配り<\/b>、iPadのペンで<b>直接書き込める<\/b>ようにする（提出箱に出させ、単元を通して見返す）。<br>○読むことに困難のある児童には、<b>扱う一文を教師が指定<\/b>する（全文でなく3か所）。<br>○p.157 13行目「ためしに、ぱ…」は、実際に全員でめくらせ、動いて見える体験をさせる。"], ["ICT・AI", "○絵を大型テレビに拡大提示し、教師が指さす。<br>○範読音声を手元で聞けるようにする。"], ["評価", "③絵と文章を照らし合わせ、筆者が何を取り上げ、何に着目しているかを叙述を基に捉えている。〈ワークシート〉"]], "notes": []}, "3": {"title": "二次（第3時）　筆者の評価と工夫を書き出す", "ids": ["3"], "rows": [["めあて", "筆者が『鳥獣戯画』をどう評価しているかを見つけ、それを伝えるための工夫を書き出そう。"], ["主な学習活動", "①筆者が「<b>絵<\/b>」と「<b>絵巻物<\/b>」の二つについて評価を述べていることを確かめる（p.164下段）。<br>②<b>筆者の評価が分かる表現<\/b>を本文から探し、線を引く。<br>　・絵について：p.156「のびのびと見…」／p.159 9〜10行目「見事にそれを…」<br>　・絵巻物について：p.161 11〜14行目「日本文化の大…」／p.162「国宝であるだ…」<br>③p.164〜165の観点例を基に、<b>3つの観点<\/b>で筆者の工夫を書き出す。<br>　<b>論の展開<\/b>（例：絵巻物の説明に漫画やアニメを出した理由／同じ絵を2度示した理由）<br>　<b>表現の工夫<\/b>（例：文末を「―だ。」とせず「返し技。」「かわづ掛け。」とする／「ためしに、ぱ…」と読者に呼びかける）<br>　<b>絵の示し方<\/b>（例：つながっている絵をわざと切りはなしてページを分けて示した）"], ["交流", "グループで、見つけた表現を出し合い、<b>3つの観点のどれに当たるかを分けていく<\/b>。<br><b>交流後に変わること<\/b>：一人では1〜2個しか見つけられなかった児童も、<b>学級全体としてどんな工夫があるかの見取り図<\/b>をもてる。次時に「選ぶ」ための材料がそろう。"], ["手だて", "○3観点を<b>掲示物<\/b>にして教室前方に貼り、以後の時間も常に見えるようにする。<br>○観点ごとに<b>教師が一例ずつ実演<\/b>してから作業に入る。「見つけ方」を見せる。<br>○書き出しは<b>ふせん1枚に1つ<\/b>とし、量を求めない。1つでも書けたら次に進んでよいと伝える。<br>○本文のどこを探せばよいか分からない児童には、<b>探す範囲を1ページに限定<\/b>して渡す。"], ["ICT・AI", "○〈<b>授業後・教員<\/b>〉児童が書き出した工夫を<b>氏名を外して<\/b>AIに入力し、3観点に分類・整理させる。教員が本文と突き合わせて確認・修正し、<b>第4時の導入で配る「学級の工夫マップ」<\/b>をつくる。"], ["評価", "①比喩や反復などの表現の工夫に気づいている。〈ワークシート〉"]], "notes": []}, "4": {"title": "二次（第4時）　使いたい工夫を選ぶ　※本時の思考の型をつくる時間", "ids": ["4"], "rows": [["めあて", "自分が書くときに使いたい筆者の工夫をえらび、なぜ効果的なのかを本文の言葉で説明しよう。"], ["主な学習活動", "①「学級の工夫マップ」を手元（ロイロ）で見て、前時の自分の書き出しを見返す。<br>②工夫を一つ選び、カードに書く。①どんな工夫か　②<b>教科書 p.○ ○行目の「　　」という言葉<\/b>　③読む人にどんな効果があるか。<br>③カードを写真に撮って提出箱へ出し、<b>全員の考えを一覧で見比べる<\/b>。<br>④グループ（5人）で報告し合い、聞き手は「<b>それは本文のどこから言えるの？<\/b>」と問い返す。<br>⑤交流後、自分のカードに<b>赤ペン<\/b>で書き足す・書き換える。<br>⑥ふりかえり：この工夫を、自分の文章の<b>どこで<\/b>使いたいか。"], ["交流", "グループでの報告と問い返し。<br><b>交流後に変わること<\/b>：「なんとなく面白い」で選んでいた児童が、<b>本文の言葉に支えられた理由<\/b>をもつようになる。友達が挙げた別の観点の工夫を知り、自分の選択を<b>変える／付け足す<\/b>。その跡が赤ペンで残る。"], ["手だて", "○読み返す範囲を<b>全文にしない<\/b>。前時に自分が貼ったふせんの1〜2か所だけでよい。<br>○3つに絞った<b>「おすすめカード」<\/b>を机上に置き、選べるようにする。<br>○「読む人が〜」で始まる<b>書き出しの型<\/b>を配る。<br>○カードは<b>枠のみ・短文でよい<\/b>ことを明示する。"], ["ICT・AI", "○ロイロ：工夫マップの手元配布、カードの提出と一覧比較。<br>○AI：前時終了後に教員が使用済み（授業中は使わない）。"], ["評価", "④目的に応じて必要な情報を見つけ、論の進め方について考えている。〈ワークシート・発言〉<br>⑥友達の考えを聞いて自分の考えを見直そうとしている。〈行動観察・ワークシートの更新〉"]], "notes": ["<b>この時間の位置づけ<\/b>　本時（第8時）と<b>同じ思考の型<\/b>（選ぶ → 根拠を言う → 交流して更新する）を、ここで一度経験させておく。本時で児童が迷わず動けるかどうかは、この時間にかかっている。"]}, "5": {"title": "二次〜三次（第5〜7時）　自由進度ブロック「材料をそろえる」3時間", "ids": ["5", "6", "7"], "rows": [["ブロックのめあて（3時間を通して掲示）", "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。"], ["毎時のめあて", "児童が自分で立てる。板書には「今日のゴール（どの関門まで進むか）」を書く欄をつくる。"], ["主な学習活動", "<b>〈第5時のはじめ10分・全員〉<\/b>①学習の手引き（3時間分）を読み合わせ、<b>3つの関門<\/b>とやることA〜Cを確かめる。②進め方のきまりを確認する（後述）。<br><b>〈以降・自由進度〉<\/b>児童はA〜Cを自分の順序と時間で進める。<br>　<b>A 本を読む<\/b>……日本文化について書かれた本を読み、<b>初めて知ったこと<\/b>と<b>説明のしかた・資料の使い方の工夫<\/b>を書き留める（p.165下段の例）。何冊読むか、どの本か、教室か図書館かを選ぶ。<br>　<b>B 題材を決める<\/b>……p.166を読み、書く日本文化と「<b>いちばん伝えたいみりょく<\/b>」を決める。p.168〜169の高橋さんの作例を通して読み、完成のイメージをもつ。<br>　<b>C 情報を集めて整理する<\/b>……p.311「図を使って考えよう」を参考に、集めた情報を図や表に整理する（p.167の和食の例＝話題の提示／具体例①〜④／まとめ）。<b>同じことがらを2冊以上で照らし合わせ、食い違う場合はいつ・誰が書いたかを見て判断し、確かめられないことは書かない。<\/b><br><b>〈第7時の終わり15分・全員〉<\/b>p.167の5つの型を短冊で確かめ、<b>高橋さんの文章（p.168〜169）がどの型か<\/b>を全員で一つだけ確かめる（4分）→ WS07の５を見て、６で<b>自分の型を仮に選び、理由を書く<\/b>（5分）→ グループ（5人）で５と６を言い合い、聞き手は「<b>その型で、いちばん伝えたいことが伝わる？<\/b>」と問い返す（5分）→ 変えたら赤ペン（1分）。<br><b>〈各時のはじめ5分〉<\/b>今日どこまで進めるかを決め、<b>ロードマップ（WS00）<\/b>で確かめる。<br><b>〈各時の終わり5分〉<\/b>ロードマップに今日進んだところの印をつけ、次の時間の見通しを書く。"], ["3つの関門（全員が必ず通る／印は教師が押す）", "<b>関門①<\/b>　読んだ本から「<b>自分が書くときに使えそうな説明の工夫<\/b>」を1つ書けた。〈WS05を使う〉<br><b>関門②<\/b>　<b>題材<\/b>と「<b>いちばん伝えたいみりょく<\/b>」が、一言で言える。〈WS06を使う〉<br><b>関門③<\/b>　同じことがらを<b>2つの出典で確かめ、出典（書名・ページ）を書いた<\/b>。〈WS07を使う〉<br>※印は教師が押す。これは進度管理のためではなく、<b>3時間のうちに全員と必ず1回は個別に話すための仕組み<\/b>である。"], ["交流", "①<b>常設の「相談テーブル」<\/b>……題材を決めかねている児童、同じ・近い題材の児童が、いつでも集まって話せる場を教室の一角に置く。<br>②<b>必修（第6時の終わり10分）<\/b>……<b>関門②を通った児童から順にペアをつくり<\/b>、「自分の題材と、いちばん伝えたいみりょく」を言い合う。通っていない児童は、この時間に教師と一緒に決める。<br>③<b>第7時の終わり15分（全員）<\/b>……グループで「いちばん伝えたいみりょく」と「仮に選んだ型」を言い合い、問い返し合う（本時の関所の予行）。<br><b>交流後に変わること<\/b>：②では、漠然と題材だけ決めていた児童が「<b>そのどこがよいのか<\/b>」を言葉にし始める。③では、「なんとなくこの型」で選んだ児童が、問い返しを受けて理由を言い直す／型を選び直す。その跡がWS07に赤ペンで残る（第8時への橋渡し）。"], ["手だて", "○<b>「困ったときのメニュー」を学習の手引きに最初から印刷しておく。<\/b> 途中で教師が渡すのではなく、初めから選べる形にする。——「先生のおすすめ」の本5冊／<b>教師が用意した情報カード<\/b>（題材ごとに事実を3〜4枚に整理したもの）／図の型の見本／範読音声／同じ題材の友達の一覧。<br>○<b>教師は座席表を持って、3時間を通して個別支援に回る。<\/b> とくに<b>第6時の終わりまでに関門②を通っていない児童<\/b>に集中する。<br>○読むことに困難のある児童には、<b>写真とキャプションが中心の本<\/b>を勧める。関門①は「資料の使い方」の観点で十分通れる。<br>○2冊目が見つからない児童のために、<b>対になる本<\/b>を教師が用意しておく。<br>○情報が集まりすぎて選べない児童には、「<b>読む人がいちばんおどろくのはどれか<\/b>」と問い、絞る観点を与える。<br>○早く進んだ児童には、3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる、のいずれかを勧める。<br>○<b>進度は自由だが、関門は飛ばさない。<\/b> 順序を選べること＝やらなくてよいことではない、と初めに確認する。<br>○事前に司書と連携し、<b>日本文化の本を学級分そろえて教室に置く<\/b>（第1時から読める状態にしておく）。図書館の時間が動いてもこのブロックが吸収できる。"], ["ICT・AI", "○ロイロ：見つけた工夫を共有し、第4時の「学級の工夫マップ」に追加していく。<br>○本の該当ページを撮影して手元に保存する（<b>出典も一緒に写す<\/b>）。<br>○児童は生成AIを使わない。<b>本と本を照らし合わせる<\/b>ことで、情報を鵜呑みにしない態度を育てる（研究主題③）。<br>○〈<b>教員・第7時終了後<\/b>〉児童の「題材」「いちばん伝えたいみりょく」「仮に選んだ型」を<b>氏名を外して<\/b>入力し一覧に整理させる。教員が確認したうえで、<b>どの児童が型を選び直しそうか<\/b>を見立て、<b>本時の個別支援の順路と意図的指名<\/b>を決める。"], ["評価", "②読書が自分の考えを広げることに役立つことに気づいている。〈発言・行動観察〉<br>④目的に応じて必要な情報を見つけている。〈ワークシート〉<br>⑥<b>自分で学習の計画を立て、進み方を調整しながら<\/b>、見通しをもって書こうとしている。〈ロードマップ・行動観察〉"]], "notes": ["<b>このブロックの扱い<\/b>　第5時は二次、第6・7時は三次だが、児童の活動（本を読む → 題材を決める → 情報を集める）は連続しているため、<b>3時間を一つのまとまりとして児童に渡し、順序と時間配分を児童が決める<\/b>。ここを自由進度にする理由は二つ。①この3時間はもともと読む本も題材も集める情報も児童ごとに違い、一斉で進める必然性が薄い。②<b>教師が3時間まるごと個別支援に回れる<\/b>ため、第8時公開の最大の前提（全員が材料をもって本時に臨む）を確実にできる。", "<b>このブロックが第8時公開の前提になる<\/b>　第8時の最大のリスクは、<b>材料が乏しい児童が本時で何もできないこと<\/b>。関門③まで通った児童＝材料をもっている児童であり、<b>残りは教師の座席表で分かる<\/b>。第7時の終わりに関門③まで届いていない児童には、その場で教師が一緒に情報を見て絞るか、<b>情報カードを渡す。本時に空手で臨む児童をゼロにする。<\/b>"]}, "6": {"title": "二次〜三次（第5〜7時）　自由進度ブロック「材料をそろえる」3時間", "ids": ["5", "6", "7"], "rows": [["ブロックのめあて（3時間を通して掲示）", "自分の計画で学習を進め、いちばん伝えたいみりょくと、その材料をそろえよう。"], ["毎時のめあて", "児童が自分で立てる。板書には「今日のゴール（どの関門まで進むか）」を書く欄をつくる。"], ["主な学習活動", "<b>〈第5時のはじめ10分・全員〉<\/b>①学習の手引き（3時間分）を読み合わせ、<b>3つの関門<\/b>とやることA〜Cを確かめる。②進め方のきまりを確認する（後述）。<br><b>〈以降・自由進度〉<\/b>児童はA〜Cを自分の順序と時間で進める。<br>　<b>A 本を読む<\/b>……日本文化について書かれた本を読み、<b>初めて知ったこと<\/b>と<b>説明のしかた・資料の使い方の工夫<\/b>を書き留める（p.16 成メモの更新〉"]], "notes": []}, "9": {"title": "三次（第9時）　文章を書く　※実態により2時間扱いも可", "ids": ["9"], "rows": [["めあて", "筆者の工夫を使って、えらんだ日本文化のよさが伝わる文章を書こう。"], ["主な学習活動", "①p.168の高橋さんの作例をもう一度読み、<b>どんな工夫をしているか<\/b>を見つける（p.169「よさを伝えるときの言葉」＝「いちばん伝えたいみりょくは、―だ。」「―は欠かせない。」「―ならではだ。」「―こそ、―だ。」）。<br>②<b>第4時で自分が選んだ工夫<\/b>を確かめ、それを使う場所を決める。<br>③構成メモをもとに文章を書く。<br>④写真や図の使い方、文末表現を工夫する。"], ["交流", "途中で一度手を止め、<b>書き出しだけ<\/b>をグループで読み合う。<br><b>交流後に変わること<\/b>：書き出しが平板だった児童が、友達の書き出しから<b>読み手を引き込む言い方<\/b>を取り入れる。第4時で「読者への呼びかけ」を選んだ児童の文章が生きる。"], ["手だて", "○<b>第4時のカードと、本時（第8時）の構成メモ（どちらも赤ペン入り）を机上に出させる。<\/b> 「読んで選んだ工夫」と「自分で選んだ構成」を手元に置いて書く。単元を貫く筋が、児童の手元で見える。<br>○「よさを伝えるときの言葉」を<b>掲示<\/b>し、いつでも使えるようにする。<br>○作文のルールが不安な児童のために、<b>書き出しの一文を入れた用紙<\/b>を用意する。<br>○手が止まる児童には、<b>構成メモの一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。"], ["ICT・AI", "○清書をロイロで提出（第10時の相互閲覧の準備）。<br>○字を書くことに苦手意識のある児童は、ロイロでの入力を選べるようにする。"], ["評価", "⑤自分の考えが伝わるように書き表し方を工夫している。〈ワークシート〉"]], "notes": []}, "10": {"title": "三次（第10時）　読み合い、振り返る", "ids": ["10"], "rows": [["めあて", "友達の文章のよいところを見つけて伝え、単元の学びをふりかえろう。"], ["主な学習活動", "①グループで文章を読み合い、よいと思ったところを伝える。<br>②p.169「ふりかえろう」「たいせつ」「いかそう」で単元の学びを押さえる。<br>③単元を通したポートフォリオ（第2時にロイロで書き込んだ絵〜第4時のカード〜構成メモ〜作品）を見返し、<b>自分の学びの変化<\/b>を振り返る。"], ["交流", "グループで読み合い、<b>使われている「筆者の工夫」を指摘し合う<\/b>（「ここ、高畑さんの『呼びかけ』を使ってるね」）。<br><b>交流後に変わること<\/b>：自分では意識せず使っていた工夫を、<b>友達に指摘されて自覚する<\/b>。「読んで見つけたことを、書くときに使えた」という手応えが残る。"], ["手だて", "○感想は「よかった」で終わらせず、<b>「どこが」「なぜ」<\/b>まで書く型を渡す。<br>○全員に感想が行き渡るよう、読む順番を教師が指定する。<br>○振り返りは、<b>第4時のカードと完成した文章を並べて<\/b>見せ、つながりを言葉にさせる。"], ["ICT・AI", "○ロイロで全員の文章を相互閲覧できるようにする（グループ外の文章も読める）。<br>○〈教員・授業後〉ポートフォリオと振り返りの記述をAIで整理し、<b>単元を通した学びの変化<\/b>を研究のまとめ（後日の報告）にまとめる。"], ["評価", "⑤〈ワークシート〉⑥単元を通して学びを振り返ろうとしている。〈発言・振り返りの記述〉"]], "notes": ["<b>時数についての補足<\/b>", "<b>第1時から第8時（本時）までの8時間は、日程を詰めて確実に消化する。<\/b> 公開日が動かせないため、ここが計画の要になる。", "第9時は学級の実態から<b>2時間必要になる見込み<\/b>。公開後なので、余裕をもたせて配当してよい。", "第5〜7時の「2冊以上を照らし合わせる」（関門③）は、児童がAIを使えない条件下で<b>研究主題③（情報を鵜呑みにせず根拠を基に判断する）<\/b>に応える場面。", "<b>第5〜7時のブロックは自由進度、第8時（本時）は㋐→㋑→提出→㋒→㋓を順序どおりに全員で進める<\/b>（2026-11-14 変更／11-16 再変更）。本時は、一斉の流れの中で全員が見本での確かめ→構成メモ→グループでの説明とふせん→書きかえを確実に通ることを優先した。", "<b>第4時と第8時（本時）は、どちらも「選ぶ → 根拠を言う → 交流して更新する」という同じ思考の型<\/b>で組んである。第4時は「読む」場面、本時は「書く」場面で、同じ考え方を使う。この反復によって、<b>読んで身につけた力を活用する<\/b>という単元の筋が見えてくる。"]}}, "scenes": {"1": {"rows": [{"a": 0, "b": 2, "name": "あいさつ、単元に入ることを告げる", "do": "教科書 p.155 を開かせる。<b>まだ本文は読ませない。<\/b>絵から入る。", "say": [], "mark": false}, {"a": 2, "b": 8, "name": "<b>絵で気づいたことを書き、ペアで出し合う<\/b>（WS01 １）", "do": "絵を大きく映し、<b>指さしながら話せる<\/b>ようにする。細部を見ている子を見つけておく（次の全体で指名）。", "say": ["何の絵に見える？　気づいたことを、絵のどこを見たかといっしょに書いて、となりの人と言い合おう。"], "mark": false}, {"a": 8, "b": 13, "name": "全体で出し合う", "do": "細部の気づきを拾って板書する。「兎が笑っている」「動いて見える」は、<b>第2時につながるので必ず取り上げる。<\/b>", "say": [], "mark": false}, {"a": 13, "b": 25, "name": "<b>「『鳥獣戯画』を読む」を通読する<\/b>", "do": "<b>範読を先に聞かせてから読ませる。<\/b>読むことに困難のある児童も内容の見通しをもてる。<b>以降の時間も、範読音声を手元で聞ける状態にしておく<\/b>と告げる。", "say": [], "mark": false}, {"a": 25, "b": 29, "name": "p.155 の問いと単元の目標を確かめる", "do": "「筆者は、『鳥獣戯画』をどう読み、それをどのように伝えているでしょう」と、<b>「筆者の工夫をとらえて読み、それをいかして書こう」<\/b>を板書して押さえる。", "say": [], "mark": false}, {"a": 29, "b": 33, "name": "p.166〜169 に目を通し、<b>ゴールをつかむ<\/b>（WS01 ２）", "do": "高橋さんの作例「和食の心」を<b>ざっと見せるだけ<\/b>でよい。<b>この単元の終わりに、自分も同じものを書く<\/b>と分かればよい。WS01 ２はp.155の引用から「日本文化」を見つけて書く。<b>「読んでもらう相手」は、ここで教師が伝えて書かせる<\/b>——<b>おうちの人や地域の人<\/b>。完成した文章は<b>授業参観で廊下に掲示<\/b>する。", "say": ["この単元の終わりに、みんなも「自分がえらんだ日本文化のよさ」を伝える文章を書きます。書くために、まず高畑さんの書き方を読みます。"], "mark": false}, {"a": 33, "b": 42, "name": "<b>ロードマップを読み、ゴールまでの見通しをもつ<\/b>（WS01 ３）", "do": "<b>ロードマップを配る。<\/b>上の段（読む）から下の段（書く）へ、指でたどりながら読む。⑧の太枠は「<b>いちばん大事な時間<\/b>」とだけ伝える。<br>３(1)〜(3)を一人で（3分）→ 全体で答えを確かめる。<b>答えはロードマップに書いてある<\/b>ので、手が止まる子にはマスを指さす。<br>３(4)「いちばんがんばりたい時間」を書き、<b>ペアで伝え合って書き足す<\/b>。<br><b>第5〜7時は自分で進める時間になる<\/b>ことを、(3)の答え合わせで予告しておく。", "say": ["ゴールまでの地図です。文章を書く⑨の前に、何をそろえておかないといけないかな。ロードマップの中から探してごらん。"], "mark": true}, {"a": 42, "b": 45, "name": "ふりかえり<b>（ロードマップの①に書く）<\/b>", "do": "ロードマップの①の〈ふりかえり〉に書き、□にしるしをつけさせる。<b>毎時間の終わりにここへ戻る<\/b>ことを伝える。日本文化の本が教室にあることを知らせ、<b>いつ読んでもよい<\/b>と伝える。第5〜7時の助走になる。", "say": [], "mark": false}], "groups": [], "tips": []}, "2": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "ロイロで絵を配る。<b>「どんどん書き込んでいい絵です」<\/b>と、遠慮なく書かせる。", "say": [], "mark": false}, {"a": 3, "b": 10, "name": "p.156〜162 を音読する", "do": "読むことに困難のある児童には<b>範読音声<\/b>を。全文を追えなくてよい。", "say": [], "mark": false}, {"a": 10, "b": 20, "name": "<b>三つの文は、絵のどこのことか<\/b>（WS02 １）", "do": "次の3か所に、ロイロの絵で<b>ア・イ・ウを書きこむ<\/b>。そのうえで、その場所を<b>「（だれ）の（どこ）」<\/b>で書き、「前から気づいていた／文を読んではじめて気づいた」の<b>どちらかに○<\/b>をつける。<br>・ア　p.156「蛙が外掛け、…」<br>・イ　p.158 11〜12行目「兎を投げ飛ば…」<br>・ウ　p.159 4行目「もんどりうっ…」<br><b>「〇〇の〇〇」で書ければ十分。<\/b>書けない児童には「どの動物の、体のどこ？」と聞く。", "say": [], "mark": false}, {"a": 20, "b": 24, "name": "<b>ペアで指さし確認<\/b>", "do": "「この文は、絵のどこのこと？」と言い合い、□にしるし。<b>指がさせていない児童を探して回る。<\/b><br><b>「はじめて気づいた」に○をした数を挙手で数え、板書する<\/b>（イ・ウが多い見こみ）。３への橋わたし。", "say": [], "mark": false}, {"a": 24, "b": 29, "name": "時間の流れ（WS02 ２）", "do": "p.160 1〜2行目「絵巻の絵は、…」を読み、ロイロの絵に<b>時間の向きの矢印<\/b>を書き、何がどの順におこるかと<b>行番号<\/b>（160ページ3〜9行目）を書かせる。", "say": [], "mark": false}, {"a": 29, "b": 32, "name": "<b>ページをめくる体験<\/b>（WS02 ３(1)）", "do": "p.157 13行目「ためしに、ぱ…」を<b>実際に全員でやる。<\/b>見え方を一言書かせる。<b>体験させることに意味がある。<\/b>書けない児童には、もう一度めくって見せ「今、蛙はどうなった？」と聞く。", "say": [], "mark": false}, {"a": 32, "b": 39, "name": "<b>筆者は、なぜわざと切りはなして見せたのか<\/b>（WS02 ３(2)）<br>本時の中心", "do": "p.158 7〜8行目「この二枚の絵…」を読み、<b>読む人にどんなことがおこるか<\/b>を書かせる。書き出しの例「切りはなしてあると、読む人は……」は使わなくてよい。<br><b>「もとになる言葉（ページ・行目）」を必ず書かせる。<\/b>見つからない児童には「p.158の1〜3行目だけ読んでごらん」と範囲をしぼる。", "say": [], "mark": true}, {"a": 39, "b": 43, "name": "<b>友達と読み合う<\/b>（WS02 ３(3)）", "do": "聞き手は<b>「どの言葉からそう考えたの？」と一回だけ聞く。<\/b>なるほどと思ったことを点線の下に書き足す。書き足すことがない児童には「友達は、何ページの言葉を使っていた？」と聞く。", "say": [], "mark": true}, {"a": 43, "b": 45, "name": "まとめ・ふりかえり<b>（ロードマップの②に書く）<\/b>", "do": "1〜2人に読ませる。ふりかえりは<b>ロードマップの②<\/b>に書き、□にしるし（WS02に欄はない）。", "say": ["高畑さんは、絵をそのまま見せていない。わざと切りはなしている。これも「工夫」です。次の時間、こういう工夫をさがします。"], "mark": false}], "groups": [], "tips": []}, "3": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "3観点の掲示物を指さして「今日はこの3つでさがす」と予告する。", "say": [], "mark": false}, {"a": 3, "b": 12, "name": "<b>筆者の評価が分かる言葉を書きうつす<\/b>（WS03 １）", "do": "p.164 上段で<b>評価の対象が「絵」と「絵巻物」の二つ<\/b>あることを確かめてから書かせる。<b>それぞれ二つで十分。<\/b>行目も書く。<br>・絵…p.156「のびのびと見…」／p.159 9〜10行目「見事にそれを…」<br>・絵巻物…p.161 11〜14行目「日本文化の大…」／p.162「国宝であるだ…」<br><b>探す範囲が分からない児童には、1ページに限定して渡す。<\/b>", "say": [], "mark": false}, {"a": 12, "b": 16, "name": "<b>グループで出し合う<\/b>（WS03 ２）", "do": "<b>一つ書き足せれば十分。<\/b>空欄の児童には「今、だれが何て言った？」と聞き、そのまま書かせる。", "say": [], "mark": false}, {"a": 16, "b": 20, "name": "<b>三つの見方を示し、教師が一例ずつ実演する<\/b>", "do": "<b>ここを省かない。<\/b>「見つけ方」を見せる時間である。WS03の<b>着眼点を読み上げてから<\/b>、例を一つずつ示す（p.164 下段）。<br>・<b>論の展開<\/b>…絵巻物の説明に、まんがやアニメのことを出している<br>・<b>表現の工夫<\/b>（▶文の終わり方／話しかけ・問いかけ／短く言い切る文／様子を表す言葉）…「返し技。」「かわづ掛け。」と言い切る<br>・<b>絵の示し方<\/b>…つながっている絵を、わざと切りはなした（第2時）", "say": [], "mark": true}, {"a": 20, "b": 30, "name": "<b>三つの見方で工夫を書き出す<\/b>（WS03 ３）", "do": "<b>見つけた分だけでよい。<\/b>ページ・行目も書かせる。<b>表現の工夫が見つからない児童<\/b>には、p.158 1行目「どうだい。」と p.159 9〜10行目「たいしたものだ。」を指し、<b>「ふつうの説明文に直すとどうなる？」<\/b>と聞き、ちがいを一言で言わせる。<br>机間は、第2時で根拠が書けていなかった児童から回る。", "say": ["1つ書けたら、それでいいです。たくさん書く人がえらいのではありません。"], "mark": true}, {"a": 30, "b": 35, "name": "<b>ロイロのアンケートに送る<\/b>", "do": "紙の３は<b>下書き<\/b>。<b>一つずつ<\/b>送らせる（1つの工夫＝1回答）。苦手な児童は<b>一つで十分<\/b>。むずかしければ紙を撮影して提出箱へ（教師が入力）。<br>回答一覧を大型テレビに映し、<b>学級全体の見取り図<\/b>を見せる。", "say": [], "mark": false}, {"a": 35, "b": 42, "name": "<b>いちばん「なるほど」と思った工夫<\/b>（WS03 ４）", "do": "３から<b>一つに◎<\/b>。(1)◎の工夫→(2)本文の言葉（ページ・行）→(3)<b>読んだとき、自分にどんなことがおこったか<\/b>。十分満足は(3)が書けている。<br>決められない児童には「<b>読んでいて声が出そうになった所<\/b>はどこ？」と聞く。", "say": [], "mark": true}, {"a": 42, "b": 45, "name": "◎を見せ合う・ふりかえり<b>（ロードマップの③に書く）<\/b>", "do": "となりと◎を見せ合う（1分）。ロードマップの③に書き、□にしるし。", "say": [], "mark": false}], "groups": [], "tips": []}, "4": {"rows": [{"a": 0, "b": 5, "name": "<b>学級の工夫マップを手元で見る<\/b>", "do": "ロイロで配信。<b>前時のWS03（特に４の◎）<\/b>を机上に出させる。", "say": ["きのう、みんなが見つけた工夫を全部まとめました。自分のがどこに入ったか、さがしてごらん。"], "mark": false}, {"a": 5, "b": 8, "name": "めあての確認", "do": "<b>「えらぶ」と「理由を言う」の二つ<\/b>が今日することだと押さえる。第8時と同じ言い方をしておく。", "say": [], "mark": false}, {"a": 8, "b": 20, "name": "<b>工夫を一つえらび、カードに書く<\/b>", "do": "書く内容は3つ。①どんな工夫か　②<b>教科書 p.○ ○行目の「　　」という言葉<\/b>　③読む人にどんな効果があるか。<br><b>読み返す範囲を全文にしない。<\/b><b>WS03の４に書いた工夫から写して始めてよい。<\/b>読み返すのは、そこに書いた行の前後だけでよい。<br>手が止まる児童には<b>おすすめカード（3つに絞ったもの）<\/b>を示して選ばせ、<b>書き出しの型「読む人が〜」<\/b>を渡す。<b>カードは枠のみ・短文でよい<\/b>と明示する。", "say": [], "mark": true}, {"a": 20, "b": 24, "name": "<b>提出箱へ出し、一覧で見比べる<\/b>", "do": "写真で提出し、一覧表示する。<b>型ごとの提出箱の使い方は、第8時（㋒の前に提出）の予行。<\/b>", "say": [], "mark": false}, {"a": 24, "b": 35, "name": "<b>グループ5人で報告し合う<\/b>", "do": "1人1分半。聞き手は必ず<b>「それは本文のどこから言えるの？」<\/b>と問い返す。<b>問い返しの型を紙で配る。<\/b><br><b>説明者の左隣を「必ず問い返す人」<\/b>と決めておく（聞き役に回りっぱなしの児童を出さない）。", "say": [], "mark": true}, {"a": 35, "b": 40, "name": "<b>赤ペンで書き足す・書き換える<\/b>", "do": "<b>変えなかった児童には「変えなかった理由」を赤で書かせる。<\/b>変えないことも判断である。<br><b>この赤ペンの跡が、第8時で同じことをするときの手本になる。<\/b>", "say": [], "mark": true}, {"a": 40, "b": 45, "name": "ふりかえり", "do": "この工夫を、自分の文章の<b>どこで<\/b>使いたいかを書かせる。<b>カードはポートフォリオへ。第8時・第9時で机上に出す。<\/b>", "say": [], "mark": false}], "groups": [], "tips": [{"head": "つまずき", "items": [["工夫がえらべない", "<b>おすすめカード<\/b>（3つに絞ったもの）を机上に置き、指さして選ばせる"], ["本文のどこから言えるか示せない", "WS03の４（またはアンケートの自分の回答）を見せ、<b>「この1か所だけ見よう」<\/b>と範囲を絞る"], ["効果が書けない", "<b>書き出しの型「読む人が〜」<\/b>を渡し、口で言わせてから書かせる"], ["交流で発言できない", "<b>説明者の左隣を「必ず問い返す人」<\/b>と決める。1人1分半、グループにタイマー"], ["赤ペンで何を書けばよいか分からない", "<b>「だれの、どの言葉を聞いて」<\/b>まで書かせる。変えなかった児童は<b>変えなかった理由<\/b>"]]}]}, "5": {"rows": [{"a": 0, "b": 10, "name": "<b>学習の手引きを読み合わせる（全員）<\/b>", "do": "A・B・C と<b>3つの関門<\/b>を確かめる。<b>進め方のきまり<\/b>を確認する。<b>「困ったときのメニュー」が手引きに刷ってあることを、ここで必ず知らせる。<\/b>「困ったらこれを使っていい」と、初めに言っておく。", "say": ["じゅんばんは自分で決めていい。でも、①②③の関門は、ぜんぶ通ります。とばせません。"], "mark": true}, {"a": 10, "b": 40, "name": "<b>自由進度<\/b>", "do": "教師は個別支援に回る。<b>まず、第4時で手が止まっていた児童から。<\/b>", "say": [], "mark": false}, {"a": 40, "b": 45, "name": "ロードマップに印をつけ、次時の見通しを書く", "do": "「次の時間、どこから始める？」だけ書かせる。", "say": [], "mark": false}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "6": {"rows": [{"a": 0, "b": 5, "name": "今日の計画を立て、ロードマップで確かめる", "do": "座席表を見て、<b>今日まず回る児童を決めておく。<\/b>", "say": [], "mark": false}, {"a": 5, "b": 30, "name": "<b>自由進度<\/b>", "do": "<b>関門②を通っていない児童に集中する。<\/b>この時間が最後のチャンス。", "say": [], "mark": false}, {"a": 30, "b": 40, "name": "<b>【必修の交流】ペアで「いちばん伝えたいみりょく」を言い合う<\/b>", "do": "<b>関門②を通った児童から順にペアをつくる。<\/b>相手は誰でもよい。<b>通っていない児童は、この時間に教師と一緒に決める。<\/b>情報を一緒に見て、その場で一つに絞る。", "say": ["自分の題材と、いちばん伝えたいみりょくを、一言で言ってごらん。聞く人は「それのどこがいいの？」と一回だけ聞き返して。"], "mark": true}, {"a": 40, "b": 45, "name": "ロードマップに印をつける", "do": "関門②の通過状況を<b>座席表で確かめておく<\/b>（第7時の支援順路に使う）。", "say": [], "mark": false}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "7": {"rows": [{"a": 0, "b": 5, "name": "今日の計画を立てる", "do": "<b>「今日で材料をそろえ終わる」<\/b>と明確に告げる。", "say": [], "mark": false}, {"a": 5, "b": 30, "name": "<b>自由進度<\/b>（主にC）", "do": "<b>関門③に集中する。<\/b>2冊目が見つからない児童には<b>対になる本<\/b>を渡す。情報が多すぎて選べない児童には<b>「読む人がいちばんおどろくのはどれか」<\/b>と問う。", "say": [], "mark": false}, {"a": 30, "b": 34, "name": "<b>【全員】5つの型と、高橋さんの文章の型を確かめる<\/b>", "do": "自由進度を切り上げる。p.167の<b>5つの型の短冊<\/b>を黒板に貼り（第8時もそのまま）、<b>色分け拡大版<\/b>で高橋さんの文章の形を一つだけ確かめる。よく知られた特長を<b>簡単に<\/b>→「しかし、私が…」（p.168 11行目）で転じて→<b>くわしく<\/b>。想定は「初めで話題を示し、終わりでくわしく書く」型。<b>事実の確認だけ。深入りしない。<\/b>", "say": [], "mark": true}, {"a": 34, "b": 39, "name": "<b>【全員】型を仮に選び、理由を書く（WS07の６）<\/b>", "do": "選べない児童には<b>「初めに問いを書き、それに答えていく」型<\/b>を勧める。５が書けていない児童は、先に教師と一緒に５を一つに絞る。", "say": ["５に書いた「いちばん伝えたいみりょく」が、いちばんよく伝わる型を一つえらびましょう。次の時間に、かえてもかまいません。"], "mark": true}, {"a": 39, "b": 44, "name": "<b>【全員】グループ（5人）で５と６を言い合う<\/b>", "do": "言えない児童は、６の型の文を<b>そのまま読めばよい<\/b>。第8時の関所と同じ問い返し。", "say": ["聞く人は「その型で、いちばん伝えたいことが伝わる？」と一回だけ聞き返して。"], "mark": true}, {"a": 44, "b": 45, "name": "<b>赤ペン・教師による最終確認<\/b>", "do": "変えた児童は５・６を赤ペンで直し、７に書く。<b>全員分を確かめる。<\/b>①「いちばん伝えたいみりょく」が一文で書けているか　②６に型の印があるか　③関門③が通っているか。<br><b>届いていない児童には、その場で情報カードを渡す。本時に空手で臨む児童をゼロにする。<\/b>授業後、2枚目を提出箱へ（AIで「題材・みりょく・仮の型」を一覧化）。", "say": [], "mark": true}], "groups": [], "tips": [{"head": "見るところ", "items": [["<b>関門①が空いている<\/b>", "本が合っていない可能性。<b>写真中心の本に替える。<\/b>「資料の使い方」の観点なら通れると伝える。"], ["<b>関門②が空いている<br>（第6時の終わりまで）<\/b>", "<b>最優先。<\/b>その場で一緒に情報を見て、<b>一つに絞る。<\/b>ここを越えられないと第8時で動けない。"], ["<b>関門③が空いている<\/b>", "2冊目が見つかっていない。<b>対になる本を渡す。<\/b>それでも無理なら情報カード。"], ["<b>Aに長くとどまっている<\/b>", "読むのが楽しくなっている場合と、決められない場合がある。<b>「どれについて書きそう？」と一言聞いて見分ける。<\/b>"], ["<b>関門が全部そろって手が空いている<\/b>", "3冊目を読む／<b>別の図の型で整理し直して比べる<\/b>／同じ題材の友達の情報と照らし合わせる。"]]}]}, "8": {"rows": [{"a": 0, "b": 3, "name": "<b>めあてと、今日の流れを知る<\/b>", "do": "構成メモと<b>WS07の2枚目<\/b>を机上に。めあて（「<b>選ぶ<\/b>」と「<b>説明する<\/b>」）。<b>今日の流れ<\/b>（掲示物）を貼って説明する。<b>五つの型の見本<\/b>（教具G）は型の短冊の下に。<b>ロイロでも送ってある。<\/b>", "say": ["㋐ 見本を読んで型をたしかめる → ㋑ 構成メモを仕上げる → 自分の型の提出箱に出す → ㋒ グループで説明して、ふせんで助言をもらう → ㋓ ふせんを見て、かならず一か所直す。"], "mark": false}, {"a": 3, "b": 9, "name": "㋐ 見本を読みくらべる／㋑ 仕上げる", "do": "構成メモが立っている児童は<b>㋐から<\/b>、途中の児童は<b>㋑で仕上げてから㋐<\/b>へ。支援順路：<b>構成メモが立っていない児童<\/b>から（型あり版＋型⑤の見本）。", "say": ["まず自分の型の見本。次に、気になる型をもう一つ。変わるのは順番だけ？　伝わり方も変わる？"], "mark": false}, {"a": 9, "b": 9, "name": "<b>全体に一声<\/b>", "do": "", "say": ["㋐の人は、そろそろ㋑に移りましょう。型をかえた人は、「えらんだ型」に赤ペンで印をつけ直してね。"], "mark": true}, {"a": 9, "b": 15, "name": "㋑ 組み立てる（全員）", "do": "<b>短い語句でよい<\/b>。見るのは<b>★と「く」が重なっているか<\/b>。止まる児童には見本を指して「高橋さんはここに★。あなたは？」", "say": [], "mark": false}, {"a": 15, "b": 17, "name": "<b>型ごとの提出箱に出す<\/b>", "do": "写真に撮り、<b>自分が選んだ型の提出箱<\/b>（5つ・短冊と同じ順・回答共有済み）へ。「えらんだ型」を確かめてから。<b>途中でも出す。<\/b>㋒では、説明する人の構成メモをここから開いて見る。", "say": [], "mark": true}, {"a": 17, "b": 18, "name": "<b>進め方を確かめる<\/b>", "do": "教具Cを<b>各グループに1部<\/b>。順番は決めておいたとおり。", "say": ["一人2分半。説明1分、問い返し30秒、ふせん1分。ふせんには、どこを、どう直すとよいかを書きます（★のところ → もっとくわしく）。"], "mark": false}, {"a": 18, "b": 30, "name": "<b>説明・問い返し・ふせん（一人2分半×5人）<\/b>", "do": "<b>2分半ごとに合図<\/b>（児童のナビにも同じタイマーがある）。聞き手は<b>提出箱で構成メモを開いて<\/b>聞き、必ず一回「その構成で、いちばん伝えたいことが伝わる？」と問い返す。説明の型「<b>わたしがいちばん伝えたいのは○○です。だから、○○の型にしました。<\/b>」（WS07の６を読んでよい）。<br><b>印は聞き手が付ける<\/b>（WS08の□4つで全員が説明したか分かる）。ふせんは構成メモの余白に貼る。教師は<b>説明が止まりそうな児童のいるグループ<\/b>から回る。", "say": [], "mark": true}, {"a": 30, "b": 38, "name": "<b>ふせんを見て、赤ペンでかならず一か所直す（個人）<\/b>", "do": "WS08の<b>３<\/b>に「どのふせんで、どこを直したか」。迷う児童には、ふせんを「<b>すぐ直せる<\/b>」「<b>考えたい<\/b>」に分けさせる。<b>発表させる児童を3名ほど<\/b>決める（型を選び直した／★を動かした／くわしく書く部分を変えた）。", "say": ["ここからは相談しません。ふせんと聞いたことをもとに、かならず一か所は直しましょう。"], "mark": true}, {"a": 38, "b": 43, "name": "<b>どこを直したかを発表する<\/b>", "do": "<b>直す前（提出箱）と後の写真<\/b>、<b>きっかけのふせん<\/b>を並べてテレビに。「いちばん伝えたいことが伝わるように」構成を考えるとは、を<b>児童の言葉で<\/b>まとめる。", "say": ["どこを、なぜ直したの？　どのふせんがきっかけだった？"], "mark": false}, {"a": 43, "b": 45, "name": "次時の見通し", "do": "次時は構成メモの<b>「く」と★のところをいちばんくわしく<\/b>書く、と一言伝える。<b>ふせんを貼ったまま構成メモをポートフォリオに綴じさせる。<\/b>", "say": [], "mark": false}], "groups": [{"a": 3, "b": 15, "name": "㋐ たしかめ → ㋑ 組み立てる"}, {"a": 15, "b": 17, "name": "提出"}, {"a": 17, "b": 30, "name": "㋒ 説明の関所　グループ5人・ふせんで助言"}, {"a": 30, "b": 38, "name": "㋓ 書きかえる　ひとりで"}, {"a": 38, "b": 45, "name": "共有・ふりかえり"}], "tips": [{"head": "起きたこと", "items": [["<b>ネットワーク・ロイロが使えない<\/b>", "見本は<b>黒板<\/b>で読む。㋒は<b>構成メモの現物を真ん中に置いて<\/b>説明。提出は授業後。<b>中心は紙とふせんだけで成立する。<\/b>"], ["<b>15分で構成メモが仕上がっていない<\/b>", "<b>書けたところまでで提出・説明<\/b>させ、㋒は予定どおり始める。"], ["<b>欠席で班が4人以下<\/b>", "一人2分半のまま（余れば<b>ふせん二枚目<\/b>）。3人以下なら隣の班と合わせる。"], ["<b>全体に進みが遅い<\/b>", "<b>㋐を短く<\/b>（自分の型の見本だけ）。㋒と㋓は省かない。"], ["<b>㋓が早く終わる児童<\/b>", "①ふせんで<b>二か所目<\/b>を直す　②提出箱で<b>違う型の人を一人見つけ、理由を考える。<\/b>"], ["<b>構成メモが立っていない<\/b>", "導入のあと<b>最初に回る<\/b>（WS07の５が空なら一緒に決める）。<b>㋑から・型あり版＋型⑤の見本<\/b>。㋒は<b>4〜5番目<\/b>、型とみりょくだけでよい。㋓は<b>一か所<\/b>で十分。材料が無ければ<b>情報カード<\/b>。"]]}]}, "9": {"rows": [{"a": 0, "b": 5, "name": "<b>第4時のカードと第8時の構成メモを机上に出す<\/b>", "do": "<b>どちらも赤ペンが入っている。<\/b>「読んで選んだ工夫」と「自分で選んだ構成」を手元に置いて書く。<b>単元を貫く筋が、児童の手元で見える。ここを省かない。<\/b>", "say": [], "mark": true}, {"a": 5, "b": 10, "name": "高橋さんの作例の工夫を見つける", "do": "p.168 欄外「よさを伝えるときの言葉」を確かめて<b>掲示する<\/b>（掲示物は 03_掲示・教具/横書き/掲示物_短冊.html の最終ページ）。<br>「いちばん伝えたいみりょくは、―だ。」「―は欠かせない。」「―ならではだ。」「―こそ、―だ。」", "say": [], "mark": false}, {"a": 10, "b": 13, "name": "<b>第4時で選んだ工夫を使う場所を決める<\/b>", "do": "構成メモのどこで使うか、印をつけさせる。", "say": ["第4時でえらんだ工夫を、どこで使いますか。構成メモに印をつけましょう。"], "mark": false}, {"a": 13, "b": 28, "name": "<b>構成メモをもとに書く<\/b>", "do": "手が止まる児童には、構成メモの<b>一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。<br>作文のきまりが不安な児童には<b>書き出しの一文を入れた用紙<\/b>を渡す。", "say": [], "mark": false}, {"a": 28, "b": 35, "name": "<b>手を止めて、書き出しだけをグループで読み合う<\/b>", "do": "<b>途中で止めることに意味がある。<\/b>最後まで書いてからでは直せない。", "say": ["最初の2〜3行だけ読み合ってください。「読みたくなった」と思ったら、そう言ってあげて。"], "mark": true}, {"a": 35, "b": 43, "name": "続きを書く／写真や図の使い方、文末表現を工夫する", "do": "字を書くことに苦手意識のある児童は、<b>ロイロでの入力を選べる<\/b>ようにする。", "say": [], "mark": false}, {"a": 43, "b": 45, "name": "ふりかえり", "do": "2時間目に入る場合は、<b>次にどこから書くか<\/b>を書かせて終わる。", "say": [], "mark": false}], "groups": [], "tips": []}, "10": {"rows": [{"a": 0, "b": 3, "name": "めあての確認", "do": "感想の型を配る。<b>「よかった」で終わらせない<\/b>と告げる。", "say": [], "mark": false}, {"a": 3, "b": 20, "name": "<b>グループで読み合い、よいところを伝える<\/b>", "do": "<b>「使われている筆者の工夫」を指摘させる。<\/b>これが単元の筋を児童に自覚させる場面。<b>全員に感想が行き渡るよう、読む順番を教師が指定する。<\/b>", "say": ["ここ、高畑さんの「呼びかけ」を使ってるね　――　こんなふうに言えたら最高です。"], "mark": true}, {"a": 20, "b": 28, "name": "ロイロで、グループ外の文章も読む", "do": "同じ題材を選んだ人、違う型を選んだ人、という<b>見る観点<\/b>を示す。", "say": [], "mark": false}, {"a": 28, "b": 36, "name": "p.169「ふりかえろう」「たいせつ」「いかそう」", "do": "身につけた力を言葉にして押さえる。", "say": [], "mark": false}, {"a": 36, "b": 43, "name": "<b>ポートフォリオを見返し、自分の学びの変化を振り返る<\/b>", "do": "<b>第4時のカードと完成した文章を並べて見せ、つながりを言葉にさせる。<\/b><b>自由進度についても振り返らせる。<\/b>", "say": ["第4時に「使いたい」とえらんだ工夫は、ほんとうに使えましたか。自分の文章のどこに出ていますか。", "自分で進め方を決めて学習した時間がありました。やってみて、どうでしたか。"], "mark": true}, {"a": 43, "b": 45, "name": "まとめ", "do": "次の単元でも使える力として言い直して終える。", "say": [], "mark": false}], "groups": [], "tips": []}}, "flow8": [{"min": 3, "name": "めあて・流れ", "body": "めあて／今日の流れ（㋐→㋑→提出→㋒→㋓）／五つの型の見本を黒板とロイロで示す"}, {"min": 12, "name": "㋐→㋑", "body": "㋐たしかめ（見本を読みくらべて型を確かめる）→㋑構成メモを仕上げる。途中の児童は㋑から"}, {"min": 2, "name": "提出", "body": "自分の型の提出箱（5つ・回答共有）に出す"}, {"min": 13, "name": "㋒説明の関所", "body": "グループ（5人）で説明。聞き手は提出箱で構成メモを見て問い返し、ふせんで助言。一人2分半"}, {"min": 8, "name": "㋓書きかえる", "body": "一人で、ふせんと聞いたことをもとに、赤ペンで必ず一か所は直す"}, {"min": 7, "name": "発表・ふりかえり", "body": "3名ほどが「どこを、なぜ直したか」を発表（直す前後とふせんを並べて提示）／次時の見通し"}], "tedate8": [["<b>構成メモが立っていない<\/b>", "<b>㋑から始めさせ、型あり版<\/b>を渡す。<b>自分の型の見本<\/b>（教具G）を横に置き、「高橋さんはここに★を置いた。あなたは？」と、見本と同じ位置から考えさせる。"], ["<b>型が選べない／仮の型が合わない<\/b>", "型は第7時の終わりに仮に選んである。選べていない児童には「<b>初めに問いを書き、それに答えていく<\/b>」型を勧める（いちばん書き進めやすい）。㋐で見本を読んで合わないと感じた児童には、選び直してよいことを伝え、「えらんだ型」に赤ペンで印をつけ直させる。"], ["<b>㋐で何を見ればよいか分からない<\/b>", "「<b>まず自分の型の見本。次に、気になる型をもう一つ。<\/b>」と二つに絞る。五つ全部は読まなくてよい。問い返し「<b>変わるのは順番だけ？　伝わり方も変わる？<\/b>」。開始6分で「<b>㋐の人は、そろそろ㋑に移りましょう<\/b>」と声をかける。"], ["<b>高橋さんの文章が読めない<\/b>（㋐）", "範読音声を手元で聞けるようにする。<b>色分けした拡大版<\/b>（教具A）も手元に置く。見本は<b>自分の型の1枚だけ<\/b>でよい。"], ["<b>構成メモが書けない・作文のルールが不安<\/b>", "構成メモは<b>文でなく短い語句でよい<\/b>ことを明示する。評価するのは文の量や体裁ではなく、<b>「いちばん伝えたいこと」がどこに置かれているか<\/b>であると事前に伝える。"], ["構成メモの形式に迷う", "<b>枠が決まっているもの<\/b>と<b>自由に書けるもの<\/b>の2種類を用意し、選べるようにする。"], ["<b>出す箱をまちがえる<\/b>", "提出前に「えらんだ型」の欄（赤ペンで選び直した児童はその印）を確かめさせる。箱の名前と順番は黒板の短冊とそろえておく。"], ["<b>「なぜその構成か」が説明できない<\/b>", "説明の型を紙で配る ——「<b>わたしがいちばん伝えたいのは○○です。だから、○○の型にしました。<\/b>」各グループにも1部置いておく。"], ["<b>構成メモが途中のまま㋒になる<\/b>", "<b>書けたところまでで出し、書けたところまでで説明してよい<\/b>と伝える。ふせんをもらってから㋓で書き足せばよい。"], ["㋒で話が長くなる／短く終わる", "一人2分半。教師が合図する。聞き手には問い返しの型を渡し、<b>必ず1回は問い返し、ふせんを一枚書いて渡す<\/b>ことをきまりにする。"], ["<b>ふせんに何を書けばよいか分からない<\/b>", "板書の例「<b>★のところ → もっとくわしく<\/b>」を指し、<b>構成メモのどこか一か所<\/b>を選んで書かせる。出なければ「よかったところ」一つでよい。"], ["<b>㋓でどこを直すか決められない<\/b>", "ふせんを「<b>すぐ直せる<\/b>」「<b>考えたい<\/b>」に分けて並べさせ、「すぐ直せる」から一枚選ばせる。ふせんが具体的でなければ、見本や聞いた問い返しをよりどころにしてよい。"], ["<b>早く終わる児童<\/b>", "㋓で、もらったふせんから<b>二か所目<\/b>を直す。提出箱で<b>自分と違う型を選んだ人を一人見つけて、理由を考える<\/b>。"], ["手が止まって動けない", "構成メモの<b>一項目だけ<\/b>を指して「ここから書こう」と範囲を絞る。第7時に確認した「いちばん伝えたいみりょく」を教師が読み上げ、そこから始めさせる。"]], "yusen": ["<b>関門③（2つの出典で確かめ、出典を書く）まで通っているか<\/b>が、そのまま「材料をもっているか」を示す。残りは教師の座席表で分かる。", "第6時の終わりまでに<b>関門②（題材と「いちばん伝えたいみりょく」が一言で言える）<\/b>を通っていない児童には、その時間に教師が一緒に情報を見て<b>一つに絞る。<\/b>", "それでも足りない児童には、<b>教師が用意した情報カード<\/b>（題材ごとに事実を3〜4枚に整理したもの）を渡す。<b>本時に空手で臨む児童をゼロにする。<\/b>"], "prep": {"pre": {"title": "単元に入る前", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>司書との日程調整<\/b>（第5〜7時の図書館）。第1時の週のうちに済ませる", "id": "pre-1"}, {"tag": "物", "text": "<b>日本文化の本を教室に配架<\/b>。第1時から手に取れる状態にしておく（図書館の割り当てが動いても吸収できる）", "id": "pre-2"}, {"tag": "物", "text": "<b>「先生のおすすめ」5冊<\/b>を選んで別置き。写真が多く、説明の工夫が見つけやすいもの。選書の観点は <code>02_教師用/WS05_選書の観点.html<\/code> を司書に渡す", "id": "pre-3"}, {"tag": "物", "text": "<b>対になる本<\/b>（同じ題材を別の角度から書いた本）を何組か確保。関門③で2冊目が見つからない児童に渡す", "id": "pre-4"}, {"tag": "事", "text": "<b>NotebookLM<\/b> に教科書本文（p.155〜169）・指導書・年間指導計画を読み込ませ、筆者の工夫を3観点で洗い出す。<b>出力は本文の該当行と突き合わせて採否を決める<\/b>", "id": "pre-5"}, {"tag": "事", "text": "<b>Gemini<\/b> で、おすすめカード・書き出しの型・教師版モデル文のたたき台を複数案出させ、学級の実態に合わせて選び直す。<b>準備にかかった時間を記録<\/b>（協議会で使う）", "id": "pre-6"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS00_ロードマップ_児童用.html<\/code>（人数分）。第1時に配り、第10時まで同じ1枚を使う", "id": "pre-7"}, {"tag": "物", "text": "<b>ポートフォリオ<\/b>（綴じるファイル）を人数分", "id": "pre-8"}, {"tag": "事", "text": "<b>ロイロカード<\/b>（<code>01_児童に配る/ロイロカード/<\/code>）の画像の上にテキストを重ねられるか、学級の端末で一度ためす", "id": "pre-9"}]}]}, "1": {"title": "第1時まで", "groups": [{"sub": "", "items": [{"tag": "物", "text": "『鳥獣戯画』の絵の<b>拡大提示<\/b>（大型テレビ）。画像は <code>03_掲示・教具/絵の切り抜き/<\/code>、黒板に貼る版は <code>03_掲示・教具/絵の切り抜き_印刷用.html<\/code>（A4横9枚）", "id": "1-1"}, {"tag": "物", "text": "<b>範読音声<\/b>を手元で聞ける状態に。<b>以降ずっと使えるようにしておく<\/b>", "id": "1-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS01_児童用.html<\/code>／<code>01_児童に配る/横書き/WS00_ロードマップ_児童用.html<\/code>", "id": "1-3"}]}]}, "2": {"title": "第2時まで", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>教科書 p.156〜157・p.158 の絵を撮影し、ロイロで配れるように<\/b>しておく（<b>済<\/b>：教科書PDFから切り抜いた画像が <code>03_掲示・教具/絵の切り抜き/<\/code> にある。撮影は不要。01・02をロイロに送る）。iPadのペンで書き込ませ、提出箱に出させる（紙には刷らない）", "id": "2-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS02_児童用.html<\/code>", "id": "2-2"}, {"tag": "物", "text": "赤・青のペン", "id": "2-3"}]}]}, "3": {"title": "第3時まで", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b>3観点の掲示物<\/b>を教室前方に貼る（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.1〜2。以後外さない）", "id": "3-1"}, {"tag": "物", "text": "<b>ふせん（1人10枚程度）<\/b>", "id": "3-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS03_児童用.html<\/code>", "id": "3-3"}, {"tag": "事", "text": "授業後、ふせんを回収（または写真）→ <b>氏名を外して<\/b>AIで3観点に分類 → 教員が本文と突き合わせて修正 → <b>第4時の「学級の工夫マップ」<\/b>", "id": "3-4"}, {"tag": "事", "text": "協議会用に「<b>AIが挙げたが本文の根拠が薄く、採用しなかった例<\/b>」を1つ以上メモ", "id": "3-5"}]}]}, "4": {"title": "第4時まで　※第8時の型をつくる時間", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>学級の工夫マップ<\/b>をロイロで配信できる状態に", "id": "4-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS04_児童用.html<\/code>（工夫カード）", "id": "4-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS04_おすすめカード.html<\/code>（3つに絞った工夫）。<b>困る前から机上に置く<\/b>", "id": "4-3"}, {"tag": "刷", "text": "<b>書き出しの型「読む人が〜」<\/b>（<code>01_児童に配る/横書き/教具D_書き出しの型_読む人が.html<\/code>）を切って机上に置く", "id": "4-4"}, {"tag": "物", "text": "<b>赤ペン（全員）<\/b>／グループ用タイマー", "id": "4-5"}]}]}, "5": {"title": "第5時まで　※自由進度ブロックの入口", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b><code>01_児童に配る/横書き/学習の手引き_児童用.html<\/code>（両面）<\/b>を人数分。裏が「困ったときのメニュー」", "id": "5-1"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS05_児童用.html<\/code>／<code>01_児童に配る/横書き/WS06_児童用.html<\/code>／<code>01_児童に配る/横書き/WS07_児童用.html<\/code>（関門①②③のシート）", "id": "5-2"}, {"tag": "刷", "text": "<code>01_児童に配る/横書き/WS07_情報カード.html<\/code>（児童の追加用）／<code>02_教師用/WS07_教師用情報カード.html<\/code>（<b>9題材<\/b>。支援用に手元へ）", "id": "5-3"}, {"tag": "刷", "text": "<b>見取り用の座席表<\/b>（<code>02_教師用/見取り用_座席表.html<\/code>。1枚目＝第5〜7時用、2枚目＝第8時用）。関門の印を押したら日付を書き込む", "id": "5-4"}, {"tag": "物", "text": "<b>相談テーブル<\/b>を教室の一角に常設", "id": "5-5"}, {"tag": "物", "text": "<b>関門の印を押すもの<\/b>（スタンプ等）。押した日付をメモできるようにしておく", "id": "5-6"}, {"tag": "事", "text": "日本文化の本がそろっているか、<b>司書と最終確認<\/b>", "id": "5-7"}]}, {"sub": "第7時の終わり15分（全員）のために", "items": [{"tag": "刷", "text": "<b>5つの型の短冊<\/b>（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.5〜7）を、30分の時点で黒板に貼る。<b>第8時までそのまま<\/b>", "id": "5-8"}, {"tag": "刷", "text": "<b>高橋さんの文章の色分け拡大版<\/b>（<code>03_掲示・教具/横書き/教具A_和食の心_色分け拡大版.html<\/code>。A3縦）を黒板に。第8時は手元に置き、㋐を選んだ児童に見せる", "id": "5-9"}, {"tag": "事", "text": "グループ（5人×6）の並び方を決めておく（自由進度から15分で切りかえるため）", "id": "5-10"}]}]}, "8": {"title": "第7時が終わったら（＝公開の直前）", "groups": [{"sub": "第7時が終わったら（前日まで）", "items": [{"tag": "事", "text": "児童の「題材」「いちばん伝えたいみりょく」「<b>仮に選んだ型<\/b>」（WS07の2枚目）を<b>氏名を外して<\/b>AIで一覧化 → 教員が確認 → <b>どの児童が型を選び直しそうか<\/b>を見立てる", "id": "8-1"}, {"tag": "事", "text": "<b>本時の支援順路のメモ<\/b>と<b>意図的指名の候補<\/b>を決めて紙に書き出す（当日手元に持つ）", "id": "8-2"}, {"tag": "事", "text": "協議会用に「<b>AIの見立てと教員の見取りが食い違った例<\/b>」を1つ以上メモ", "id": "8-3"}, {"tag": "事", "text": "全員が関門③を通っているか、WS07の６に型の印があるか最終確認。<b>届いていない児童にはその場で情報カードを渡す<\/b>（本時に空手で臨む児童をゼロにする）", "id": "8-4"}, {"tag": "事", "text": "<b>WS07の５・６が空いている児童<\/b>を、A（材料はある）／B（材料も足りない）／C（ほぼ手つかず）に分けてメモ。AとBは<b>休み時間・朝の時間に教師と5分で５・６を仕上げる<\/b>。Bに渡す情報カードは<b>出典が書き入れてあるか<\/b>確かめる（<code>02_教師用/指導案08_本時案_変更版.md<\/code>「WS07が終わっていない児童への手だて」）", "id": "8-5"}, {"tag": "事", "text": "<b>本時までに構成メモ（WS08）を立てさせる<\/b>（2026-11-16 変更：本時は構成メモを立てた状態で始める）。立っていない児童を座席表に印し、<b>支援順路のいちばん初め<\/b>に入れる", "id": "8-6"}, {"tag": "事", "text": "<b>五つの型の見本（教具G）をロイロのカードにして<\/b>、本時の前に全員へ送っておく（5枚）", "id": "8-7"}]}, {"sub": "当日朝までに", "items": [{"tag": "刷", "text": "<b>5つの型の短冊<\/b>は第7時から貼ったまま（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.5〜7）。はがれていないか確かめる", "id": "8-8"}, {"tag": "刷", "text": "<b>5つの型の見本<\/b>（<code>03_掲示・教具/横書き/教具G_和食の心_5つの型の見本.html<\/code>。<b>A3縦5枚<\/b>）を、<b>型の短冊の下に同じ順で貼る<\/b>（はじめから出す）。入らなければ黒板横の掲示板へ", "id": "8-9"}, {"tag": "刷", "text": "<b>今日の流れ<\/b>（<code>03_掲示・教具/掲示物_第08時の流れ.html<\/code>。A4縦1枚 → <b>A3かB4に拡大<\/b>して黒板に貼る）。もとの「メニュー㋐〜㋔の短冊」の代わり", "id": "8-10"}, {"tag": "物", "text": "<b>机をグループ（5人×6）の形に<\/b>しておく。グループの中で<b>説明する順番<\/b>（例：座席の番号順）を決めておく", "id": "8-11"}, {"tag": "事", "text": "<b>ロイロノートの提出箱を型ごとに5つ<\/b>作る。箱の名前と順番は黒板の型の短冊とそろえ、<b>回答共有の設定<\/b>まで済ませておく（㋒で、説明する児童の構成メモを全員が見るため）", "id": "8-12"}, {"tag": "事", "text": "<b>五つの型の見本のカード<\/b>が全員に届いているか確かめる", "id": "8-13"}, {"tag": "刷", "text": "<b>見取り用の座席表<\/b>の2枚目を手元に", "id": "8-14"}, {"tag": "物", "text": "第4時の<b>学級の工夫マップ<\/b>を教室後方に掲示", "id": "8-15"}, {"tag": "刷", "text": "<b>高橋さんの文章の色分け拡大版<\/b>（<code>03_掲示・教具/横書き/教具A_和食の心_色分け拡大版.html<\/code>。<b>A3縦<\/b>）を手元に置く（読むことに困難のある児童用）", "id": "8-16"}, {"tag": "刷", "text": "<b>㋐の「書き出しの一文」<\/b>（<code>01_児童に配る/横書き/教具B_書き出しの一文_㋐.html<\/code>）を切って手元に（見本を読んでも手が止まる児童に渡す）", "id": "8-17"}, {"tag": "物", "text": "<b>iPadを充電<\/b>しておく", "id": "8-18"}, {"tag": "刷", "text": "<b>板書イメージ<\/b>（<code>02_教師用/横書き/板書イメージ_第08時.html<\/code>）を手元に。※流れの変更（11-16）に未対応。本時案の板書計画を正とする", "id": "8-19"}]}, {"sub": "直前10分で", "items": [{"tag": "刷", "text": "<b>構成メモ2種<\/b>の予備を教卓に（書き直したい児童用。<code>01_児童に配る/横書き/WS08_児童用_型あり.html<\/code>／<code>01_児童に配る/横書き/WS08_児童用_自由.html<\/code>）", "id": "8-20"}, {"tag": "刷", "text": "<b>説明の型・問い返しの型<\/b>（<code>03_掲示・教具/横書き/教具C_説明の型_関所.html<\/code>）を二つ折りにして各グループへ。<b>6部<\/b>", "id": "8-21"}, {"tag": "物", "text": "<b>ふせん<\/b>を<b>一人4枚<\/b>ずつ机に配る（120枚＋予備。75mm角くらい）", "id": "8-22"}, {"tag": "物", "text": "㋒で<b>2分半ごとに合図する<\/b>タイマー（一人2分半×5人）", "id": "8-23"}, {"tag": "刷", "text": "<b>情報カード（支援用）<\/b>を手元に", "id": "8-24"}, {"tag": "事", "text": "<b>支援順路のメモ<\/b>を手元に（構成メモが立っていない児童を先頭に）", "id": "8-25"}]}, {"sub": "児童の机上に出させるもの", "items": [{"tag": "", "text": "教科書／<b>立てた構成メモ（WS08）<\/b>／<b>WS07の2枚目（みりょく・仮の型・理由）<\/b>／ふせん4枚／赤ペン／iPad", "id": "8-26"}]}, {"sub": "参観者に配るもの（3点）", "items": [{"tag": "刷", "text": "<b>本時案<\/b>（<code>04_参観者用/指導案08_参観者用様式.docx<\/code>）", "id": "8-27"}, {"tag": "刷", "text": "<b>本時の流れの一覧<\/b>（<code>04_参観者用/参観者用_メニュー一覧.html<\/code>）※流れの変更（11-14・11-16）に合わせて直してから刷る", "id": "8-28"}, {"tag": "事", "text": "<b>児童の題材と伝えたいことの一覧（氏名なし）<\/b>。<code>04_参観者用/参観者用_題材一覧_様式.html<\/code> に入力して印刷（第7時終了後のAI整理＋教員の確認から）", "id": "8-29"}]}, {"sub": "想定外への備え（物として用意しておく）", "items": [{"tag": "", "text": "<b>ネットワークが落ちたとき<\/b>……見本は黒板の掲示で読む。㋒は<b>構成メモの現物<\/b>をグループの真ん中に置いて説明する。提出は授業後でよい", "id": "8-30"}]}]}, "9": {"title": "第9時まで　※実態により2時間扱い", "groups": [{"sub": "", "items": [{"tag": "刷", "text": "<b>「よさを伝えるときの言葉」の掲示<\/b>（<code>03_掲示・教具/横書き/掲示物_短冊.html<\/code> p.10。教科書 p.168 欄外）", "id": "9-1"}, {"tag": "物", "text": "<b>原稿用紙<\/b>", "id": "9-2"}, {"tag": "刷", "text": "<b>書き出しの一文を決める用紙<\/b>（<code>01_児童に配る/横書き/教具E_書き出しの用紙_第9時.html<\/code>）。手が止まる児童に渡す", "id": "9-3"}, {"tag": "事", "text": "清書を<b>ロイロで提出<\/b>させる設定（第10時の相互閲覧の準備）", "id": "9-4"}, {"tag": "刷", "text": "<b>清書用紙<\/b>（<code>01_児童に配る/縦書き/WS09_清書用紙_縦書き.html<\/code>。<b>A3横<\/b>・縦書き罫線28行・写真の枠と出典欄つき）。人数分＋予備。授業参観の廊下掲示にそのまま使う", "id": "9-5"}, {"tag": "刷", "text": "<b>清書用紙・自由配置の型<\/b>（<code>01_児童に配る/縦書き/WS09_清書用紙_自由配置_縦書き.html<\/code>。A3横・写真の枠なし・罫線33行）。写真の場所を自分で決めたい児童用。多めに", "id": "9-6"}, {"tag": "刷", "text": "<b>清書用紙・ほかのパターン<\/b>（<code>01_児童に配る/縦書き/<\/code> の <code>WS09_清書用紙_上下2段<\/code>／<code>_写真まん中<\/code>／<code>_写真2枚<\/code>／<code>_白紙<\/code>（＋<code>_白紙用下じき<\/code>）。どれもA3横）。児童が選べるよう各数枚。下じきは白紙を選んだ児童の数だけ", "id": "9-7"}]}]}, "10": {"title": "第10時まで", "groups": [{"sub": "", "items": [{"tag": "事", "text": "<b>全員の清書がロイロで相互閲覧できる状態<\/b>に", "id": "10-1"}, {"tag": "刷", "text": "<b>感想の型<\/b>（<code>01_児童に配る/横書き/教具F_感想の型_第10時.html<\/code>）。人数分", "id": "10-2"}, {"tag": "物", "text": "<b>ポートフォリオが全員分そろっているか<\/b>確認。第2時の絵（ロイロの提出箱）→ 第3時のふせん → 第4時のカード → 学習の手引き → 第8時の構成メモ → 作品 の順に整える", "id": "10-3"}, {"tag": "事", "text": "授業後、ポートフォリオと振り返りを<b>氏名を外して<\/b>AIで整理し、協議会資料にまとめる", "id": "10-4"}]}]}}, "prompts": [{"title": "１ 教材研究：筆者の工夫を三観点で洗い出す", "when": "第3時の準備（単元に入る前）", "prompts": ["ソース「本文」の「『鳥獣戯画』を読む」（高畑勲）の部分（p.156〜162）だけを根拠にしてください。\nこの文章で筆者が使っている「読者に伝えるための工夫」を、教科書 p.165 にある\n三つの観点に分けて書き出してください。\n\n １ 論の展開の工夫（何をどの順で示しているか）\n ２ 表現の工夫（言葉の選び方、文末、比喩、くり返し、読者への呼びかけなど）\n ３ 絵の示し方の工夫（どの絵を、どう切り取って、どこに置いているか）\n\n条件：\n・観点ごとに5つまで。多く挙げるより、本文の言葉で確かめられるものだけを挙げる。\n・1つにつき「工夫の名前／ページと行番号／引用（本文どおり一文）／\n  その工夫が読者にどう働くか」の4点を、この順で書く。\n・ページと行番号が特定できないものは挙げない。\n・6年生の児童が読み取れる範囲のものに絞る。専門用語で説明しない。", "いま挙げた工夫のうち、ソース「年間指導計画」のこの単元の評価規準\n（「読むこと」C(1)ア・ウ、知識・技能(1)ク）に結びつくものはどれですか。\n評価規準の文言を引用して、工夫ごとに示してください。結びつかないものは「なし」とします。"]}, {"title": "２ 支援資料のたたき台をつくる", "when": "第8時（本時）の準備", "prompts": ["黒板に貼る短冊と、児童に配る話し方の型を作ります。たたき台を複数案ください。\n選ぶのはこちらです。\n\n【授業の中身】\n自分が選んだ日本文化のよさを伝える文章を書く単元です。本時は、ソース「本文」の\np.167「文章の構成を考えるときは」にある五つの型から自分の目的に合うものを選び、\nなぜその構成にしたのかを友達に説明します。\n\n【作ってほしいもの】\n(1) まず、p.167 の五つの型を、本文どおりに写して並べる。\n(2) 黒板用の短冊5枚の文言。1枚15字以内。児童が一目で型を思い出せる言い方に。\n(3) 自分の構成を説明するときの話し方の型。3案。\n    「わたしがいちばん伝えたいのは○○です。だから、○○の型にしました。」を\n    土台にして、理由まで言えるように少し伸ばした形にする。\n(4) 聞き手が問い返すときの言い方。3案。責める言い方にならないもの。\n(5) (2)〜(4)で使った漢字のうち、ソース「漢字配当表」に無いものの一覧。無ければ「なし」。\n\n条件：\n・1文を短くする。長い修飾語を重ねない。\n・「頑張ろう」のような励ましは入れない。何をするかだけを書く。"]}, {"title": "２-２ 教師用情報カードのたたき台をつくる", "when": "第5〜7時（自由進度ブロック）の準備", "prompts": ["チェックを入れたソースは、学校図書館の本のページです。\n本で材料が集まらない児童のために、教師が「情報カード」を作ります。その候補を出してください。\n\n【題材】（ここに一つだけ書く。例：和紙）\n\n【やってほしいこと】\n(1) ソースに書かれている事実を8つまで。1つにつき1〜2文。\n    6年生が読んで分かる言葉に直してよいが、意味を変えない。\n(2) それぞれに、根拠にしたソースの名前（書名）と、そのページに書かれている元の文を添える。\n\n条件：\n・ソースに書かれていないことは挙げない。\n・数字（年・数・長さ）は、ソースに書かれているとおりにする。\n・「すばらしい」「美しい」などの評価は書かない。事実だけにする。"]}, {"title": "３ 第3時のあと：児童が書き出した工夫を三観点に分類する", "when": "第3時終了後〜第4時の準備", "prompts": ["ソース「第3時ふせん」は、6年生が「『鳥獣戯画』を読む」を読んで書き出した\n「筆者の工夫」の記述です。学級で共有する一覧を作るので、次のとおり整理してください。\n\n【分類の観点】\n １ 論の展開の工夫\n ２ 表現の工夫\n ３ 絵の示し方の工夫\n\n【やってほしいこと】\n(1) それぞれの記述を、上の三つのどれかに分ける。どれにも入らないものは\n    「その他」に置き、なぜ分けられなかったかを一言添える。\n(2) 観点ごとに、似た内容の記述をまとめ、何人がそれに触れたかを数える。\n(3) それぞれの記述が、ソース「本文」のどこを指していそうかを、ページと行番号で示す。\n    特定できないものは「特定できない」と書く。これは教師が確かめるための候補です。\n(4) 観点ごとに、本文にはあるのに「この学級ではほとんど出ていない」工夫を、\n    ページと行番号を添えて挙げる。次の時間に教師が補うべき点として使います。\n\n条件：\n・一つの記述が二つの観点にまたがる場合は、両方に置き、その旨を書く。"]}, {"title": "３-２ 分類した結果を「学級の工夫マップ」の形に整える", "when": "３の出力を教員が直し終えたあと（第4時の前日まで）", "prompts": ["【１ 論の展開の工夫】\n・さいしょがおすもうの実況みたいで、絵の中に入った感じがした　p.○ ○〜○行\n・（以下同じ形式）\n【２ 表現の工夫】\n・「ためしに、ぱ…」と言われて、本当にめくった　p.○ ○行\n【３ 絵の示し方の工夫】\n・（同じ形式）\n【まだ出ていないこと】（３の(4)から、教員が選んだものだけ）\n・（例）絵のどの部分を切り取って見せているか", "児童に配る「学級の工夫マップ」を作ります。\nソース「第3時分類（修正済み）」は、学級の児童が「『鳥獣戯画』を読む」を読んで見つけた\n「筆者の工夫」を、教師が三つの観点に分けたものです。\nこれを、A4横1枚に収まる印刷用のHTMLにしてください。\n\n【紙の形】\n・表題「学級の工夫マップ　―『鳥獣戯画』を読む―」。その下に一行で\n  「みんなが見つけた筆者の工夫です。自分が見つけていなかった工夫をさがそう。」\n・三つの観点を横に三列で並べる（左から　論の展開／表現／絵の示し方）。\n・一つの工夫を一つの枠に入れる。枠の中は\n  「児童の言葉（そのまま）」と「p.○ ○行（書いてあるものだけ）」の二つだけ。\n  何人が書いたかは出さない。\n・枠の並びは、教科書に出てくる順（ページ・行の小さい順）。ページが無いものは列の最後。\n・【まだ出ていないこと】がある場合だけ、下に全幅の枠を一つ置き、見出しを\n  「まだマップにない工夫はないかな？」とする。中身は問いの形にして、答えは書かない。\n\n【言葉の決まり】\n・児童番号・名前は出さない。\n・「よい工夫」「すばらしい」などの評価の言葉、順位、おすすめの印を付けない。\n  書いた人の多い少ないで、枠の大きさや色を変えない。\n\n【HTMLの決まり】\n・1ファイルで完結させる（外部ファイル・画像・JavaScriptを使わない）。\n・@page { size: A4 landscape; margin: 11mm; } 。寸法は mm と pt で指定する。\n・フォントは \"BIZ UDPGothic\" を先頭に置く。本文10.5pt、観点の見出し12pt。\n・枠線はグレー（#6a6a6a、1pt）。背景のぬりつぶしは、観点の見出しにうすい色を使う程度にする。\n・工夫の数が多くて1枚に収まらないときは、文字を小さくする前に、枠の間のすき間を詰める。\n  それでも入らないときは、入らなかった工夫を HTML の外に一覧で書き出して知らせる。\n・HTMLの中に、ソースの番号（［1］など）を入れない。\n\n最後に、HTMLとは別に次の二つを書いてください。\n(1) ソースにある工夫の数と、マップに入れた工夫の数（観点ごと）。\n(2) 写すときに一字でも変えた箇所があれば、その一覧。無ければ「なし」。"]}, {"title": "４ 第7時のあと：題材と「いちばん伝えたいみりょく」を一覧化する", "when": "第7時終了後〜本時（第8時）の準備。本時の支援の順路を決めるために使う", "prompts": ["ソース「第7時題材」は、6年生が「日本文化のよさを伝える文章」を書くために選んだ題材と、\n「いちばん伝えたいみりょく」の記述です。次の時間、この子たちはソース「本文」の\np.167 にある五つの構成の型から一つを選んで構成メモを作ります。\n\n【やってほしいこと】\n(1) 児童番号・題材・いちばん伝えたいみりょく、の3列の表にする。\n(2) 「いちばん伝えたいみりょく」が、次のどれに当たるか印を付ける。\n    Ａ 具体的に一つに絞れている\n    Ｂ 書いてはあるが、題材の説明にとどまっていて「みりょく」になっていない\n    Ｃ 空欄、または一言だけで何を伝えたいか読み取れない\n(3) ＢとＣの児童について、次の時間に教師がかける一言を1つずつ考える。\n    「がんばろう」ではなく、その子の記述の中の言葉を使って、\n    どこから書き始めればよいかを示す一言にする。\n(4) 題材が近い児童どうしを挙げる。交流の組み方を考える材料にします。\n(5) Ａの児童について、記述の中身が p.167 の五つの型のどれと結びつきやすいかを、\n    記述の言葉を根拠にして一つ挙げる。型を選ぶのは児童なので、これは教師の見当です。\n(6) 「いちばん伝えたいみりょく」か「仮の型」が空欄の児童を、別の表にまとめる。\n    カードの枚数が2枚以上なら「材料あり」、0〜1枚なら「材料不足」と書き添える。\n    次の時間の前に、教師が1対1で仕上げるための一覧です。\n\n条件：\n・ＡＢＣは支援の順番を決めるための印です。記述の優劣ではありません。\n・読み取れないものはＣにする。"]}, {"title": "５ 〔任意〕本時の共通課題の答えを想定しておく", "when": "本時の準備。活動４で児童から出る反応の見当をつける", "prompts": ["次の問いを、6年生全員に考えさせます。児童からどんな答えが出そうか、想定を挙げてください。\n\n【教材】ソース「本文」p.168〜169 の作例「和食の心」（高橋さんの文章）\n【問い】もし高橋さんが、p.167 の「『初め』に『問い』を書き、それに答えていく。」型で\n　　　　書いたら、どこが変わるか。\n\n【やってほしいこと】\n(1) まず、作例の今の構成を、本文の文を引用しながら3〜4段に分けて示す。\n(2) 6年生が実際に言いそうな答えを、児童の言葉づかいで10通り。\n(3) そのうち「順番が変わる」で止まっている答えと、「伝わり方が変わる」まで\n    届いている答えを分ける。\n(4) 「順番が変わる」で止まっている子に、教師がかける問い返しを3つ。"]}, {"title": "６ 第9時のあと：作品に使われた工夫を拾い、第10時の読み合いを準備する", "when": "第9時終了後〜第10時の準備", "prompts": ["ソース「第9時清書」は、6年生が書いた「日本文化のよさを伝える文章」です。\n次の時間、グループで読み合い、友達の文章に使われている「筆者の工夫」を指摘し合います。\nその準備として、次のとおり整理してください。\n\n【筆者の工夫の三つの観点】（「『鳥獣戯画』を読む」で学んだもの）\n １ 論の展開の工夫\n ２ 表現の工夫（読者への呼びかけ、文末、くり返し、たとえ など）\n ３ 絵の示し方の工夫（写真や図をどこに、どう置くか）\n\n【やってほしいこと】\n(1) 児童ごとに、文章の中で使われている工夫を、三つの観点に分けて挙げる。\n    1つにつき、文章から一文をそのまま引用する。\n(2) 児童ごとに、第4時に選んだ工夫が文章のどこで使われているかを示す。\n    見当たらない場合は「見当たらない」とだけ書く。\n(3) 本人が気づいていないかもしれない工夫（第4時に選んでいないのに使っているもの）を、\n    児童ごとに1つまで挙げる。\n(4) 使っている工夫の観点が重ならないように、4〜5人のグループの組み方を1案。\n\n条件：\n・直し方を書かない。\n・引用は、誤字があってもそのまま写す。"]}, {"title": "７ 第10時のあと：単元を通した学びの変化を整理する", "when": "単元終了後（研究のまとめ・報告の準備）", "prompts": ["ソース「第10時記録」は、6年生30人の、国語の単元を通した記録です。\n単元は「筆者の工夫をとらえて読み、それをいかして、日本文化のよさを伝える文章を書こう」。\n読む教材で見つけた「筆者の工夫」を選び（第4時）、構成の型を選び（第8時）、\n文章を書いて読み合い、振り返りました（第10時）。\n\n【やってほしいこと】\n(1) 児童ごとに、①で選んだ工夫を③で「使えた」と書いているかを、\n    「使えたと書いている／使えなかったと書いている／触れていない」の三つで分ける。\n(2) ④①で児童が「力がついた」と書いていることを、似たものどうしでまとめ、人数を数える。\n(3) ④②の記述を、「進めやすかった」「困った」「どちらとも言えない」で分け、\n    「困った」の中身を似たものどうしでまとめる。\n(4) 学級全体として、読むことで見つけた工夫が書くことにつながったと言えそうな記述を\n    5つまで、児童の言葉のまま抜き出す。つながらなかったことを示す記述も、同じ数だけ抜き出す。"]}], "konkyo": [{"p": 155, "l": null, "kw": "どう読み", "when": "1", "kan": "他", "memo": "単元の問い（扉）"}, {"p": 156, "l": null, "kw": "返し技", "when": "2・3", "kan": "表", "memo": "体言止め（文末を「―だ。」としない）。WS02 ア"   a.href = URL.createObjectURL(new Blob([text], { type }));

}

/* 場面（単元_進行マニュアル.html の各時の表）。すきま（第8時の24〜33分など）は「つづき」で埋める */
function scenes(n) {
  const s = D.scenes[n] || { rows: [], groups: [], tips: [] };
  const rows = s.rows.filter((r) => r.b > r.a), pts = s.rows.filter((r) => r.b === r.a);
  const out = []; let t = 0;
  rows.forEach((r) => {
    if (r.a > t) { const g = s.groups.find((x) => t >= x.a && t < x.b); out.push({ a: t, b: r.a, name: g ? `${g.name}（つづき）` : "（つづき）", do: "", say: [], gap: true }); }
    out.push(r); t = r.b;
  });
  if (out.length && t < 45) out.push({ a: t, b: 45, name: "（つづき）", do: "", say: [], gap: true });
  out.forEach((x) => { x.pts = pts.filter((p) => p.a >= x.a && p.a < x.b); });
  return { list: out, pts, groups: s.groups, tips: s.tips };
}
function marksFor(n) {
  const S2 = scenes(n);
  if (!S2.list.length) return [{ at: 40, t: "あと5分：ふりかえりへ", al: true }, { at: 45, t: "おわり", al: true }];
  const gs = S2.groups.map((g) => g.a);
  const out = [...S2.list.filter((x) => x.a > 0 && !x.gap), ...S2.pts].sort((a, b) => a.a - b.a)
    .map((x) => ({ at: x.a, t: strip(x.name), al: x.mark || gs.includes(x.a), kanjo: /関所の通過/.test(x.name) }));
  out.push({ at: 45, t: "おわり", al: true });
  return out;
}
function prepList(key) {

  return e.groups.map((g) => `${g.sub ? `<h3>${esc(g.sub)}</h3>` : ""}<ul class="chk">${g.items.map((it) =>
    `<li class="${S.checks[it.id] ? "done" : ""}"><label><input type="checkbox" data-c="${it.id}" ${S.checks[it.id] ? "checked" : ""}><span class="t">${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}${it.text}</span></label></li>`).join("")}</ul>`).join("");
}
function bindChecks(after) {
  $$("input[data-c]").forEach((c) => c.onchange = () => { S.checks[c.dataset.c] = c.checked; save(); c.closest("li").classList.toggle("done", c.checked); if (after) after(); });
}
function prepCount(key) {

}

const elapsed = () => (timer.acc + (timer.run ? Date.now() - timer.start : 0)) / 60000;
function startTimer() {

  timer.h = setInterval(() => { drawTimer(); drawHeaderClock(); }, 500);
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then((w) => (wake = w)).catch(() => {});
  drawTimer(); drawHeaderClock();
}
function pauseTimer() { if (!timer.run) return; timer.acc += Date.now() - timer.start; timer.run = false; clearInterval(timer.h); if (wake) { wake.release().catch(() => {}); wake = null; } drawTimer(); drawHeaderClock(); }
function resetTimer() { pauseTimer(); timer = { start: 0, acc: 0, run: false, fired: {}, h: null }; nowKey = ""; drawHeaderClock(); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && timer.run && "wakeLock" in navigator) navigator.wakeLock.request("screen").then((w) => (wake = w)).catch(() => {}); });
const mmss = (m) => `${String(Math.floor(m)).padStart(2, "0")}:${String(Math.floor((m % 1) * 60)).padStart(2, "0")}`;
function currentHit(m) { return marksFor(cur).filter((x) => x.al && m >= x.at && m < x.at + 1.5).pop(); }
function drawHeaderClock() {
  const h = $("#hdClock"); const m = elapsed();
  h.textContent = mmss(m);
  h.className = "mini" + (timer.run || m > 0 ? " run" : "") + (currentHit(m) ? " hit" : "");
  // 授業中の画面には大きい時計があるので、上の小さな時計は出さない
  h.style.display = tab === "today" && tmode === "jugyo" ? "none" : "";
}
function drawTimer() {
  const c = $("#clock"); if (!c) return;
  const m = elapsed(), mk = marksFor(cur), S2 = scenes(cur);
  c.textContent = mmss(m);
  const go = $("#tGo");
  go.textContent = timer.run ? "とめる" : m > 0 ? "つづける" : "はじめる";
  go.classList.toggle("run", timer.run);
  const nx = mk.find((x) => x.at > m);
  $("#nx").innerHTML = nx ? `次：${esc(nx.t.split(/[（「／、]/)[0].slice(0, 12))}まで <b>${mmss(nx.at - m)}</b>` : "";
  $("#nowLine").style.left = `calc(${Math.min(m / 45, 1) * 100}% - 2px)`; $("#past").style.width = `${Math.min(m / 45, 1) * 100}%`;
  let ci = S2.list.findIndex((x) => m >= x.a && m < x.b);
  if (ci < 0 && S2.list.length) ci = m >= 45 ? S2.list.length - 1 : 0;
  $$("[data-sc]").forEach((b) => { b.classList.toggle("cur", +b.dataset.sc === ci); b.classList.toggle("sel", +b.dataset.sc === scSel); });
  const show = scSel >= 0 ? scSel : ci;
  const key = `${show}/${scSel >= 0}/${Math.ceil((S2.list[show] || { b: 0 }).b - m)}/${timer.run || m > 0}`;
  if (key !== nowKey) {
    nowKey = key;
    $("#nowc").innerHTML = sceneCard(S2, show, m, scSel >= 0);
    const bk = $("#scBack"); if (bk) bk.onclick = () => { scSel = -1; nowKey = ""; drawTimer(); };
  }
  const hit = currentHit(m);
  const al = $("#alert");
  if (hit) {
    let extra = "";
    if (hit.kanjo) {
      const c2 = kakekoho();
      extra = c2.length ? `<div style="font-size:15px;font-weight:400;margin-top:4px">第5〜7時の記録で気になる番号：${c2.map((n) => `<span class="pill w">${n}</span>`).join("")}<br>この子たちの構成メモから見に行ってください。</div>` : "";
    }
    al.innerHTML = `${hit.at}分　${esc(hit.t)}${extra}`;
    if (!timer.fired[hit.at]) { timer.fired[hit.at] = 1; al.classList.remove("show"); void al.offsetWidth; }
    al.classList.add("show");
  } else { al.classList.remove("show"); }
}
function kakekoho() {
  const any = Object.values(S.seats).some((r) => r.g1 || r.g2 || r.g3 || r.star);
  if (!any) return [];
  const out = [];
  for (let i = 1; i <= S.set.n; i++) { const r = S.seats[i] || {}; if (r.star || !r.g3 || !r.g2) out.push(i); }
  return out;

  else { r[tool] = r[tool] ? "" : (/^g\d$/.test(tool) ? today() : "1"); const nm = TOOLS[mode].find(([k]) => k === tool)[1]; label = r[tool] ? nm : `${nm}を消す`; }

  <div class="card"><h2>児童用サイトのアドレス</h2>
    <p class="sub">「テレビに映す」で開くページです。</p>
    <input type="url" id="url" value="${esc(S.set.url)}" placeholder="https://○○.github.io/○○/" style="width:100%"></div>
  <div class="card"><h2>見取りの座席</h2>
    <div class="row"><label>人数 <input type="number" id="n" min="1" max="45" value="${S.set.n}" style="width:6em"></label>
    <label>1列のマス数 <input type="number" id="cols" min="3" max="10" value="${S.set.cols}" style="width:6em"></label></div>
    <p class="sub">マスは出席番号の順に並びます。</p></div>
  <div class="card"><h2>記録の保存</h2>
    <p>記録（見取り・チェック・予定日）は、<b>この iPad の Safari の中だけ</b>に保存されます。どこにも送られません。</p>
    <ul>
      <li>Safari の共有ボタン →「<b>ホーム画面に追加</b>」して、そこから開いてください。記録が消えにくくなります。</li>
      <li>毎時間の終わりに「書き出す」を押して、「ファイル」に保存しておいてください。</li>
    </ul>
    <div class="row"><button class="pri" id="bk">すべての記録を書き出す</button>
      <button id="rsBtn">書き出したファイルから戻す</button><input type="file" id="rs" accept="application/json,.json" style="display:none"></div>
    <p class="sub">最後に書き出した日：${esc(S.lastSave || "まだ")}</p>
    <details style="margin-top:12px"><summary>記録をすべて消す</summary><button id="wipe" style="border-color:var(--warn);color:var(--warn)">この iPad の記録をすべて消す</button></details>
  </div>`;
  $("#url").onchange = (e) => { S.set.url = e.target.value.trim(); save(); toast("保存しました"); };
  $("#n").onchange = (e) => { S.set.n = Math.max(1, Math.min(45, +e.target.value || 30)); save(); };
  $("#cols").onchange = (e) => { S.set.cols = Math.max(3, Math.min(10, +e.target.value || 6)); save(); };
  $("#bk").onclick = backup;
  $("#rsBtn").onclick = () => $("#rs").click();
  $("#rs").onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then((t) => { const o = JSON.parse(t); if (!o || typeof o !== "object" || !("seats" in o)) throw 0; S = Object.assign(S, o); save(); toast("戻しました"); vSet(); })
      .catch(() => toast("このファイルは読みこめませんでした"));
  };
  $("#wipe").onclick = () => { if (confirm("この iPad の記録をすべて消します。よろしいですか。")) { S = { checks: {}, dates: {}, kokai: "", seats: {}, ailog: [], cards: {}, set: S.set, lastSave: "" }; save(); vSet(); } };
}

render();
</script>
</body>
</html>
